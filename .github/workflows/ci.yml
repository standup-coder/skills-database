name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog (frontmatter / links / duplicates)
        run: npm run import:validate

      - name: Build web site
        run: npm run web:build

      - name: Ensure web build is up to date
        run: |
          if ! git diff --quiet tools/web/index.html; then
            echo "::error::tools/web/index.html is stale. Run 'npm run web:build' and commit."
            git diff --stat tools/web/index.html
            exit 1
          fi

      - name: Lint
        run: npm run lint
