<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills4Coder - 能力树</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f7f8fa;
      --bg-muted: #f1f3f5;
      --bg-hover: #eaecef;
      --border: #e5e7eb;
      --border-hover: #d1d5db;
      --text: #1a1a2e;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-light: #eff6ff;
      --accent-hover: #2563eb;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --magenta: #8b5cf6;
      --magenta-light: #f5f3ff;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --orange: #f97316;
      --orange-light: #fff7ed;
      --rose: #f43f5e;
      --rose-light: #fff1f2;
      --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --col1-width: 260px;
      --col2-width: 280px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* App Layout - Three Column */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-subtle);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 10;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar-logo-icon {
      width: 28px; height: 28px;
      background: var(--text);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
    }

    .sidebar-logo-text { font-size: 0.9rem; font-weight: 600; letter-spacing: -0.02em; }

    .sidebar-actions { display: flex; gap: 0.2rem; }

    .icon-btn {
      width: 26px; height: 26px;
      border: none; border-radius: 5px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }
    .icon-btn:hover { background: var(--bg-muted); color: var(--text); }

    /* Person Card */
    .person-card {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .person-card:hover { background: var(--bg-muted); }
    .person-card.active { background: var(--accent-light); }
    .person-name {
      font-size: 0.82rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.35rem;
    }
    .person-badge {
      font-size: 0.55rem; padding: 0.08rem 0.3rem;
      border-radius: 3px; font-weight: 600;
    }
    .person-badge.magenta { background: var(--magenta-light); color: var(--magenta); }
    .person-badge.blue { background: var(--accent-light); color: var(--accent); }
    .person-badge.green { background: var(--success-light); color: var(--success); }
    .person-meta { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.15rem; }

    /* Tree */
    .sidebar-tree {
      flex: 1; overflow-y: auto; padding: 0.35rem 0;
    }

    .skill-builder-section {
      border-top: 1px solid var(--border);
      padding: 0.75rem;
      background: var(--bg-subtle);
    }
    .skill-builder-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .skill-builder-title {
      font-size: 0.7rem; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .skill-builder-list {
      max-height: 200px; overflow-y: auto;
    }
    .skill-builder-list::-webkit-scrollbar { width: 4px; }
    .skill-builder-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Skill Builder Modal */
    .skill-builder-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 100;
      align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .skill-builder-modal.show { display: flex; }
    .skill-builder-panel {
      background: var(--bg); border-radius: 12px;
      width: 90%; max-width: 700px; max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .skill-builder-panel-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .skill-builder-panel-title { font-size: 1rem; font-weight: 600; }
    .skill-builder-panel-close {
      width: 28px; height: 28px; border: none;
      background: var(--bg-muted); border-radius: 6px;
      cursor: pointer; font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
    }
    .skill-builder-panel-close:hover { background: var(--border-hover); }
    .skill-builder-panel-body {
      flex: 1; overflow-y: auto; padding: 1.25rem;
    }
    .skill-builder-panel-body::-webkit-scrollbar { width: 6px; }
    .skill-builder-panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .skill-builder-panel-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 0.5rem;
    }

    .sb-field { margin-bottom: 1rem; }
    .sb-field label {
      display: block; font-size: 0.7rem; font-weight: 600;
      color: var(--text-secondary); margin-bottom: 0.35rem;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .sb-field input[type="text"] {
      width: 100%; padding: 0.6rem 0.75rem;
      border: 1px solid var(--border); border-radius: 7px;
      font-size: 0.85rem; background: var(--bg);
    }
    .sb-field input[type="text"]:focus {
      outline: none; border-color: var(--accent);
    }
    .sb-field input[type="text"].sb-name-input {
      font-size: 1.1rem; font-weight: 600;
      padding: 0.75rem 1rem;
    }
    .sb-field textarea {
      width: 100%; padding: 0.6rem 0.75rem;
      border: 1px solid var(--border); border-radius: 7px;
      font-size: 0.8rem; font-family: var(--font-mono);
      resize: vertical; min-height: 60px; background: var(--bg);
    }
    .sb-field textarea:focus { outline: none; border-color: var(--accent); }
    .sb-section-title {
      font-size: 0.75rem; font-weight: 600;
      color: var(--text); margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .sb-section-title::before {
      content: ''; width: 3px; height: 12px;
      background: var(--accent); border-radius: 2px;
    }

    /* Tags input */
    .sb-tags-input {
      display: flex; flex-wrap: wrap; gap: 0.3rem;
      padding: 0.4rem; border: 1px solid var(--border);
      border-radius: 7px; background: var(--bg);
      min-height: 42px; align-items: center;
    }
    .sb-tags-input:focus-within { border-color: var(--accent); }
    .sb-tag {
      display: flex; align-items: center; gap: 0.25rem;
      padding: 0.2rem 0.5rem;
      background: var(--accent-light); color: var(--accent);
      border-radius: 4px; font-size: 0.7rem; font-weight: 500;
    }
    .sb-tag-remove {
      cursor: pointer; opacity: 0.7; font-size: 0.7rem;
    }
    .sb-tag-remove:hover { opacity: 1; }
    .sb-tags-input input {
      border: none; background: transparent;
      font-size: 0.75rem; padding: 0.2rem;
      min-width: 80px; flex: 1;
    }
    .sb-tags-input input:focus { outline: none; }

    .tree-section { margin-bottom: 0.15rem; }

    .tree-section-header {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.72rem; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: pointer; user-select: none;
      transition: color 0.15s ease;
    }
    .tree-section-header:hover { color: var(--text); }
    .tree-section-header .chevron { font-size: 0.55rem; transition: transform 0.15s ease; }
    .tree-section-header.collapsed .chevron { transform: rotate(-90deg); }
    .tree-section-header .header-actions { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s ease; }
    .tree-section-header:hover .header-actions { opacity: 1; }

    .tree-section-body { overflow: hidden; transition: max-height 0.2s ease; }
    .tree-section-body.collapsed { max-height: 0 !important; }

    .tree-item {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tree-item:hover { background: var(--bg-hover); }
    .tree-item.active { background: var(--accent-light); color: var(--accent-hover); }

    .tree-item-indent-1 { padding-left: 1.25rem; }
    .tree-item-indent-2 { padding-left: 2rem; }
    .tree-item-indent-3 { padding-left: 2.75rem; }

    .tree-item-icon {
      width: 16px; height: 16px; border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.5rem; font-weight: 700; flex-shrink: 0;
    }
    .tree-item-icon.person { background: var(--accent-light); color: var(--accent); }
    .tree-item-icon.role { background: var(--magenta-light); color: var(--magenta); }
    .tree-item-icon.skill { background: var(--accent-light); color: var(--accent); }
    .tree-item-icon.atomic { background: var(--success-light); color: var(--success); }
    .tree-item-icon.knowledge { background: var(--warning-light); color: var(--warning); }

    .tree-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .tree-item-dots { display: flex; gap: 1px; }
    .tree-item-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); }
    .tree-item-dot.f1 { background: var(--rose); }
    .tree-item-dot.f2 { background: var(--orange); }
    .tree-item-dot.f3 { background: var(--warning); }
    .tree-item-dot.f4 { background: var(--accent); }
    .tree-item-dot.f5 { background: var(--success); }

    .tree-item-tag {
      font-family: var(--font-mono);
      font-size: 0.5rem; padding: 0.05rem 0.25rem;
      border-radius: 2px; font-weight: 600;
    }
    .tree-item-tag.project { background: var(--bg-muted); color: var(--text-muted); }
    .tree-item-tag.custom { background: var(--accent-light); color: var(--accent); }

    .tree-item-actions { display: flex; gap: 1px; opacity: 0; transition: opacity 0.15s ease; }
    .tree-item:hover .tree-item-actions { opacity: 1; }
    .tree-item-actions .icon-btn { width: 20px; height: 20px; font-size: 0.65rem; }

    /* Skill Builder */
    .skill-builder-tab {
      padding: 0.5rem 1rem;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    .skill-builder-btn {
      width: 100%; padding: 0.5rem;
      background: var(--text); color: white;
      border: none; border-radius: 7px;
      font-size: 0.75rem; font-weight: 600;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      gap: 0.4rem; transition: all 0.15s ease;
    }
    .skill-builder-btn:hover { background: #2a2a3e; transform: translateY(-1px); }
    .skill-builder-btn svg { width: 14px; height: 14px; }

    .skill-list-item {
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem; cursor: pointer;
      display: flex; align-items: center; gap: 0.4rem;
      border-radius: 6px; transition: all 0.15s ease;
    }
    .skill-list-item:hover { background: var(--bg-muted); }
    .skill-list-item.active { background: var(--accent-light); color: var(--accent-hover); }
    .skill-list-item .skill-icon {
      width: 18px; height: 18px; border-radius: 4px;
      background: var(--accent-light); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; font-weight: 700;
    }
    .skill-list-item .skill-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .skill-list-item .skill-steps { font-size: 0.6rem; color: var(--text-muted); }
    .skill-list-item .skill-actions { display: flex; gap: 2px; opacity: 0; }
    .skill-list-item:hover .skill-actions { opacity: 1; }

    /* Prompt Step */
    .prompt-step {
      background: var(--bg-subtle); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem;
      position: relative;
    }
    .prompt-step-header {
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;
    }
    .prompt-step-num {
      font-family: var(--font-mono); font-size: 0.6rem;
      background: var(--text); color: white;
      width: 18px; height: 18px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .prompt-step textarea {
      width: 100%; min-height: 80px;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 0.6rem; font-size: 0.8rem; font-family: var(--font-mono);
      resize: vertical; background: var(--bg);
    }
    .prompt-step textarea:focus { outline: none; border-color: var(--accent); }
    .prompt-step-type {
      display: flex; gap: 0.5rem; margin-top: 0.5rem;
    }
    .prompt-step-type label {
      font-size: 0.65rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 0.25rem; cursor: pointer;
    }
    .prompt-step-type input[type="radio"] { accent-color: var(--accent); }
    .prompt-step-remove {
      position: absolute; top: 0.5rem; right: 0.5rem;
      width: 20px; height: 20px; border: none;
      background: transparent; color: var(--text-muted);
      cursor: pointer; font-size: 0.8rem;
    }
    .prompt-step-remove:hover { color: var(--danger); }

    .add-step-btn {
      width: 100%; padding: 0.6rem;
      border: 1px dashed var(--border); border-radius: 8px;
      background: transparent; color: var(--text-muted);
      font-size: 0.75rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 0.4rem; transition: all 0.15s ease;
    }
    .add-step-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Skill Generator Preview */
    .skill-preview {
      background: #1a1a2e; color: #a8dadc;
      border-radius: 8px; padding: 1rem; margin-top: 1rem;
      font-family: var(--font-mono); font-size: 0.7rem;
      max-height: 300px; overflow-y: auto;
      white-space: pre-wrap; line-height: 1.6;
    }
    .skill-preview-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.75rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(168,218,220,0.2);
    }
    .skill-preview-title { font-weight: 600; color: #f1faee; }
    .skill-preview-copy {
      background: rgba(168,218,220,0.2); border: none;
      color: #a8dadc; padding: 0.3rem 0.6rem;
      border-radius: 4px; cursor: pointer; font-size: 0.65rem;
    }
    .skill-preview-copy:hover { background: rgba(168,218,220,0.3); }

    /* App Layout - Three Column */
    .app-layout {
      display: grid;
      grid-template-columns: var(--col1-width) var(--col2-width) 1fr;
      min-height: 100vh;
    }

    /* Column 1 - 岗位列表 */
    .col-roles {
      background: var(--bg-subtle);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    /* Column 2 - 技能列表 */
    .col-skills {
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    /* Column 3 - 详情展示 */
    .col-detail {
      min-height: 100vh;
      background: var(--bg);
    }

    /* Top Bar */
    .top-bar {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-bar-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .top-bar-logo-icon {
      width: 28px; height: 28px;
      background: var(--text);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-family: var(--font-mono);
      font-size: 0.7rem; font-weight: 600;
    }
    .top-bar-title { font-size: 0.9rem; font-weight: 600; }
    .top-bar-actions { display: flex; gap: 0.25rem; }

    /* Column Header */
    .col-header {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .col-title {
      font-size: 0.72rem; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .col-count {
      font-family: var(--font-mono);
      font-size: 0.6rem; color: var(--text-muted);
    }

    /* Column Body - Scrollable */
    .col-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }
    .col-body::-webkit-scrollbar { width: 4px; }
    .col-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Column Section Header */
    .col-section-header {
      padding: 0.5rem 0.85rem 0.35rem;
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    /* Role Item */
    .role-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.85rem;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s ease;
      border-left: 3px solid transparent;
    }
    .role-item:hover { background: var(--bg-hover); }
    .role-item.active {
      background: var(--accent-light);
      border-left-color: var(--accent);
    }
    .role-item-icon {
      width: 22px; height: 22px;
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 700;
      flex-shrink: 0;
    }
    .role-item-icon.role { background: var(--magenta-light); color: var(--magenta); }
    .role-item-name { flex: 1; font-weight: 500; }
    .role-item-meta { font-size: 0.65rem; color: var(--text-muted); }

    /* Skill Category */
    .skill-cat {
      margin-bottom: 0.5rem;
    }
    .skill-cat-header {
      padding: 0.35rem 0.85rem;
      font-size: 0.62rem; font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
    }
    .skill-cat-items { padding: 0.25rem 0; }

    /* Skill Item */
    .skill-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.85rem 0.45rem 1.1rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
      border-left: 3px solid transparent;
    }
    .skill-item:hover { background: var(--bg-hover); }
    .skill-item.active {
      background: var(--accent-light);
      border-left-color: var(--accent);
    }
    .skill-item.associated { opacity: 1; }
    .skill-item.unassociated { opacity: 0.6; }
    .skill-item-icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.5rem; font-weight: 700;
      flex-shrink: 0;
    }
    .skill-item-icon.skill { background: var(--accent-light); color: var(--accent); }
    .skill-item-icon.atomic { background: var(--success-light); color: var(--success); }
    .skill-item-name { flex: 1; }
    .skill-item-dots { display: flex; gap: 2px; }
    .skill-item-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); }
    .skill-item-dot.filled { border: none; }
    .skill-item-tag {
      font-size: 0.5rem; padding: 0.05rem 0.3rem;
      border-radius: 2px; font-weight: 600;
      font-family: var(--font-mono);
    }
    .skill-item-tag.custom { background: var(--accent-light); color: var(--accent); }

    /* Kp Item */
    .kp-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem 0.35rem 1.35rem;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .kp-item:hover { background: var(--bg-hover); }
    .kp-item.active { background: var(--warning-light); }
    .kp-item-icon {
      width: 14px; height: 14px;
      border-radius: 3px;
      background: var(--warning-light); color: var(--warning);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.45rem; font-weight: 700;
      flex-shrink: 0;
    }
    .kp-item-name { flex: 1; color: var(--text); }
    .kp-item-level { font-size: 0.6rem; color: var(--text-muted); }

    /* Back Button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.75rem;
      margin: 0.5rem 0.85rem;
      font-size: 0.72rem;
      color: var(--accent);
      background: var(--accent-light);
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .back-btn:hover { background: var(--accent); color: white; }

    /* Detail Area */
    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--text-muted);
      text-align: center;
    }
    .detail-empty-icon { font-size: 3rem; opacity: 0.3; margin-bottom: 1rem; }
    .detail-empty-text { font-size: 0.85rem; }

    .detail-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .detail-breadcrumb {
      display: flex; align-items: center; gap: 0.3rem;
      font-size: 0.68rem; color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    .detail-breadcrumb a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .detail-breadcrumb a:hover { text-decoration: underline; }
    .detail-title {
      font-size: 1.1rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .detail-banner {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      margin: 0.75rem 1.5rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .detail-banner .tag {
      font-family: var(--font-mono); font-size: 0.55rem;
      padding: 0.08rem 0.3rem;
      background: var(--magenta-light); color: var(--magenta);
      border-radius: 3px; font-weight: 600;
    }
    .detail-body { padding: 1rem 1.5rem; }

    /* Detail Cards */
    .detail-section { margin-bottom: 1.25rem; }
    .detail-section-title {
      font-size: 0.65rem; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border);
    }
    .detail-cards {
      display: grid;
      gap: 0.75rem;
    }
    .detail-cards.cols-2 { grid-template-columns: 1fr 1fr; }
    .detail-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .detail-card-label {
      font-size: 0.65rem; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }
    .detail-label {
      font-size: 0.65rem; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }
    .detail-card-value { font-size: 0.85rem; color: var(--text); }

    /* Child Items (skill list items) */
    .children-list { display: flex; flex-direction: column; gap: 0.25rem; }
    .child-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .child-item:hover { background: var(--bg-hover); border-color: var(--border-hover); }
    .child-item.associated { border-color: var(--accent); background: var(--accent-light); }
    .child-item.unassociated { opacity: 0.8; }
    .child-name { flex: 1; font-size: 0.82rem; font-weight: 500; }
    .child-desc { font-size: 0.72rem; color: var(--text-muted); }
    .child-meta { font-size: 0.65rem; color: var(--text-muted); }
    .child-actions { display: flex; gap: 0.25rem; }
    .child-item[style*="cursor:default"] { cursor: default !important; }
    .child-item[style*="cursor:default"]:hover { background: var(--bg); border-color: var(--border); }

    /* Detail Grid & Layout */
    .detail-grid {
      display: grid;
      gap: 0.75rem;
    }
    .detail-card.full { grid-column: 1 / -1; }
    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .content-body {
      padding: 1.25rem 1.5rem;
    }
    .content-title {
      font-size: 1.1rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem;
      margin-top: 0.25rem;
    }
    .content-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    /* Project Banner & Breadcrumb */
    .project-banner {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 1rem;
      margin-bottom: 1rem;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
    .project-banner .tag {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 600;
    }
    .breadcrumb {
      display: flex; align-items: center; gap: 0.25rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .breadcrumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb-sep { color: var(--text-muted); }

    /* Progress Rating */
    .progress-rating { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .progress-option {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.2rem; cursor: pointer;
      padding: 0.35rem 0.45rem;
      border-radius: 7px;
      border: 2px solid var(--border);
      transition: all 0.15s ease;
      min-width: 52px;
    }
    .progress-option:hover { border-color: var(--border-hover); background: var(--bg); }
    .progress-option.selected { border-width: 2px; }
    .progress-option[data-level="1"].selected { border-color: var(--rose); background: var(--rose-light); }
    .progress-option[data-level="2"].selected { border-color: var(--orange); background: var(--orange-light); }
    .progress-option[data-level="3"].selected { border-color: var(--warning); background: var(--warning-light); }
    .progress-option[data-level="4"].selected { border-color: var(--accent); background: var(--accent-light); }
    .progress-option[data-level="5"].selected { border-color: var(--success); background: var(--success-light); }
    .progress-dots { display: flex; gap: 2px; }
    .progress-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bg-muted); border: 1px solid var(--border); }
    .progress-dot.filled { border: none; }
    .progress-option[data-level="1"] .progress-dot.filled { background: var(--rose); }
    .progress-option[data-level="2"] .progress-dot.filled { background: var(--orange); }
    .progress-option[data-level="3"] .progress-dot.filled { background: var(--warning); }
    .progress-option[data-level="4"] .progress-dot.filled { background: var(--accent); }
    .progress-option[data-level="5"] .progress-dot.filled { background: var(--success); }
    .progress-label { font-size: 0.58rem; font-weight: 500; color: var(--text-secondary); }
    .progress-option.selected .progress-label { font-weight: 600; }

    /* Tech Stack Tags */
    .tech-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tech-tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 0.2rem 0.5rem;
      background: var(--bg-muted);
      border-radius: 4px;
      color: var(--text-secondary);
    }

    /* Steps List */
    .steps-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .step-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.7rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.75rem;
    }
    .step-num {
      font-family: var(--font-mono); font-size: 0.58rem;
      background: var(--text); color: white;
      width: 18px; height: 18px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .step-name { flex: 1; }

    /* Tag Selector */
    .tag-selector { display: flex; gap: 0.4rem; }
    .tag-option {
      padding: 0.35rem 0.85rem;
      border: 2px solid var(--border);
      border-radius: 7px;
      cursor: pointer; font-size: 0.78rem;
      font-weight: 500;
      transition: all 0.15s ease;
      background: var(--bg);
      display: flex; align-items: center; gap: 0.25rem;
    }
    .tag-option:hover { border-color: var(--border-hover); }
    .tag-option.selected.beginner { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
    .tag-option.selected.advanced { border-color: var(--warning); background: var(--warning-light); color: var(--warning); }

    /* Add Button */
    .add-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 0.3rem;
      padding: 0.4rem;
      border: 1px dashed var(--border);
      border-radius: 7px;
      background: transparent; color: var(--text-muted);
      font-size: 0.7rem; cursor: pointer;
      transition: all 0.15s ease;
      margin: 0.25rem 0.85rem;
    }
    .add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

    /* Icon Btn */
    .icon-btn {
      width: 26px; height: 26px;
      border: none; border-radius: 5px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }
    .icon-btn:hover { background: var(--bg-muted); color: var(--text); }

    /* Stats Chips */
    .stats-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .stats-chip {
      display: flex; align-items: center; gap: 0.25rem;
      padding: 0.25rem 0.5rem;
      background: var(--bg-subtle);
      border-radius: 5px; font-size: 0.68rem;
    }
    .stats-chip-dot { width: 5px; height: 5px; border-radius: 50%; }
    .stats-chip-value { font-weight: 600; font-family: var(--font-mono); }
    .stats-chip-label { color: var(--text-secondary); }

    /* Notes */
    .notes-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .note-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem;
    }
    .note-content { font-size: 0.8rem; line-height: 1.6; white-space: pre-wrap; }
    .note-meta { display: flex; gap: 0.6rem; margin-top: 0.35rem; font-size: 0.62rem; color: var(--text-muted); font-family: var(--font-mono); }
    .note-add-row { display: flex; gap: 0.35rem; margin-top: 0.4rem; align-items: flex-start; }
    .note-add-row textarea {
      flex: 1; min-height: 50px; padding: 0.4rem;
      border: 1px solid var(--border); border-radius: 7px;
      font-family: var(--font-sans); font-size: 0.8rem;
      resize: vertical; background: var(--bg);
    }
    .note-add-row textarea:focus { outline: none; border-color: var(--accent); }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg); border-radius: 12px; padding: 1.25rem;
      width: 420px; max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .modal-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; }
    .modal-field { margin-bottom: 0.75rem; }
    .modal-field label { display: block; font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.25rem; }
    .modal-field input, .modal-field textarea {
      width: 100%; padding: 0.5rem 0.65rem;
      border: 1px solid var(--border); border-radius: 7px;
      font-family: var(--font-sans); font-size: 0.82rem;
      color: var(--text); background: var(--bg);
      transition: all 0.15s ease;
    }
    .modal-field input:focus, .modal-field textarea:focus { outline: none; border-color: var(--accent); }
    .modal-field textarea { min-height: 70px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.4rem; margin-top: 1rem; }

    .btn {
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border); border-radius: 7px;
      font-family: var(--font-sans); font-size: 0.75rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s ease;
      background: var(--bg); color: var(--text);
    }
    .btn:hover { background: var(--bg-muted); }
    .btn-primary { background: var(--text); color: white; border-color: var(--text); }
    .btn-primary:hover { opacity: 0.85; }
    .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
    .btn-danger:hover { opacity: 0.85; }
    .btn-sm { padding: 0.25rem 0.55rem; font-size: 0.68rem; }

    /* Toast */
    .toast-container {
      position: fixed; bottom: 1rem; right: 1rem; z-index: 200;
      display: flex; flex-direction: column; gap: 0.25rem;
    }
    .toast {
      padding: 0.45rem 0.8rem;
      background: var(--text); color: white;
      border-radius: 7px; font-size: 0.72rem;
      animation: toastIn 0.2s ease-out;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Skill Builder */
    .skill-builder-section {
      border-top: 1px solid var(--border);
      padding: 0.75rem;
      background: var(--bg-subtle);
      margin-top: auto;
    }
    .skill-builder-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .skill-builder-title {
      font-size: 0.68rem; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .skill-builder-list { max-height: 150px; overflow-y: auto; }
    .skill-builder-list::-webkit-scrollbar { width: 4px; }
    .skill-builder-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .skill-list-item {
      padding: 0.4rem 0.65rem;
      font-size: 0.72rem; cursor: pointer;
      display: flex; align-items: center; gap: 0.35rem;
      border-radius: 6px; transition: all 0.15s ease;
    }
    .skill-list-item:hover { background: var(--bg-muted); }
    .skill-list-item.active { background: var(--accent-light); color: var(--accent-hover); }
    .skill-list-item .skill-icon {
      width: 16px; height: 16px; border-radius: 4px;
      background: var(--accent-light); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.5rem; font-weight: 700;
    }
    .skill-list-item .skill-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .skill-list-item .skill-actions { display: flex; gap: 2px; opacity: 0; }
    .skill-list-item:hover .skill-actions { opacity: 1; }

    /* Responsive */
    @media (max-width: 1024px) {
      .app-layout { grid-template-columns: var(--col1-width) 1fr; }
      .col-skills { display: none; }
    }
    @media (max-width: 768px) {
      .app-layout { grid-template-columns: 1fr; }
      .col-roles { display: none; }
      .col-skills { display: none; }
      .col-detail { display: block; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Column 1: 岗位列表 -->
    <div class="col-roles" id="col-roles">
      <div class="top-bar">
        <div class="top-bar-logo">
          <div class="top-bar-logo-icon">S4</div>
          <span class="top-bar-title">能力树</span>
        </div>
        <div class="top-bar-actions">
          <button class="icon-btn" onclick="exportData()" title="导出">↓</button>
          <button class="icon-btn" onclick="importData()" title="导入">↑</button>
          <button class="icon-btn" onclick="saveCustomData()" title="保存" style="background:var(--success-light);color:var(--success)">✓</button>
          <button class="icon-btn" onclick="openSkillBuilder()" title="Skills 生成器" style="background:var(--accent-light);color:var(--accent)">⚡</button>
        </div>
      </div>
      <div class="col-header">
        <span class="col-title">我的岗位</span>
        <span class="col-count" id="role-count">0</span>
      </div>
      <div class="col-body" id="col-roles-body"></div>
    </div>

    <!-- Column 2: 技能列表 -->
    <div class="col-skills" id="col-skills">
      <div class="col-header">
        <span class="col-title" id="col-skills-title">选择岗位</span>
        <span class="col-count" id="skill-count">0</span>
      </div>
      <div class="col-body" id="col-skills-body"></div>
    </div>

    <!-- Column 3: 详情展示 -->
    <div class="col-detail" id="col-detail"></div>
  </div>
  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal"></div></div>
  <div class="toast-container" id="toast-container"></div>
  <input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImport(event)">

  <!-- Skill Builder Modal -->
  <div class="skill-builder-modal" id="skill-builder-modal">
    <div class="skill-builder-panel">
      <div class="skill-builder-panel-header">
        <span class="skill-builder-panel-title" id="sb-panel-title">⚡ 创建 Skill</span>
        <button class="skill-builder-panel-close" onclick="closeSkillBuilder()">✕</button>
      </div>
      <div class="skill-builder-panel-body">
        <div class="sb-field">
          <label>Skill 名称</label>
          <input type="text" id="sb-skill-name" class="sb-name-input" placeholder="例如：代码审查、数据分析...">
        </div>
        <div class="sb-field">
          <label>描述</label>
          <textarea id="sb-skill-desc" placeholder="简要描述这个 Skill 的用途..."></textarea>
        </div>
        <div class="sb-field">
          <label>分类</label>
          <input type="text" id="sb-skill-category" placeholder="例如：development, operations, product...">
        </div>
        <div class="sb-field">
          <label>标签</label>
          <div class="sb-tags-input" id="sb-tags-container">
            <input type="text" id="sb-tags-input" placeholder="输入标签后按回车添加">
          </div>
        </div>
        <div class="sb-section-title">Prompt 步骤</div>
        <p style="font-size:0.7rem;color:var(--text-muted);margin-bottom:0.75rem">输入任务执行过程中的多个 Prompt，逐步引导 AI 完成复杂任务。每个步骤可以是"LLM 推理"或"格式化输出"。</p>
        <div id="sb-steps-container"></div>
        <button class="add-step-btn" onclick="addPromptStep()">+ 添加步骤</button>
        <div class="skill-preview" id="sb-preview" style="display:none">
          <div class="skill-preview-header">
            <span class="skill-preview-title">生成的 Skill JSON</span>
            <button class="skill-preview-copy" onclick="copySkillJson()">复制</button>
          </div>
          <div id="sb-preview-content"></div>
        </div>
      </div>
      <div class="skill-builder-panel-footer">
        <button class="btn" onclick="closeSkillBuilder()">取消</button>
        <button class="btn btn-primary" onclick="saveSkillBuilder()">保存 Skill</button>
      </div>
    </div>
  </div>

  <script>
    // ===== PROJECT DATA (from roles/, skills/, atomic-skills/) =====
    const PROJECT = {
      roles: [
        {
          id: 'backend-architect', name: '后端架构师', nameEn: 'Backend Architect',
          desc: '后端架构师是系统设计和团队技术引领的核心角色。负责制定技术架构路线图、评审技术方案、解决复杂技术问题、指导后端团队成长。核心职责包括：系统架构设计（微服务/事件驱动/云原生）；技术选型决策（语言/框架/中间件/数据库）；代码审查与规范制定；性能优化与容量规划；跨团队技术沟通与协作。后端架构师需要 6+ 年经验，精通分布式系统设计，具备大规模高并发系统经验，熟悉云原生技术栈，具备良好的技术沟通能力',
          level: 'senior',
          mainSkills: ['system-design','database-design','api-design','code-review','generate-deployment-guide'],
          atomicSkills: ['read-file','write-file','run-tests','database-query','api-request','analyze-code'],

      skills: [
        // === SRE Core Skills (with knowledge points) ===
        { id: 'sre-fundamentals', name: 'SRE 基础理论', nameEn: 'SRE Fundamentals', desc: 'SRE（Site Reliability Engineering）核心理念与最佳实践：可靠性工程哲学、Error Budget 策略、Toil 消除、SRE 生命周期、跨团队协作模式。SRE 源于 Google，将软件工程方法应用于运维，追求 reliability = 1 - unplanned downtime', category: 'sre-core',
          steps: ['llm','transform'],
          knowledgePoints: [
            { id: 'kp-sre-sli', name: 'SLI（服务等级指标）', desc: 'Service Level Indicator - 衡量服务可靠性的精确量化指标。核心 SLI：可用性（success rate）、延迟（latency）、吞吐量（throughput）、错误率（error rate）、持久性（durability）。测量方式：红黑检测、合成监控、主动探测、被动日志分析' },
            { id: 'kp-sre-slo', name: 'SLO（服务等级目标）', desc: 'Service Level Objective - SLI 的目标值，是向用户承诺的可靠性基准。示例：99.9% 月可用性（每月 43.8 分钟停机）、P99 延迟 < 200ms、99.95% 请求成功率。SLO 是 Error Budget 的基础，也是业务决策的关键输入' },
            { id: 'kp-sre-sla', name: 'SLA（服务等级协议）', desc: 'Service Level Agreement - 面向客户的正式承诺，具有法律效力的可靠性保障协议。SLA 通常比内部 SLO 更宽松（如 SLA 99.9% = SLO 99.95%），违规有赔偿条款。SRE 需要确保 SLO 达成率远高于 SLA 要求' },
            { id: 'kp-sre-error-budget', name: 'Error Budget（错误预算）', desc: 'Error Budget = 1 - SLO，是允许的"犯错空间"。核心价值：量化可靠性与迭代速度的平衡。例如 SLO 99.9% 的月 Error Budget = 43.8 分钟。Error Budget 充足时加速发布，耗尽时暂停变更。Burn rate 告警用于提前预警' },
            { id: 'kp-sre-toil', name: 'Toil（运维杂务）', desc: 'Toil 定义：手工、重复、可自动化、没有持久价值的工作。SRE 目标：Toil < 50% 个人工作。Toil 四象限：1) 手工重复任务 2) 临时脚本 3) 简单监控处理 4) 迁移/升级。消除 Toil 三步法：识别→量化→自动化或委托' },
            { id: 'kp-sre-blameless', name: '无指责文化（Blameless Culture）', desc: '故障复盘的核心原则：聚焦系统缺陷和改进措施，而非追究个人责任。关键实践：所有复盘都是安全的、分享信息是奖励的不是惩罚的、Action Items 有明确所有人和完成时间。防止"事后诸葛亮"和"拇指指向"文化' },
            { id: 'kp-sre-hierarchy', name: 'SRE 团队组织模式', desc: '集中式 SRE（Center of Excellence）vs 嵌入式 SRE（每产品线配备）。混合模式：核心平台 SRE + 产品线 SRE联络人。SRE 与 DevOps 的区别：SRE 是 DevOps 的具体实现，专注可靠性' },
            { id: 'kp-sre-terms', name: 'SRE 核心指标', desc: 'SLO 达成率 = (SLI >= SLO 的时间) / 总时间；Error Budget 燃尽率 = 消耗的 Error Budget / 已用时间；Toil 占比 = Toil 时间 / 总工作時間；MTTD（平均故障发现时间）；MTTR（平均故障恢复时间）；Availability = MTBF / (MTBF + MTTR)' }
          ],

        { id: 'prometheus-monitoring', name: 'Prometheus 监控', nameEn: 'Prometheus Monitoring', desc: 'Prometheus 是云原生监控的事实标准，提供指标采集、存储、查询和告警能力。本技能覆盖 Prometheus 架构、四种指标类型、PromQL 查询、告警规则、服务发现、高可用部署和长期存储方案', category: 'observability',
          steps: ['http-health-check','llm','transform'],
          knowledgePoints: [
            { id: 'kp-prom-metrics', name: '四种指标类型', desc: 'Counter（只增计数器）：累计请求数/错误数，用于 rate() 计算；Gauge（仪表盘）：可增可减的当前值，如 CPU/内存；Histogram（直方图）：请求延迟分布，自动计算 P50/P90/P99，Bucket 桶设计；Summary（摘要）：与 Histogram 类似但服务端计算分位数，缺点是不可聚合' },
            { id: 'kp-prom-promql', name: 'PromQL 查询语言', desc: '核心函数：rate()/irate() 计算速率、increase() 计算增量、histogram_quantile() 计算分位数、absent() 检测缺失指标。操作符：by()/without() 分组、on()/ignoring() 标签聚合、group_left()/group_right() 多对一/一对多连接。常用模式：标签过滤、正则匹配、范围查询、瞬时向量 vs 区间向量' },
            { id: 'kp-prom-alerting', name: 'Alertmanager 告警', desc: 'PrometheusRule CRD 定义告警规则，Alertmanager 处理路由、分组、抑制、静默。路由配置：match/match_re 条件、continue 控制是否继续匹配、receiver 指定通知渠道。分组：按服务/团队/severity 分组，减少告警风暴。抑制：相同 source 链路的告警互相抑制，避免重复通知' },
            { id: 'kp-prom-scrape', name: '服务发现与采集', desc: 'static_configs 静态目标；kubernetes_sd_configs 的 node/service/pod/ingress 模式；relabel_configs 修改 scrape 标签、过滤目标、做目标重写。relabel 实战：__meta_kubernetes_pod_name 提取、instance 标签覆写、label 过滤黑名单。scrape_interval 与 remote_write 调优' },
            { id: 'kp-prom-federation', name: '高可用与长期存储', desc: 'Prometheus HA：两个实例双写， Thanos Query 聚合。Thanos 组件：Sidecar（边车上传）、Query（联邦查询）、Store（对象存储）、Receive（远程接收）、Compactor（压缩降采样）。Cortex/Chora 替代方案对比。长期存储：S3/GCS + 降采样策略（5m 保留 90 天，1h 保留 1 年）' },
            { id: 'kp-prom-recording', name: 'Recording Rules 预计算', desc: '将高频复杂查询预计算为轻量级指标，解决 Dashboard 卡顿和 Alert 延迟问题。命名规范：job_name/rule_type/granularity（如 apiserver_latency_p99_5m）。适用场景：多标签聚合、跨服务计算、长期趋势预测。注意：Recording Rules 也要监控自身，避免告警风暴' },
            { id: 'kp-prom-exporter', name: 'Exporter 开发', desc: 'Prometheus Exporter 将外部指标转换为 Prometheus 格式。官方 Exporter：node_exporter、cadvisor、blackbox_exporter。Go/Java/Python SDK 编写自定义 Exporter。文本格式：# HELP / # TYPE / metric_name label=value value。避开常见坑：指标类型不一致、标签基数爆炸、缺少指标类型注解' },
            { id: 'kp-prom-health', name: 'Prometheus 健康诊断', desc: '/metrics 端点检查；/status 检查 TSDB 状态；/flags 检查启动参数。常见问题：内存不足（--storage.tsdb.retention）、磁盘 IO 瓶颈、远程写失败、查询超时。性能优化：查询缓存、limit 子句、TiVo 避免大数据集返回。容量规划：100 万指标 ≈ 3GB 内存，保留 15 天' }

        { id: 'slo-management', name: 'SLO 管理', nameEn: 'SLO Management', desc: 'SLI 定义、SLO 制定、Error Budget 策略与数据驱动决策的完整 SLO 生命周期管理。SLO 是 SRE 的核心实践，连接用户期望与系统可靠性', category: 'sre-core',
          steps: ['llm','transform'],
          knowledgePoints: [
            { id: 'kp-slo-defining', name: 'SLO 制定流程', desc: 'Step 1: 用户旅程映射（注册、搜索、下单、支付核心路径）；Step 2: 每旅程选择 SLI（如延迟/可用性）；Step 3: 设定初始 SLO 目标（参考历史数据 + 竞品对标）；Step 4: 与 Product/Business 对齐，形成文档化的 SLO；Step 5: 持续 Review 与调整（季度或重大变更后）' },
            { id: 'kp-slo-windows', name: '滚动窗口与 Error Budget', desc: 'Calendar window：自然月统计，适合 SLA 对齐；Rolling window：连续 28/30 天，更平滑反映真实可靠性。短期窗口（1小时）燃尽率预警长期窗口（30天）燃尽率的"快慢告警"组合。Window 切换时的数据连续性处理' },
            { id: 'kp-slo-burnrate', name: '多窗口燃尽率告警', desc: 'Multi-window burn rate alert 是 Google SRE Book 推荐方法。长期窗口（1小时）消耗 14.4% Error Budget 告警；短期窗口（5分钟）消耗 10% Error Budget 告警。组合告警减少 false positive 而不错过真正的 SLO 违规。推荐阈值：1h window @ 14.4x burn rate = 6h 耗尽当月 100% Error Budget' },
            { id: 'kp-slo-review', name: 'SLO Review 与迭代', desc: '月度 SLO 健康度 Report：达成率、Error Budget 消耗趋势、燃尽率分析。QBR 中的 SLO 汇报：与 Product 讨论 Error Budget 策略（激进 vs 保守）。SLO 调整触发条件：用户调研反馈、重大架构变更、新功能上线后稳定期。SLO 变更流程：Proposal → Review → 30 天 Trial → Finalize' },
            { id: 'kp-slo-availability', name: '可用性计算模型', desc: 'Availability = Uptime / (Uptime + Downtime)。月可用性：= (43200 分钟 - 实际停机) / 43200。Pof(r) 模型：Period of Failures，r = 恢复时间。复合服务可用性：A = A1 × A2 × A3（如多副本串联：99.9% × 99.9% × 99.9% = 99.7%）' },
            { id: 'kp-slo-doc', name: 'SLO 文档化与通信', desc: 'SLO 文档应包含：SLI 定义、测量方法、SLO 值、Error Budget 大小、当前状态。Public SLO：向用户透明公开 SLO 达成率，可用性 Dashboard。Status Page 集成：自动发布 SLO 状态。SLO 违规的 Customer Communication 模板' }

        { id: 'cost-optimization', name: '成本优化', nameEn: 'Cost Optimization', desc: '云资源成本分析、Right-sizing、Reserved Instance、FinOps 实践。通过持续监控、分析和优化云支出，将单位成本控制在合理范围内，实现可靠性与成本的平衡', category: 'platform',
          steps: ['run-shell-command','llm','transform'],
          knowledgePoints: [
            { id: 'kp-cost-rightsizing', name: '资源 Right-sizing', desc: '基于实际利用率数据（CPU/Memory/PV 实际使用量）调整实例规格。分析工具：Kube Cost、CloudHealth、Google Recommendations。常见模式：GPU 实例降配、Memory Optimized 转为 Standard、悬空 EBS 卷清理、未绑定弹性 IP 回收。Right-sizing 应作为持续流程而非一次性事件：建议每月审查周期' },
            { id: 'kp-cost-ri', name: '预留实例与 Savings Plan', desc: 'Reserved Instance（RI）/ Savings Plan（SP）购买策略：覆盖率目标 60-70%（兼顾弹性需求）。Instance Size Flexibility：SC/SP 自动匹配同系列灵活实例。Coverage 计算：AWS Cost Explorer、Azure Advisor、Google Cloud Committed Use 提供覆盖率报告。RI 到期预警：提前 30/7 天通知，防止自动续费导致浪费' },
            { id: 'kp-cost-spot', name: 'Spot/Preemptible 实例', desc: '无状态工作负载（Batch Job、CronJob、Spark）使用 Spot 实例可节省 60-90%。中断处理：SIGTERM 捕获、Checkpoint 机制、Graceful Shutdown。Spot Fleet + Auto Scaling：自动补充 On-Demand 实例填充容量缺口。Kubernetes：cluster autoscaler + priority class 处理 Spot 中断' },
            { id: 'kp-cost-tagging', name: '标签与分摊策略', desc: 'Cost Center 标签策略（env/team/project/cost-center），所有资源必须打标。Showback vs Chargeback：前者展示各部门成本（仅告知），后者直接向团队收费（驱动行为）。标签合规性自动化：SCP 强制资源标签、pricelist 标签校验。FinOps Tagging 规范：AWS Tagging Best Practices、Azure Resource Manager Tagging Standards' },
            { id: 'kp-cost-monitoring', name: '成本监控与告警', desc: '日/周粒度成本异常检测（环比/同比增长 >20% 触发告警）。Budget 设置：按 Account/Team/Service 多维度建立预算。预测模型：基于历史趋势预测月末成本，提前发现超支风险。Anomaly Detection：AWS Cost Anomaly Detection、Google Cloud Billing Alerts with Budgets with Alerts' },
            { id: 'kp-cost-watermarks', name: '成本水位管理', desc: '建立成本基线（Baseline）：日常运行成本 = 固定成本 + 可变成本。峰值水位：促销/活动期间的资源需求建模。Reserved Coverage 水位：确保 RI 覆盖率 ≥ 目标值，避免 "套现失败"。成本效率指标：Cost per Request、Cost per User、Cost per Revenue Unit' },
            { id: 'kp-cost-governance', name: '成本治理与策略', desc: '云财务治理：CFM（Cloud FinOps）成熟度模型（Track/Improve-Enable-Run）。Right-sizing阈值：CPU <20% 或 Memory <50% 持续 7 天触发降配建议。删除策略：30 天无流量资源自动标记 → 7 天后删除。成本审查 Gate：超过 $10k/月的新资源组需审批' }

          knowledgePoints: [

            { id: 'kp-ph-automation', name: '自动化巡检系统', desc: 'CronJob 巡检：每日/每周定时执行，生成 JSON 报告。异常自动升级：P1 问题触发 PagerDuty/钉钉告警，配套 Runbook 自动执行。报告归档：S3/GCS 存储巡检结果，保留 90 天。Dashboard 集成：巡检结果推送到 Grafana 面板，可追溯历史数据。Slack/企微通知：巡检结果摘要自动发送到值班群' },

            { id: 'kp-kt-pod', name: 'Pod 状态诊断', desc: 'CrashLoopBackOff：kubectl describe pod 查看 Last State、Exit Code；OOMKilled：kubectl top pod 查看内存 Limits；ImagePullBackOff：检查 ImagePullSecrets、Registry 权限；Pending：查看 PVC 绑定状态、ResourceQuota、Node 资源；Error/Waiting：kubectl get events --field-selector involvedObject.name=pod-name 查事件' },
            { id: 'kp-kt-network', name: '网络故障排查', desc: 'DNS 解析：kubectl exec netshoot dig SRV记录；Endpoint 检查：kubectl get ep 服务名 确认后端 Pod 列表；Ingress：kubectl describe ing 检查 Ingress Class、Rewrite 规则；iptables vs IPVS：kubectl logs -n kube-system kube-proxy 确认模式；Service 无法访问：检查 --clusterIP、--nodePort、--loadbalancer 类型配置；CNI 插件：ip link、bridge-nf-call-iptables 状态检查' },
            { id: 'kp-kt-node', name: 'Node 问题诊断', desc: 'NotReady：systemctl status kubelet、journalctl -u kubelet 查原因；DiskPressure：df -h 检查 /var/lib/kubelet、docker system df；MemoryPressure：free -m、kubectl top nodes；PIDPressure：系统 PID 上限 /proc/sys/kernel/pid_max；NetworkUnavailable：kubectl get nodes -o wide 查看 podCIDR；Node 驱逐：kubectl describe node 查看 Conditions、Evictions 计数' },
            { id: 'kp-kt-storage', name: '存储与持久卷排查', desc: 'PVC Pending：kubectl describe pvc 查看 Reason（Pending、Bound、Lost）；StorageClass 检查：kubectl get sc 确认默认 StorageClass；PV 绑定失败：检查 claimRef、volumeMode；CSI Driver 问题：csi-driver 日志、crictl ps 检查 Driver Pod；数据持久性：VolumeAttachment 对象状态、最后挂载时间；备份恢复：Velero 备份验证、restores Status' },
            { id: 'kp-kt-etcd', name: 'Control Plane 故障排查', desc: 'ETCD 健康：etcdctl endpoint health、--ca-file 证书验证；Leader 选举：etcdctl endpoint status 查看 Leader ID；磁盘延迟：iostat -x 1 /var/lib/etcd，wal 目录性能要求 >2ms；Member 问题：etcdctl member list、member remove/add；API Server：kubectl get --raw /healthz、/metrics；kube-scheduler：kubectl get events --field-selector reason=FailedScheduling' },
            { id: 'kp-kt-tools', name: '诊断工具与技巧', desc: 'kubectl debug：node/pod 级别诊断；kubectl top：节点和 Pod 资源使用；kubectl cp：日志收集；crictl：替代 docker CLI 检查容器；nsenter：进入容器网络命名空间；eBPF：bpftrace、tcplife、execsnoop；kubectl tree：拓扑关系可视化；k9s：交互式终端 UI 诊断工具' },
            { id: 'kp-kt-coredns', name: 'CoreDNS 故障排查', desc: 'CoreDNS Pod 状态：kubectl get pods -n kube-system -l k8s-app=kube-dns；DNS 解析测试：kubectl run dnsutils --image=tutum/dnsutils --restart=Never --rm -it -- nslookup kubernetes.default；NodeLocal DNSCache：iptables vs ipvs 模式问题；上游 DNS：/etc/resolv.conf 配置、Corefile 转发规则；日志：kubectl logs -n kube-system -l k8s-app=kube-dns -c coredns' },
            { id: 'kp-kt-cni', name: 'CNI 网络插件故障', desc: 'Calico：birdctl show、calico-node 诊断模式； Cilium：hubble ui、cilium connectivity test；Flannel：etcd 中的网络配置、flanneld 日志；VXLAN vs BGP：物理网络兼容性、VXLAN 端口 4789/UDP；IP 分配耗尽：ip addr、kubectl get ipamblocks；NetworkPolicy：kubectl get networkpolicies、测试策略生效性（deny-all then allow specific）' }

        { id: 'security-scan', name: '安全扫描', nameEn: 'Security Scanning', desc: '代码、依赖、容器镜像、IaC 配置的全链路安全扫描，发现漏洞、密钥泄露和配置风险。DevSecOps 流水线核心环节，支持 CI/CD 门禁和自动化修复', category: 'security',
          steps: ['run-shell-command','llm','transform'],
          knowledgePoints: [
            { id: 'kp-ss-sast', name: '静态代码扫描 (SAST)', desc: 'SonarQube：规则引擎覆盖 OWASP Top 10、CWE、SANS Top 25；Semgrep：轻量级规则、GitHub 代码搜索集成；CodeQL：GitHub 原生、语义分析、漏洞溯源。误报管理：Triage 分类、规则 suppress、Hotspots 分析。IDE 集成：VSCode/IntelliJ 实时检测。质量门禁配置：阻塞 P0/P1 漏洞通过' },
            { id: 'kp-ss-dependency', name: '依赖漏洞扫描', desc: 'npm audit / Snyk / Dependabot：package-lock.json 依赖树扫描；CVSS 评分过滤；自动升级 PR 生成；许可证合规检查（GPL/AGPL 风险）。PyUp / Renovate：Python pip 依赖管理。供应链安全：SBOM 生成、已知漏洞组件 (CVE) 追踪。GitHub Advisory Database 集成' },
            { id: 'kp-ss-secrets', name: '密钥泄露检测', desc: 'git-secrets：pre-commit hook 防止密钥 commit；detect-secrets：企业级密钥检测、支持 AWS/Azure/GCP 格式；TruffleHog：高精度扫描、Entropic 熵值检测；Vault/Prefab：密钥生命周期管理、自动轮换。扫描范围：API Key、Private Key、Token、Connection String、OAuth Secret。误报处理：.gitignore 排除、Baseline 白名单' },
            { id: 'kp-ss-container', name: '容器镜像扫描', desc: 'Trivy：轻量级、CIS Docker Benchmark、K8s 最佳实践；Clair：CoreOS 开源、API 驱动；Grype：Syft 生成 SBOM + Grype 扫描。镜像层扫描 vs 文件系统扫描。漏洞等级：Critical/High/Medium/Low。修复策略：镜像重建 + 基础镜像升级 + 依赖补丁。签名验证：Cosign/Sigstore 镜像签名 + admission controller 验签' },
            { id: 'kp-ss-iac', name: 'IaC 安全扫描', desc: 'tfsec：Terraform HCL 分析、支持 AWS/Azure/GCP 安全规则；Checkov：Terraform/K8s/Dockerfile/Serverless；KICS：开源多框架支持。检测类型：资源权限过大（* ALL）、未加密存储、公开网络暴露、不安全协议。修复建议：具体的配置代码替换方案。集成方式：CI/CD Pipeline、Pre-commit Hook、VSCode 插件' },
            { id: 'kp-ss-dast', name: '动态应用扫描 (DAST)', desc: 'OWASP ZAP：B API 扫描、Spider 爬取、Active Scan；Burp Suite Pro：认证扫描、漏洞验证；Nikto：Web 服务器指纹扫描。API 安全：OpenAPI/Swagger 规范扫描、自动认证头注入。DAST vs SAST：DAST 发现运行时漏洞（SQLi、XSS、CSRF），SAST 检查代码质量' }
          ]
          resources: [

        { id: 'log-parser', name: '日志解析器', nameEn: 'Log Parser', desc: '多格式日志解析、过滤、聚合与结构化转换，支持自然语言日志查询和异常模式识别。日志驱动的故障诊断核心技能', category: 'observability',
          steps: ['read-file','parse-json-log','llm','transform'],
          knowledgePoints: [
            { id: 'kp-lp-formats', name: '日志格式识别', desc: 'JSON 结构化日志：标准化字段（timestamp, level, message, trace_id）；Nginx Combined：$remote_addr - $remote_user [$time_local] "$request"；Apache Log4j：MDC/NDC 嵌套上下文；Syslog：RFC 5424 格式、Priority 计算；JSON vs Plain text：JSON 可搜索性更好但存储成本高；Multiline 日志：Java StackTrace 拼接规则' },
            { id: 'kp-lp-filter', name: '过滤与聚合', desc: 'Level 过滤：error|fatal|critical；Service/Component 过滤：service=payment；Time Range：last 5m / @timestamp >= now-5m；trace_id 关联：分布式请求追踪；LogQL / Splunk SPL / ELK DSL：管道式过滤-转换-聚合；统计聚合：count by (level) (rate())、topk(10, count)；跨源关联：Logs + Metrics 关联查询' },
            { id: 'kp-lp-pattern', name: '模式识别与异常检测', desc: 'Error Clustering：错误信息聚类、相同 Root Cause 归类；Pattern Matching：Regex / Grok 提取结构化字段；Anomaly Detection：日志频率突增（spike）、未知 Error 类型发现；Log Signature：变更指纹、区分正常变更日志 vs 异常日志；Machine Learning：Loki 引入的日志异常检测、Log Volume Baseline' },
            { id: 'kp-lp-correlation', name: '日志关联分析', desc: 'trace_id 将 Logs + Traces 关联；k8s.namespace / k8s.pod.name 标签关联 metadata；时间窗口对齐：Metrics 异常时间点 → 日志上下文；Error Chain：从入口到后端的完整调用链还原；Structured Logging Best Practices：统一字段命名、增加业务上下文（user_id、order_id）' },
            { id: 'kp-lp-pipeline', name: '日志处理流水线', desc: 'Fluentd/Fluent Bit：轻量级日志收集器、K8s DaemonSet 部署；Vector：Rust 实现、高性能、Pipeline DSL；Logstash：ELK 传统方案、Grok 解析；处理流程：Collection → Buffer (Kafka/Redis) → Processing → Storage (ES/Loki) → Query。日志 schema 管理：LogDNA/CloudWatch 规范化' }
          ]
          resources: [
            { title: 'LogQL 查询语言', url: 'https://grafana.com/docs/loki/latest/logql/', type: 'doc', source: 'Grafana' },

            { title: '日志分析最佳实践', url: 'https://www.sumologic.com/blog/log-analysis-best-practices/', type: 'tutorial', source: 'Sumo Logic' },

        { id: 'service-health-check', name: '服务健康检查', nameEn: 'Service Health Check', desc: 'HTTP/TCP/gRPC 健康探测、就绪/存活探针设计。服务健康检查是 Kubernetes Pod 生命周期管理的核心机制，决定 Pod 是否应该接收流量、是否应该被重启。设计良好的健康检查能有效避免级联故障、提高服务可用性', category: 'reliability',
          steps: ['http-health-check','llm','transform'],
          knowledgePoints: [
            { id: 'kp-hc-types', name: '探针类型与场景', desc: 'Liveness Probe（存活探针）：检测应用是否存活，失败会触发容器重启。用于检测死锁、无限循环等无法自愈的状态。Readiness Probe（就绪探针）：检测应用是否准备好接收流量，失败会将 Pod 从 Service Endpoint 中移除。用于依赖服务未就绪时暂时摘除流量。Startup Probe（启动探针）：用于慢启动应用，检测应用是否已完成启动，存活和就绪探针在启动探针成功后才会开始执行。适用于 Spring Boot、Java 等启动时间较长的应用' },
            { id: 'kp-hc-design', name: '探针设计原则', desc: '轻量级：健康检查逻辑应在毫秒级完成，避免阻塞主业务逻辑。避免副作用：检查逻辑应该是幂等的，不应修改应用状态。避免外部依赖：健康检查不应依赖外部服务（如数据库、缓存），否则健康检查本身会成为故障点。合理的超时和重试：initialDelaySeconds 应大于应用启动时间，failureThreshold × periodSeconds = 最大启动容忍时间。路径设计：/health/liveness、/health/readiness 分开，避免共享状态' },
            { id: 'kp-hc-http', name: 'HTTP 健康检查实现', desc: 'HTTP GET 探针：适合有 HTTP 端点的服务（REST API）。端点应返回 2xx 表示健康，非 2xx 表示异常。Kubernetes 默认使用 200-400 范围作为成功。注意：不要在 /health 端点做深度健康检查（如查数据库），这会增加延迟并可能造成循环依赖。HTTP 探针优化：使用专门的轻量级端点，响应时间 <100ms' },
            { id: 'kp-hc-tcp', name: 'TCP 端口健康检查', desc: 'TCP Socket 探针：适合无 HTTP 端点的服务（数据库、消息队列、TCP 服务器）。Kubernetes 尝试建立 TCP 连接，成功则健康。对于监听端口的服务（如 MySQL、Redis），TCP 探针比 HTTP 更简单可靠。注意：TCP 探针无法区分 "端口可达但服务不健康" 的情况。某些场景需要配合 exec 探针执行更深入的检查' },
            { id: 'kp-hc-deep', name: '深度健康检查', desc: '依赖连通性验证：检查数据库连接池是否有可用连接（mysqladmin ping、PG ping）。缓存可用性：Redis PING、Memcached stats。外部服务依赖：第三方 API 超时检测（带超时控制）。业务就绪性：队列深度检查、批处理积压量检查。注意事项：深度检查应设置较短的超时（推荐 3-5 秒），避免健康检查占用过多时间。使用专门的 /readyz 端点做就绪检查，/livez 做存活检查' },
            { id: 'kp-hc-grpc', name: 'gRPC 健康检查', desc: 'gRPC Health Checking Protocol：gRPC 标准协议，原生支持健康检查。protobuf 定义 HealthService，实现 Check 方法。grpc_health_probe 工具：Kubernetes 原生支持，kubectl grpc-health-probe -addr=:50051。比 HTTP 更高效：二进制协议，省去 HTTP 解析开销。流式检查：gRPC 支持流式响应，适合检查大量依赖' },
            { id: 'kp-hc-synthetic', name: '合成监控与预热', desc: 'Synthetic Monitoring：主动发起端到端请求，模拟真实用户行为，不是被动等待告警。关键路径覆盖：登录、核心业务流程、高流量接口。定时执行：每 30-60 秒从外部或内部节点发起。Blackbox Exporter：Prometheus 社区提供 HTTP/TCP/DNS/ICMP 探测能力。灰度预热：TrafficShadow/Synthetic Traffic 配合 Feature Flag 预热新版本' },
            { id: 'kp-hc-hpa', name: '健康检查与 HPA 联动', desc: 'HPA 基于 Readiness 做扩缩容决策：Pod readiness_gate 失败时，HPA 会将其视为不健康目标而缩容。Startup Probe 与 HPA 冲突：启动期间探针失败会重启 Pod，HPA 可能无法正确评估。建议配置：initialDelaySeconds 足够大，periodSeconds 不宜过短（推荐 10-30 秒）。HPA 稳定窗口：stabilization_window_seconds 避免频繁扩缩容影响健康检查判断' }
          ]
          resources: [
            { title: 'K8s 探针配置', url: 'https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/', type: 'doc', source: 'CNCF' },
            { title: 'gRPC 健康检查协议', url: 'https://github.com/grpc/grpc/blob/master/doc/health-checking.md', type: 'doc', source: 'gRPC' },
            { title: 'HTTP 探针设计', url: 'https://kubernetes.io/docs/concepts/services-networking/service/', type: 'doc', source: 'CNCF' },
            { title: 'Prometheus 黑盒监控', url: 'https://github.com/prometheus/blackbox_exporter', type: 'tutorial', source: 'Prometheus' },
            { title: '健康检查最佳实践', url: 'https://cloud.google.com/blog/products/containers-kubernetes/kubernetes-best-practices', type: 'tutorial', source: 'Google Cloud' },
            { title: 'Readiness Probe 教程', url: 'https://kubernetes.io/docs/concepts/services-networking/service/#discovering-services', type: 'doc', source: 'CNCF' },
          ]
        },
        { id: 'system-watchdog', name: '系统看门狗', nameEn: 'System Watchdog', desc: '核心系统组件的心跳监控、异常检测与自动恢复。看门狗机制是保障服务持续运行的关键防线，通过监控关键进程的存活性，在检测到故障后触发自动修复动作，减少人工干预时间', category: 'reliability',
          steps: ['run-shell-command','http-health-check','llm','transform'],
          knowledgePoints: [
            { id: 'kp-wd-heartbeat', name: '心跳机制设计', desc: '进程级心跳：应用主动向监控系统发送心跳（Prometheus Heartbeat Exporter），超时则触发告警/重启。文件锁心跳：进程启动时创建锁文件，定期更新 mtime，锁文件消失则判定进程异常退出（防止僵尸进程）。端口心跳：进程监听固定端口，端口不可达触发告警。分布式心跳：多副本场景下通过选举（如 etcd leader）确认主节点存活。心跳间隔设计：推荐心跳间隔 = 故障检测容忍时间 / 3（如容忍 30 秒则每 10 秒心跳一次）' },
            { id: 'kp-wd-autorecover', name: '自动恢复策略', desc: '进程重启：systemd restart=on-failure、docker restart policy。容器重启：restartPolicy（Always/OnFailure/Never）。Kubernetes Liveness Probe：容器级别的存活检测与自动重启。Pod 重启策略：BackOff 机制（指数退避），避免疯狂重启。Dead Man Switch：进程定期写入 I-m-alive 信号，长时间无信号则触发恢复脚本。恢复脚本：Graceful Shutdown → 日志保存 → 资源清理 → 进程拉起' },
            { id: 'kp-wd-circuit', name: '熔断器模式', desc: '连续失败阈值（Failure Threshold）：连续 N 次失败后进入 Open 状态，停止对目标服务的请求。半开状态（Half-Open）：一段时间后放行一个请求试探目标是否恢复。自动恢复（Reset Timeout）：半开状态请求成功后自动关闭熔断器。熔断开启条件：超时、HTTP 5xx、异常比例阈值（error budget burn rate）。状态面板：熔断器状态（Closed/Open/Half-Open）应暴露给监控系统。Hystrix/Resilience4j：成熟的熔断器实现库，支持指标导出' },
            { id: 'kp-wd-watchdogd', name: '系统级看门狗守护进程', desc: 'watchdogd：Linux 系统守护进程，通过 /dev/watchdog 设备实现硬件看门狗。配置：/etc/watchdog.conf 设置 interval、timeout、retry-count。软件看门狗：softdog 模块模拟硬件看门狗，适用于无硬件看门狗的虚拟机。Keepalive 机制：watchdogd 定期喂狗（写 /dev/watchdog），超时未喂狗则触发系统重启。容器环境：Kubernetes Liveness Probe + node.kubernetes.io/experimental-gc-started 注解配合自定义 Controller 实现进程级看门狗' },
            { id: 'kp-wd-fencing', name: '故障隔离与栅栏', desc: 'Fencing 机制：故障节点被 "隔离"，防止其继续写入共享资源（如 ETCD、数据库）。Kubernetes Fencing：delete fence 命令强制切断故障节点与集群的通信。STONITH（Shoot The Other Node In The Head）：硬件级断电报障，确保故障节点真正下线。分布式锁：Redis/ZooKeeper/ETCD 分布式锁，锁持有者故障后 TTL 自动释放。脑裂处理：双活集群场景下，网络分区时通过法定票数（Quorum）决定哪些节点继续服务' },
            { id: 'kp-wd-coroutine', name: '协程/线程级看门狗', desc: '协程泄漏检测：每个协程执行前记录 goroutine ID，定时检测协程是否阻塞。线程池满检测：线程池队列积压检测，超时触发告警/熔断。Goroutine Panic 捕获：recover() 捕获 panic，避免整个进程崩溃。Context 超时传播：ctx.WithTimeout 确保每个操作有最大执行时间。Deadline/Timeout 区别：Deadline 是绝对时间点，Timeout 是相对时长。资源泄漏防护：内存泄漏（CGO 内存、连接池）、文件描述符泄漏、超时连接关闭' }
          ]

        // === DevOps Skills ===
        { id: 'docker-essentials', name: 'Docker 基础', nameEn: 'Docker Essentials', desc: 'Docker 是容器化技术的核心标准，用于应用打包、分发和运行。掌握 Docker 镜像构建最佳实践、容器生命周期管理、网络配置和数据卷管理，是现代云原生开发的基础。本技能覆盖 Dockerfile 编写、多阶段构建、镜像优化、容器网络、存储卷和 Docker Compose 编排', category: 'devops',
          steps: ['run-shell-command','llm','transform'],
          knowledgePoints: [
            { id: 'kp-de-image', name: '镜像构建最佳实践', desc: 'Dockerfile 编写：基础镜像选择（Alpine/Ubuntu distroless/Chainguard）、层缓存优化（频率变化层放底部）、RUN 合并减少层数、多阶段构建分离编译和运行环境（BuildKit）。构建参数：--build-arg、--secret、--ssh 构建密钥。镜像大小优化：删除包管理器缓存、减少层数、使用 .dockerignore。健康检查：HEALTHCHECK 指令、优雅重启。构建加速：BuildKit 并行构建、Registry 镜像缓存、Kaniko 无 Docker 构建' },
            { id: 'kp-de-container', name: '容器生命周期管理', desc: '容器状态：created/running/paused/exited/dead。启动模式：-d 后台、-it 交互、--rm 自动删除。信号处理：SIGTERM 优雅停止（默认 10 秒超时）、SIGKILL 强制终止、Docker stop vs kill 区别。日志：docker logs -f --tail 100、logging driver 配置、日志轮转（max-size/max-file）。资源限制：--memory/--cpus/--pids-limit 防止资源耗尽。容器监控：docker stats、docker inspect 查看详细配置、cgroup 资源监控' },
            { id: 'kp-de-network', name: 'Docker 网络模型', desc: '网络驱动：bridge（默认）、host（共享主机网络）、overlay（Swarm 多主机）、macvlan/none。Bridge 网络：docker0 网桥、veth pair、容器间通过 DNS 互相访问（容器名解析）。端口映射：-p 宿主机端口:容器端口、-P 随机映射。DNS：--dns、--dns-search 自定义。Network Namespace：容器拥有独立网络栈、lo/eth0 接口。跨主机通信：Overlay 网络、macvlan VLAN 标签、VPC Peer。常见问题：端口冲突、网络隔离、DNS 解析失败' },
            { id: 'kp-de-volume', name: '数据卷与存储管理', desc: '卷类型：named volume（推荐）、bind mount（主机路径）、tmpfs（内存文件系统）。数据持久化：-v mysql_data:/var/lib/mysql，跨容器生命周期持久化。权限问题：UID/GID 不匹配、chown 解决方案。共享存储：多个容器挂载同一 volume实现共享。备份恢复：docker run --rm -v vol:/data -v $(pwd):/backup alpine tar cvf /backup/vol.tar /data。存储驱动：overlay2（生产推荐）、devicemapper/btrfs/zfs。Bind mount 权限：readonly 加 :ro，selinux :z/:Z 标签' },
            { id: 'kp-de-registry', name: '镜像仓库管理', desc: '公共仓库：Docker Hub/Quay/GCR/ECR。私有仓库：Harbor（推荐）、GitLab Container Registry、AWS ECR。镜像 Tag 策略：latest（避免生产使用）、语义化版本（v1.2.3）、git commit sha 短hash。镜像扫描：Trivy/Clair 漏洞扫描、CVE 数据库更新。签名验证：cosign 签名、Notary v2 信任策略。拉取策略：--pull always/never/missing。认证：docker login、credential helper（aws ecr get-login-password）。多架构镜像：manifest list 支持 amd64/arm64' },
            { id: 'kp-de-compose', name: 'Docker Compose 编排', desc: 'YAML 结构：version/services/networks/volumes/configs/secrets。启动顺序：depends_on + condition: service_healthy + healthcheck。环境变量：env_file、字面量变量、.env 文件。健康检查：healthcheck 配置、interval/timeout/retries。资源约束：deploy.resources.limits/reservations。网络：networks 定义、driver: bridge/host/overlay。扩展：docker compose up --scale web=3 做负载均衡。Secret 管理：file: 或 environment:。生产限制：docker-compose 适合开发/测试，生产用 Kubernetes。实用命令：docker compose ps/config/down/up/pull/down' }
          ],

        { id: 'kubernetes-basics', name: 'Kubernetes 基础', nameEn: 'Kubernetes Basics', desc: 'Kubernetes 是云原生应用的容器编排标准，提供声明式的 Pod 调度、服务发现、配置管理、自动扩缩容和能力抽象。本技能覆盖 K8s 核心对象（Pod/Deployment/Service/Ingress/ConfigMap/Secret/HPA）、kubectl 常用操作和 Helm 包管理，是集群管理和应用部署的基础', category: 'devops',
          steps: ['run-shell-command','validate-k8s-manifest','llm','transform'],
          knowledgePoints: [
            { id: 'kp-kb-pod', name: 'Pod 模型与生命周期', desc: 'Pod 是 K8s 最小调度单元，一个 Pod 可包含多个容器（共享 network/PID/IPC）。容器状态：Waiting/ Running/ Terminated。Init Container：先于主容器启动，用于依赖等待/权限预置。Sidecar 模式：日志代理/代理容器与主容器并肩运行。资源限制：requests（调度依据）/limits（硬限制），QoS 等级 Guaranteed/Burstable/BestEffort。健康检查：livenessProbe/readinessProbe/startupProbe。环境变量：env/valueFrom/configMapKeyRef/secretKeyRef。静态 Pod：kubelet 直接管理，绕过 API Server' },
            { id: 'kp-kb-workload', name: '工作负载控制器', desc: 'Deployment：无状态应用管理，rollingUpdate strategy（maxSurge/maxUnavailable）、replicas 扩缩容。StatefulSet：有状态应用，稳定的网络标识（pod name/hostname）、持久存储（volumeClaimTemplate）、有序部署/扩缩/删除。DaemonSet：每个节点运行一个副本，日志收集/监控代理场景。Job：一次性的批处理任务，backoffLimit 重试、parallelism 并行度。CronJob：定时任务，startingDeadlineSeconds 宽限、concurrencyPolicy 控制并发。HPA：HorizontalPodAutoscaler，CPU%/Memory% 或自定义指标触发扩缩' },
            { id: 'kp-kb-service', name: 'Service 与服务发现', desc: 'Service 类型：ClusterIP（集群内部访问）、NodePort（节点端口映射）、LoadBalancer（云负载均衡）、ExternalName（DNS 别名）。Endpoint：Service 后端 Pod IP 列表，selector 标签选择器自动维护。Headless Service：clusterIP=None，Pod 直接 DNS 寻址（有状态服务）。Ingress：HTTP/HTTPS 七层路由，host/path 规则、 TLS termination、rewrite 规则。CoreDNS：集群内 DNS 服务器，Service 名称解析为 ClusterIP，格式 svc.namespace.svc.cluster.local' },
            { id: 'kp-kb-config', name: '配置管理与 Secret', desc: 'ConfigMap：非敏感配置， kubectl create configmap --from-file/--from-literal。环境变量注入：envFrom/configMapRef。Volume 挂载：configMap 挂载为文件（items path 映射）。Secret：敏感数据，base64 编码（不加密！）+ RBAC 限制。加密 Secret：KMS provider 或 Sealed Secrets 加密存储。配置热更新：kubectl apply 后 Pod 自动同步（需理解 configMap 挂载 vs 环境变量行为差异）。最佳实践：配置与镜像分离、不要在 YAML 硬编码敏感信息' },
            { id: 'kp-kb-kubectl', name: 'kubectl 高效操作', desc: '资源操作：kubectl get/describe/apply/delete -f <file>/<name> -n <ns>。输出格式：-o wide/yaml/json/path，jq 格式化 JSON 输出。日志：kubectl logs -f <pod> -c <container>，--previous 上一个容器。容器内执行：kubectl exec -it <pod> -c <container> -- /bin/sh。端口转发：kubectl port-forward svc/<name> 8080:80，本地访问集群服务。标签选择：kubectl get pods -l app=web,version=v2。污点和容忍：kubectl taint nodes <node> <key>=<value>:NoSchedule。滚动更新：kubectl rollout status/restart/undo deployment/<name>' },
            { id: 'kp-kb-helm', name: 'Helm 包管理', desc: 'Chart 结构：Chart.yaml（名称/版本）+ templates/ + values.yaml。模板引擎：{{ .Values.key }} 变量渲染，{{- include "helper" . | nindent 2 }} 格式化。values 优先级：default < values file < --set < --set-file。仓库管理：helm repo add/update/list，helm search。Release 管理：helm install/upgrade/rollback/uninstall，--atomic 失败自动回滚。实战技巧：helm template 本地渲染、helm diff upgrade 预览变更、--dry-run 演练。私有 Chart：harbor chart repository 或本地 helm serve' }
          ],
          resources: [
            { title: 'Kubernetes 官方文档', url: 'https://kubernetes.io/docs/home/', type: 'doc', source: 'CNCF' },
            { title: 'Kubernetes 互动教程', url: 'https://kubernetes.io/docs/tutorials/', type: 'tutorial', source: 'CNCF' },

        { id: 'docker-to-k8s', name: 'Docker 到 K8s 迁移', nameEn: 'Docker to Kubernetes Migration', desc: '从 Docker Compose 迁移到 Kubernetes 的策略与实践', category: 'devops',
          steps: ['read-file','llm','transform'],

        { id: 'terraform-basics', name: 'Terraform 基础', nameEn: 'Terraform Basics', desc: 'Terraform 是基础设施即代码（IaC）的核心工具，通过声明式配置管理云资源（AWS/Azure/GCP/K8s）。本技能覆盖 HCL 语法、Provider/Resource/Module 开发、状态管理和远程后端、Workspace 多环境管理，以及 terraform import 存量资源导入。是云资源自动化管理和 GitOps 的基础', category: 'devops',
          steps: ['read-file','llm','transform'],
          knowledgePoints: [
            { id: 'kp-tb-hcl', name: 'HCL 语法与配置结构', desc: 'Resource：provider_type.name（AWS provider/aws_instance.web）。Data Source：data.aws_ami.latest 查询现有资源。Variable：variable "name" { type = string/default = ""/description = ""/validation }。Output：output "pub_ip" { value = aws_eip.ip/value_description = "" }。Local：locals { env = var.environment } 局部变量。表达式： interpolation ${var.resource}/for_each/map/三元运算符。Dynamic Block：dynamic "ingress" { for_each = var.ports/content { from_port = item } } 动态生成资源块' },
            { id: 'kp-tb-state', name: '状态管理与远程后端', desc: 'Local State：terraform.tfstate 本地文件（禁止提交 Git）。Remote Backend：S3（+ DynamoDB 锁）/ GCS / Azure Blob/ Terraform Cloud。State Locking：DynamoDB table 防止并发操作损坏状态。State 隔离：workspace 隔离（dev/staging/prod）或 state file 前缀分离。State 危险操作：terraform state mv 迁移资源、terraform state rm 移除状态、terraform import 导入存量资源。敏感信息：state 文件包含明文敏感数据，远程后端需加密（SSE-KMS）' },
            { id: 'kp-tb-module', name: 'Module 开发与复用', desc: 'Module 结构：variables.tf + outputs.tf + main.tf + README.md。版本约束：version = "~> 1.0" 语义化版本。Terraform Registry：公共 Module（terraform-aws-modules/vpc/aws 等）。Module 迭代：for_each/resource count 实现条件创建。嵌套 Module：子模块组合成复杂基础设施。Module 调试：terraform graph 输出依赖图、terraform validate 检查语法' },
            { id: 'kp-tb-workspace', name: 'Workspace 多环境管理', desc: 'terraform workspace new/select/list/show。环境隔离：每个 Workspace 独立 state 文件（backend key 不同）。变量注入：terraform apply -var-file=dev.tfvars。默认 Workspace：default（避免使用 default 做生产）。Workspace 注意事项：Workspace 不能完全替代环境隔离（权限/远程后端仍需独立配置）。推荐方案：每个环境独立目录 + Terragrunt 或每个环境独立 backend prefix' },
            { id: 'kp-tb-import', name: '存量资源导入', desc: 'terraform import aws_instance.existing <instance-id> 将存量资源导入状态。import block：Terraform 1.5+ 支持 import { to = aws_instance.example id = "i-xxx" } 代码块生成器。漂移检测：terraform plan 检测实际资源与代码差异。导入注意事项：导入后手动清理未管理的资源属性、import 不生成完整配置需补充。迁移策略：手动 import + 代码对齐 + 增量 IaC 化' },
            { id: 'kp-tb-providers', name: 'Provider 插件管理', desc: 'Provider 分布：HashiCorp Terraform Registry 官方/社区 providers。版本约束：terraform { required_providers { aws = { source = "hashicorp/aws" version = "~> 5.0" } } }。Provider 安装：terraform init 自动下载插件（~/.terraform.lock.hcl 锁定版本）。镜像配置：provider_plugin_cache_dir 本地缓存。内置 Provider：kubectl/helm/docker/ansible 等 Kubernetes/容器/配置管理 Provider' },
            { id: 'kp-tb-drift', name: '配置漂移与状态一致性', desc: '漂移原因：手动在控制台修改了 Terraform 管理的资源，导致代码与实际不符。检测：terraform plan 列出 drift（+/- 表示需修改/删除）。处理策略：terraform apply 同步回代码定义的状态、或更新代码匹配变更（if 变更合规）。Prevent Destroy：lifecycle { prevent_destroy = true } 保护关键资源。数据源漂移：data source 查询结果变化但状态未更新处理' }
          ]
          resources: [
            { title: 'Terraform 官方文档', url: 'https://developer.hashicorp.com/terraform/docs', type: 'doc', source: 'HashiCorp' },
            { title: 'Terraform 入门教程', url: 'https://developer.hashicorp.com/terraform/tutorials/getting-started', type: 'tutorial', source: 'HashiCorp' },
            { title: 'HCL 语法参考', url: 'https://developer.hashicorp.com/terraform/language/syntax', type: 'doc', source: 'HashiCorp' },
            { title: 'Terraform State 最佳实践', url: 'https://developer.hashicorp.com/terraform/language/state', type: 'doc', source: 'HashiCorp' },

            { title: 'Terraform 导入存量资源', url: 'https://developer.hashicorp.com/terraform/language/import', type: 'doc', source: 'HashiCorp' },
          ]
        },
        { id: 'ansible-automation', name: 'Ansible 自动化', nameEn: 'Ansible Automation', desc: 'Ansible 是无代理的配置管理和应用部署工具，通过 SSH 批量管理服务器和应用配置。覆盖 Playbook 编写、Role 组织、Inventory 管理、模块开发和幂等性设计。是服务器初始化、应用部署和配置管理的核心工具', category: 'devops',
          steps: ['run-shell-command','llm','transform'],
          knowledgePoints: [
            { id: 'kp-aa-playbook', name: 'Playbook 编写与执行', desc: 'YAML 结构：- hosts: web-servers become: yes vars: http_port: 80 tasks: - name: Ensure nginx installed apt: name=nginx state=present notify: Restart nginx handlers: - name: Restart nginx service: name=nginx state=restarted。模块：apt/yum/service/file/copy/template/command/shell/git/yum_repository。条件执行：when: ansible_os_family == "Debian"。循环：with_items/loop/resgister 捕获结果。Tags：tags: [web,nginx] 选择性执行 ansible-playbook --tags web' },
            { id: 'kp-aa-role', name: 'Role 组织结构', desc: '标准目录：roles/<role>/tasks/main.yml + handlers/main.yml + templates/ + files/ + vars/main.yml + defaults/main.yml + meta/main.yml。Role 依赖：meta/main.yml 指定 dependencies: - role: common。Ansible Galaxy：ansible-galaxy role init 创建模板、ansible-galaxy install 下载社区 Role。Role 调用：- hosts: all roles: - role: nginx。变量优先级：role defaults < role vars < inventory vars < play vars < extra vars' },
            { id: 'kp-aa-inventory', name: 'Inventory 管理', desc: '静态 Inventory：INI 格式 [webservers] web1.example.com ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/key.pem [webservers:vars] http_port=80。动态 Inventory：aws_ec2.py 脚本查询 AWS 实例分组。Pattern：all/web-[0-9]*/!db-* 模式匹配主机。变量分离：host_vars/web1.example.com + group_vars/webservers 目录结构。Vault 加密：ansible-vault encrypt vault.yml 保护敏感变量' },
            { id: 'kp-aa-idempotent', name: '幂等性设计', desc: '幂等原则：重复执行 playbook 不会产生副作用，状态一致。模块幂等：apt name=nginx state=present（已安装则跳过）。Handler 幂等：handlers 仅在 notify 触发时执行，service changed=true 时重启。Idempotent 写法：creates=/var/run/app.pid 存在则跳过 command 模块。Changed 判断：command/shell 默认 always changed，creates/ removes 参数实现幂等。改善方案：用 shell 模块改为 command 模块 + creates 参数' },
            { id: 'kp-aa-modules', name: '常用模块与自定义', desc: '系统模块：apt/yum/service/systemd/user/group/cron/se linux。文件模块：copy/template/stat/find/archive/extract。命令模块：command/shell/script/raw（raw 用于无法安装 Python 的老系统）。云模块：ec2_instance/rds_instance/s3_object/elb_target_group/aws_acm。K8s 模块：k8s/k8s_info/k8s_facts（Python client）。自定义模块：library/my_module.py（Python），返回 changed/stdout/stderr/rc' },
            { id: 'kp-aa-strategy', name: 'Ansible 策略与优化', desc: '执行策略：serial: 1 批量控制（滚动更新），free 模式最大并发。异步任务：async: 300 poll: 30 后台执行长时间任务。Vault：ansible-vault encrypt/decrypt/edit/create --vault-id password@prompt。Check 模式：ansible-playbook --check 预览变更不执行。Diff：--diff 显示文件变化。回调插件：回调 stdout/执行日志到日志系统。性能优化：pipelining + accelerate mode 加速 SSH 连接、facts 缓存（json_file）、mitogen strategy' }
          ]
          resources: [
            { title: 'Ansible 官方文档', url: 'https://docs.ansible.com/', type: 'doc', source: 'Red Hat' },
            { title: 'Ansible Playbook 教程', url: 'https://docs.ansible.com/ansible/latest/user_guide/playbooks.html', type: 'doc', source: 'Red Hat' },
            { title: 'Ansible Galaxy', url: 'https://galaxy.ansible.com/', type: 'tutorial', source: 'Ansible' },
            { title: 'Ansible Role 开发', url: 'https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse_roles.html', type: 'doc', source: 'Red Hat' },
            { title: 'Ansible 技巧集', url: 'https://www.ansible.com/blog', type: 'tutorial', source: 'Ansible' },
            { title: 'Ansible Tower 介绍', url: 'https://www.ansible.com/products/automation-controller', type: 'tutorial', source: 'Red Hat' },
          ]
        },
        { id: 'github-actions', name: 'GitHub Actions', nameEn: 'GitHub Actions', desc: 'GitHub Actions 是 GitHub 原生的 CI/CD 平台，通过 YAML 配置文件定义自动化工作流。覆盖 Workflow 编写、Action 市场、自托管 Runner、Secrets 管理、矩阵构建和可复用 Workflow。是开源项目和企业内部自动化的事实标准', category: 'devops',
          steps: ['llm','transform'],
          knowledgePoints: [
            { id: 'kp-ga-workflow', name: 'Workflow 配置与触发', desc: '基本结构：name: on: push: branches: [main] jobs: build: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - run: echo "Hello" 。触发条件：push/pull_request/workflow_dispatch（手动触发）/schedule（cron）/repository_dispatch。过滤：branches/tags/paths/ignore。Matrix 组合：strategy.matrix.include/exclude 精细控制。并发：concurrency group: ${{ github.ref }}，取消重复运行。环境：environment: production 设置部署环境' },
            { id: 'kp-ga-matrix', name: '矩阵构建与并行执行', desc: 'Matrix 语法：matrix: node-version: [18,20] os: [ubuntu, windows] exclude: - os: windows node-version: 18。动态矩阵：fromJson() 从 JSON 构建矩阵。并行任务：每个矩阵项独立执行，needs 声明依赖。Fail-fast：fail-fast: false 允许部分失败继续执行。上传工件：upload-artifact@v4 共享构建产物。下载工件：download-artifact@v4 下载上游工件。构建缓存：actions/cache 保存依赖加速（npm/pip/cargo 缓存策略）' },
            { id: 'kp-ga-secrets', name: 'Secrets 与认证管理', desc: 'Secret 级别：Repository Secrets（仓库级）/ Organization Secrets（组织级）/ Environment Secrets（环境级，需保护规则）。引用：${{ secrets.DEPLOY_KEY }} 在 Workflow 中使用。OIDC 认证：permissions: id-token: write + azure/login@v2 操作云账号无需持久凭证。Runner 标记：runs-on: [self-hosted, linux, x64] 自托管 Runner 路由。自定义环境变量：env: DEPLOY_ENV: production。掩码：Secrets 值自动掩码，日志中不可见' },
            { id: 'kp-ga-runner', name: 'Runner 管理与扩缩容', desc: 'GitHub-hosted Runner：ubuntu-latest/windows-latest/macos-latest， ephemeral 用完即销毁。自托管 Runner：actions/runner-images（AWS/GCP/Azure 镜像）或自建。自动扩缩：actions Runner Controller（ARC）在 K8s 上管理自托管 Runner。标签路由：runs-on: [self-hosted, Linux, X64, build] 匹配标签选择 Runner。Docker 容器 Runner：容器环境执行 Job。网络要求：Webhook 回调 GitHub（需出站 HTTPS）' },
            { id: 'kp-ga-reusable', name: '可复用 Workflow 与模板', desc: 'workflow_call：reusable workflow 被其他 workflow 调用，传入 inputs/secrets。模板参数：on.workflow_call.inputs 定义输入参数类型和默认值。Organization 模板：.github/workflows/templates/ 组织级共享。Marketplace Actions：actions/checkout@v4、actions/setup-node@v4、azure/login@v2 使用社区 Action。Action 开发：Docker 容器 Action（container.yml）/JavaScript Action（index.js）/复合 Action（action.yml）。版本管理：@v3 锁定大版本，@v3.2.1 锁定具体版本' },
            { id: 'kp-ga-caching', name: '构建缓存与依赖优化', desc: 'Cache Action：actions/cache@v4，key: ${{ runner.os }}-pnpm-${{ hashFiles("pnpm-lock.yaml") }}。依赖缓存：npm cache（actions/setup-node@v4 with cache: npm）、pip cache、cargo cache。Restore/Commit 策略：Cache 命中优先，miss 时回源下载。删除策略：自动清理超过 7 天未使用的 Cache。Artifact 保留：actions/upload-artifact retention-days: 30 控制产物保留时间' }
          ]
          resources: [
