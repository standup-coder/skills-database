    function selectModalLevel(level) {
      document.querySelectorAll('#modal-level .progress-option').forEach(el => {
        el.classList.toggle('selected', parseInt(el.dataset.level) === level);
      });
    }

    function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }

    document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    // ===== EXPORT / IMPORT =====
    function exportData() {
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `s4c-tree-${new Date().toISOString().slice(0,10)}.json`;
      a.click(); URL.revokeObjectURL(url);
      showToast('数据已导出');
    }

    function importData() { document.getElementById('import-input').click(); }

    function handleImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.person && imported.myRoles) {
            data = imported; saveData();
            selectedPath = { type: 'person' }; render();
            showToast('数据已导入');
          } else { showToast('格式不正确'); }
        } catch(err) { showToast('导入失败'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // ===== INIT =====
    // Skill Builder
    let sbSteps = [];
    let sbTags = [];
    let sbEditingId = null;

    function openSkillBuilder(skillId) {
      sbEditingId = skillId || null;
      const modal = document.getElementById('skill-builder-modal');
      const titleEl = document.getElementById('sb-panel-title');
      const nameEl = document.getElementById('sb-skill-name');
      const descEl = document.getElementById('sb-skill-desc');
      const catEl = document.getElementById('sb-skill-category');
      const tagsContainer = document.getElementById('sb-tags-container');
      const previewEl = document.getElementById('sb-preview');

      if (skillId) {
        const skill = customSkills.find(s => s.id === skillId);
        if (!skill) return;
        titleEl.textContent = '✏️ 编辑 Skill';
        nameEl.value = skill.name || '';
        descEl.value = skill.description || '';
        catEl.value = skill.category || '';
        sbTags = [...(skill.tags || [])];
        sbSteps = skill.steps ? skill.steps.map(s => ({ ...s })) : [];
      } else {
        titleEl.textContent = '⚡ 创建 Skill';
        nameEl.value = '';
        descEl.value = '';
        catEl.value = '';
        sbTags = [];
        sbSteps = [{ id: genId(), type: 'llm', prompt: '' }];
      }

      renderTagsInput();
      renderSbSteps();
      previewEl.style.display = 'none';
      modal.classList.add('show');
      nameEl.focus();
    }

    function closeSkillBuilder() {
      document.getElementById('skill-builder-modal').classList.remove('show');
      sbSteps = [];
      sbTags = [];
      sbEditingId = null;
    }

    function renderTagsInput() {
      const container = document.getElementById('sb-tags-container');
      const input = document.getElementById('sb-tags-input');
      container.innerHTML = sbTags.map(tag => `
        <span class="sb-tag">${esc(tag)}<span class="sb-tag-remove" onclick="removeTag('${esc(tag)}')">✕</span></span>
      `).join('');
      container.appendChild(input);
      input.value = '';
    }

    function addTag(tag) {
      tag = tag.trim();
      if (tag && !sbTags.includes(tag)) {
        sbTags.push(tag);
        renderTagsInput();
      }
    }

    function removeTag(tag) {
      sbTags = sbTags.filter(t => t !== tag);
      renderTagsInput();
    }

    document.getElementById('sb-tags-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addTag(e.target.value);
      }
    });

    function addPromptStep() {
      sbSteps.push({ id: genId(), type: 'llm', prompt: '' });
      renderSbSteps();
    }

    function removePromptStep(stepId) {
      sbSteps = sbSteps.filter(s => s.id !== stepId);
      renderSbSteps();
    }

    function updateStepPrompt(stepId, value) {
      const step = sbSteps.find(s => s.id === stepId);
      if (step) step.prompt = value;
    }

    function updateStepType(stepId, type) {
      const step = sbSteps.find(s => s.id === stepId);
      if (step) step.type = type;
    }

    function moveStep(stepId, direction) {
      const idx = sbSteps.findIndex(s => s.id === stepId);
      if (idx < 0) return;
      const newIdx = direction === 'up' ? idx - 1 : idx + 1;
      if (newIdx < 0 || newIdx >= sbSteps.length) return;
      [sbSteps[idx], sbSteps[newIdx]] = [sbSteps[newIdx], sbSteps[idx]];
      renderSbSteps();
    }

    function renderSbSteps() {
      const container = document.getElementById('sb-steps-container');
      container.innerHTML = sbSteps.map((step, i) => `
        <div class="prompt-step">
          <button class="prompt-step-remove" onclick="removePromptStep('${step.id}')">✕</button>
          <div class="prompt-step-header">
            <span class="prompt-step-num">${String(i + 1).padStart(2, '0')}</span>
            <span style="font-size:0.7rem;color:var(--text-muted)">步骤 ${i + 1}</span>
            <div style="margin-left:auto;display:flex;gap:0.25rem">
              ${i > 0 ? `<button class="icon-btn" onclick="moveStep('${step.id}','up')" title="上移" style="font-size:0.6rem">↑</button>` : ''}
              ${i < sbSteps.length - 1 ? `<button class="icon-btn" onclick="moveStep('${step.id}','down')" title="下移" style="font-size:0.6rem">↓</button>` : ''}
            </div>
          </div>
          <div class="prompt-step-type">
            <label><input type="radio" name="step-type-${step.id}" value="llm" ${step.type === 'llm' ? 'checked' : ''} onchange="updateStepType('${step.id}','llm')"> LLM 推理</label>
            <label><input type="radio" name="step-type-${step.id}" value="transform" ${step.type === 'transform' ? 'checked' : ''} onchange="updateStepType('${step.id}','transform')"> 格式化输出</label>
          </div>
          <textarea placeholder="${step.type === 'transform' ? '输入格式化规则，如：提取代码审查结果并输出结构化 JSON...' : '输入这个步骤的 Prompt，例如：你是一位资深代码审查专家，请分析以下代码的质量、安全性和性能...'}" oninput="updateStepPrompt('${step.id}', this.value)">${esc(step.prompt || '')}</textarea>
        </div>
      `).join('');
    }

    function generateSkillJson() {
      const name = document.getElementById('sb-skill-name').value.trim();
      if (!name) { showToast('请输入 Skill 名称'); return null; }
      if (sbSteps.length === 0 || !sbSteps[0].prompt.trim()) { showToast('请至少添加一个 Prompt 步骤'); return null; }

      const skill = {
        id: sbEditingId || 'skill-' + genId(),
        name,
        description: document.getElementById('sb-skill-desc').value.trim(),
        category: document.getElementById('sb-skill-category').value.trim() || 'custom',
        tags: sbTags,
        steps: sbSteps.map((s, i) => ({
          order: i + 1,
          type: s.type,
          prompt: s.prompt
        })),
        createdAt: sbEditingId ? (customSkills.find(cs => cs.id === sbEditingId)?.createdAt || new Date().toISOString()) : new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      return skill;
    }

    function saveSkillBuilder() {
      const skill = generateSkillJson();
      if (!skill) return;

      if (sbEditingId) {
        const idx = customSkills.findIndex(s => s.id === sbEditingId);
        if (idx >= 0) customSkills[idx] = skill;
      } else {
        customSkills.push(skill);
      }

      saveCustomSkills();
      renderSkillBuilderList();
      closeSkillBuilder();
      showToast('Skill 已保存');
    }

    function renderSkillBuilderList() {
      const list = document.getElementById('skill-builder-list');
      if (customSkills.length === 0) {
        list.innerHTML = '<div style="font-size:0.65rem;color:var(--text-muted);padding:0.25rem 0.5rem">暂无自定义 Skills</div>';
        return;
      }
      list.innerHTML = customSkills.map(skill => `
        <div class="skill-list-item ${sbSelectedSkillId === skill.id ? 'active' : ''}" onclick="openSkillBuilder('${skill.id}')">
          <span class="skill-icon">⚡</span>
          <span class="skill-name">${esc(skill.name)}</span>
          <span class="skill-steps">${skill.steps?.length || 0}步</span>
          <div class="skill-actions">
            <button class="icon-btn" onclick="event.stopPropagation();deleteCustomSkill('${skill.id}')" title="删除" style="font-size:0.6rem;color:var(--danger)">✕</button>
          </div>
        </div>
      `).join('');
    }

    function deleteCustomSkill(skillId) {
      if (!confirm('确定删除该 Skill？')) return;
      customSkills = customSkills.filter(s => s.id !== skillId);
      saveCustomSkills();
      renderSkillBuilderList();
      showToast('Skill 已删除');
    }

    function copySkillJson() {
      const skill = generateSkillJson();
      if (!skill) return;
      const json = JSON.stringify(skill, null, 2);
      navigator.clipboard.writeText(json).then(() => {
        showToast('已复制到剪贴板');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = json;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('已复制到剪贴板');
      });
    }

    // Update preview when inputs change
    ['sb-skill-name', 'sb-skill-desc', 'sb-skill-category'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', () => {
        const preview = document.getElementById('sb-preview');
        const content = document.getElementById('sb-preview-content');
        const skill = generateSkillJson();
        if (skill && skill.steps[0]?.prompt) {
          content.textContent = JSON.stringify(skill, null, 2);
          preview.style.display = 'block';
        }
      });
    });

    // ===== INIT =====
    selectedPath = { type: 'person' };
    render();
    renderSkillBuilderList();
  </script>
</body>
</html>
