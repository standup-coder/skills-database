        { id: 'gitops-workflow', name: 'GitOps 工作流', nameEn: 'GitOps Workflow', desc: 'GitOps 是以 Git 为单一事实来源的运维方法，声明式描述期望状态，Operator 自动协调实际状态与期望状态一致。ArgoCD 和 Flux 是 Kubernetes 原生 GitOps 工具，通过持续协调保障集群状态与 Git 仓库一致，支持多集群管理和配置漂移检测', category: 'devops',
          steps: ['llm','transform'],
          knowledgePoints: [
            { id: 'kp-go-principles', name: 'GitOps 四大原则', desc: '声明式配置：所有基础设施和应用配置以声明式 YAML 描述；版本控制：Git 仓库作为唯一事实来源，每次变更都是可追溯的 commit；自动协调：Operator（ArgoCD/Flux）持续监控实际状态，自动拉取对齐 Git 定义；增强安全：Git 的 RBAC/Audit 替代手动运维，变更经过 Code Review' },
            { id: 'kp-go-argocd', name: 'ArgoCD 核心概念与操作', desc: 'Application：指向 Git 仓库的 K8s  manifests 的声明式定义，name/ns/repo/path/spec。Project：多 Application 的逻辑分组，限制目标集群/命名空间/资源类型。AppSet：ApplicationSet generator 批量生成应用（Git generator/List generator/Matrix generator）。Sync Policy：Auto-sync（自动同步）/Manual（手动）/Out-of-Sync（检测到漂移）。Health Check：K8s 资源状态检查（Progressing/Healthy/Degraded）。Rollback：历史 commit 一键回滚' },
            { id: 'kp-go-argocd-helm', name: 'ArgoCD + Helm 集成', desc: 'Helm Chart 发布：Git 仓库存储 Chart 源码，ArgoCD 通过 helm template 渲染。Values 覆盖：Application spec.source.helm.parameters 或 values-files（staging-values.yaml/prod-values.yaml）。Helm Release：ArgoCD 自动创建 HelmRelease CR（需要 Helm Operator）。依赖管理：Chart.yaml dependencies，argo cd sync 触发依赖更新。模板复用：Application 嵌套（app-of-apps）模式' },
            { id: 'kp-go-flux', name: 'Flux 核心机制', desc: '架构：source-controller（GitRepository/ HelmRepository/ Bucket）→ kustomize-controller/helm-controller（应用协调）→ notification-controller（事件）。GitRepository：spec.url/spec.ref（branch/tag/semver）spec.secretRef 拉取凭证。Kustomization：spec.path/spec.prune/spec.sourceSuspend 目标路径和清理策略。HelmRelease：helm release 的声明式管理。Image Automation：image-reflector-controller + image-automation-controller 自动更新镜像版本' },
            { id: 'kp-go-drift', name: '配置漂移检测与修复', desc: 'Drift 检测：ArgoCD diff against live state 或 Flux reconciliation 报告。Ignore：kubectl annotate app.kubernetes.io/ignore=true 或 ArgoCD ignoreDifferences 配置。Force Sync：手动触发同步覆盖集群变更（需谨慎）。防止漂移：禁止 kubectl apply/edit 直接修改集群资源，所有变更走 Git。监控 Drift：ArgoCD UI 健康状态 OutOfSync 告警、Flux 发送 Events 到 Slack。Drift 处理：Git 变更触发同步 vs 手动修改回滚' },
            { id: 'kp-go-multicluster', name: '多集群与环境管理', desc: 'Cluster Registration：context/credentials 注册外部集群到 ArgoCD/Flux。Environment promotion：GitOps  promotion pipeline（dev → staging → prod），Helm values 不同环境不同。Ref 策略：branch by environment（main/dev/staging/prod）或 directory per env（apps/dev/ apps/prod/）。Overlay：Kustomize overlays（base + envs/dev kustomization.yaml）。App-of-Apps：顶层 Application 管理子 Application' },
            { id: 'kp-go-security', name: 'GitOps 安全与审计', desc: 'RBAC：ArgoCD permissions（角色：admin/readonly/action）/ Flux RBAC v1。Source 凭证：Git HTTPS token/SSH key 存储为 Kubernetes Secret。Sealed Secrets：Sealed Secrets Controller 解密 Git 加密的 Secret。Audit：Git 提交日志/App sync history/Flux events 审计追溯。Image signing：Cosign 签名镜像，ArgoCD Image Updater 仅接受签名镜像' }
          ]
          resources: [
            { title: 'ArgoCD 官方文档', url: 'https://argo-cd.readthedocs.io/', type: 'doc', source: 'ArgoCD' },
            { title: 'Flux 官方文档', url: 'https://fluxcd.io/docs/', type: 'doc', source: 'Flux' },
            { title: 'GitOps 最佳实践', url: 'https://www.gitops.tech/', type: 'tutorial', source: 'GitOps' },
            { title: 'ArgoCD 应用集', url: 'https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/', type: 'doc', source: 'ArgoCD' },
            { title: 'GitOps 入门教程', url: 'https://www.weave.works/blog/getting-started-with-gitops', type: 'tutorial', source: 'Weaveworks' },
            { title: '多集群 GitOps', url: 'https://fluxcd.io/docs/guides/multi-tenancy/', type: 'tutorial', source: 'Flux' },
          ]
        },
        { id: 'secrets-management', name: '密钥管理', nameEn: 'Secrets Management', desc: '密钥管理是云原生安全的基础设施，从静态密钥存储到动态密钥分发都需要安全设计。HashiCorp Vault 提供了集中的 Secrets 管理、PKI 自动化、动态数据库凭证和密钥轮转。AWS Secrets Manager/Azure Key Vault/GCP Secret Manager 提供云厂商原生的密钥管理方案', category: 'devops',
          steps: ['run-shell-command','llm','transform'],
          knowledgePoints: [
            { id: 'kp-sm-vault', name: 'HashiCorp Vault 架构与部署', desc: 'Storage Backend：Consul（生产推荐）/Raft（本地）/S3/GCS 高可用存储。Auth Method：Token/Kubernetes auth（ServiceAccount）/AWS IAM/GitHub/JWT/OIDC。Secret Engine：kv-v2（键值）/aws（动态凭证）/database（动态数据库密码）/pki（证书自动化）/ssh（SSH 证书）。高可用：多 Vault server 共享存储，active 节点写，standby 节点读。部署模式：Vault Agent sidecar/Init Container/CSI Provider。审计：audit backend（file/syslog/cloudwatch）记录所有访问' },
            { id: 'kp-sm-kms', name: '云 KMS 集成', desc: 'AWS KMS：密钥策略/IAM 策略分离，加密/解密/Sign 操作审计。Azure Key Vault：RBAC 访问策略（keys/certs/secrets 权限分离）/软硬件 HSM。GCP Cloud KMS：KeyRing/CryptoKey 层级，项目级/组织级策略。信封加密：DEK（数据加密密钥）由 KEK（密钥加密密钥）加密存储。云 KMS 场景：S3 加密/ EBS 加密/ RDS 加密/ Secret Manager 集成' },
            { id: 'kp-sm-dynamic', name: '动态密钥与最小权限', desc: '动态凭证：Vault AWS engine 生成临时 AK/SK，TTL 可配置（默认 1h），过期自动 revoke。数据库动态密码：PostgreSQL/MySQL/MongoDB 动态账号密码，避免应用硬编码。JWT/Token 动态签发：Vault 签发 OIDC/Sparkar JWT Token。最小权限原则：应用仅申请所需路径的 read 权限，Token 有 TTL 限制。动态密钥优势：泄露窗口短（TTL 内有效）、无需轮转（动态生成）、审计可追溯' },
            { id: 'kp-sm-rotation', name: '密钥轮转策略', desc: '自动轮转：Vault PKI engine 的 issuer_rotation 中间 CA 自动轮转。数据库密码轮转：Vault database secrets engine 定期生成新密码。AWS IAM 轮转：vault aws configure-role 创建时指定 ttl/renew。轮转中间件：应用需要兼容 key rotation（启动时重新读取或热加载机制）。不中断轮转：short-lived token + 续期机制。证书轮转：cert-manager + Vault PKI 自动续期 TLS 证书' },
            { id: 'kp-sm-injection', name: '密钥注入与 CSI Provider', desc: 'Vault Agent：sidecar inject 自动注入 Token 到 Pod，通过 secretFile 或 env 方式。CSI Provider：Kubernetes Secrets Store CSI Driver 将 Vault Secret 挂载为文件。Init Container：vault agent inject init 容器预拉取 Secret。External Secrets Operator（ESO）：Kubernetes 原生 External Secrets operator，连接 Vault/AWS SM/GCP SM。动态 vs 静态：动态密钥 TTL 短需频繁刷新，静态密钥需定期手动轮转' },
            { id: 'kp-sm-vault-ha', name: 'Vault 高可用与灾难恢复', desc: 'HA 架构：3-5 个 Vault server 节点，active 通过 GCS/S3/Consul 共享状态。Unseal：Key Shamir 拆分（3-of-5），Vault operator 手动 unseal 或自动 unseal（KMS/AutoUnseal）。复制：Vault Enterprise Performance Replication 多数据中心容灾。Snapshot：etcd/consul snapshot 备份，Vault 状态恢复。迁移：Vault snapshot 迁移到新集群（审计日志不可迁移）' }
          ]
          resources: [
            { title: 'HashiCorp Vault 文档', url: 'https://developer.hashicorp.com/vault/docs', type: 'doc', source: 'HashiCorp' },
            { title: 'Vault HA 部署', url: 'https://developer.hashicorp.com/vault/docs/internals/architecture', type: 'doc', source: 'HashiCorp' },
            { title: 'AWS Secrets Manager', url: 'https://docs.aws.amazon.com/secretsmanager/latest/userguide/', type: 'doc', source: 'AWS' },
            { title: 'External Secrets Operator', url: 'https://external-secrets.io/latest/', type: 'doc', source: 'ESO' },
            { title: 'Sealed Secrets 文档', url: 'https://github.com/bitnami-labs/sealed-secrets', type: 'tutorial', source: 'GitHub' },
            { title: '密钥轮转最佳实践', url: 'https://developer.hashicorp.com/vault/docs/secretsrotation', type: 'tutorial', source: 'HashiCorp' },
          ]
        },
        { id: 'config-validator', name: '配置校验器', nameEn: 'Config Validator', desc: '配置校验是防止错误配置进入生产的关键 gate，通过 Schema 验证、策略引擎和评分工具保障 K8s/Terraform 配置的合规性和安全性。OPA/Kyverno 是 K8s 原生的策略引擎，Polaris/kube-score 提供配置最佳实践评分，Checkov/tfsec 扫描 IaC 安全风险', category: 'devops',
          steps: ['read-file','validate-k8s-manifest','llm','transform'],
          knowledgePoints: [
            { id: 'kp-cv-schema', name: 'Schema 校验与 OPA', desc: 'JSON Schema：Kubernetes resource 结构验证（openapi-schema-validator）。OPA（Open Policy Agent）：Rego 策略语言，声明式策略评估引擎。Gatekeeper：OPA 的 K8s 集成方案（ConstraintTemplate/Constraint）。Rego 示例：拒绝 privileged 容器：violation[msg] { input.review.object.spec.privileged == true msg := "Privileged container not allowed" }。OPA CLI：opa eval/test 本地测试策略。OPA Bundle： Bundle 推送机制，远程策略中心化管理' },
            { id: 'kp-cv-kyverno', name: 'Kyverno Kubernetes 原生策略', desc: 'Kyverno 特点：K8s 原生，YAML 编写策略，无需学习 Rego。策略类型：Validate（拒绝不符合配置）/Mutate（自动修改配置）/Generate（创建资源）。Validate 示例：禁止 root 用户运行容器：validatingRule: match: any: resources: kinds: [Pod] validate: pattern: not: spec: securityContext: runAsNonRoot: "false"。Mutate 示例：自动注入 sidecar 代理。Generate 示例：Namespace 创建时自动生成 NetworkPolicy。Webhook：Kyverno admission controller 拦截 K8s API 请求' },
            { id: 'kp-cv-scorecard', name: '配置评分工具', desc: 'Polaris：K8s 配置最佳实践评分（CPU/内存限制、health check、security context），dashboard 可视化。kube-score：K8s resource 分析，输出 0-10 分数和优化建议。Checkov：Terraform/CloudFormation/Dockerfile 安全扫描，400+ 内置策略（CIS/AWS Foundational）。tfsec：Terraform 安全扫描，嵌入 HCL 解析（无需 Terraform init）。Kubesec：K8s resource 安全评分，HTTP API 和 CLI。集成 CI：Polaris admission webhook / Checkov GitHub Action / tfsec GitLab CI' },
            { id: 'kp-cv-prd', name: '策略即代码（Policy as Code）', desc: '策略仓库：Git 存储策略定义，PR review 机制，版本控制。CI 集成：PR 必须通过策略检查，block merge 阻止不符合策略的配置。异常豁免：Policy exception（Temporary/Justified），审计追踪。策略分层：Organization-level（安全基线）/Team-level（团队规范）/Project-level（应用特定）。合规映射：CIS/AWS Foundational benchmarks → 自动化策略规则。持续更新：安全漏洞（CVE） → 规则更新 → 自动生效' },
            { id: 'kp-cv-template', name: '配置模板与基线', desc: 'K8s 基线：Pod Security Standards（Baseline/Restricted）、NSA/CISA Kubernetes Hardening Guide。Terraform 基线：CIS AWS/GCP/Azure Benchmark，以 Terraform module 形式固化。配置模板：Helm Chart values 模板，YAML 继承，Overlay 机制。参数化：variable 暴露可配置项，validation 限制取值范围。环境差异化：dev/staging/prod 不同的资源限制/副本数/配额，通过 Kustomize overlay 实现' }
          ]
        },

        // === Backend Skills ===
        { id: 'system-design', name: '系统设计', nameEn: 'System Design', desc: '系统设计是高级后端工程师的核心能力，涉及高可用、高并发、分布式系统的架构设计。涵盖 CAP 定理、负载均衡、缓存策略、消息队列、微服务拆分、数据库分库分表等核心主题。是架构设计评审、技术选型决策和容量规划的基础', category: 'architecture',
          steps: ['llm','transform'],
          knowledgePoints: [
            { id: 'kp-sd-cap', name: 'CAP 定理与一致性选择', desc: 'CAP 定理：分布式系统无法同时满足一致性（Consistency）、可用性（Availability）、分区容忍（Partition tolerance）。Base 理论：基本可用（Basically Available）、软状态（Soft State）、最终一致（Eventually Consistent）。强一致性场景：金融交易、库存扣减（CP 系统）。最终一致性场景：社交 feed、评论、点赞（AP 系统）。一致性协议：Paxos/Raft 共识算法、RWN 协议、Quorum 机制。实际选型：大多数业务选择最终一致性，通过业务补偿（Saga 模式）处理冲突' },
            { id: 'kp-sd-ha', name: '高可用设计模式', desc: '冗余设计：多副本部署（Active-Active/Active-Passive），跨 AZ 分布消除单点。故障隔离：舱壁模式（Bulkhead）隔离不同服务、泳道隔离（Canary/Ring）、断路器（Circuit Breaker）。多活架构：同城双活（低延迟、同步复制）、两地三中心（异地灾备、异步复制）。降级策略：功能降级（非核心功能关闭）、限流（Token Bucket/Leaky Bucket）、熔断（连续失败触发 Open 状态）。混沌工程：故障注入（Chaos Monkey/GameDay），主动发现系统薄弱环节。SLA 计算：Availability = MTBF / (MTBF + MTTR)，99.9% = 月 43.8 分钟 downtime' },
            { id: 'kp-sd-scaling', name: '水平扩展与负载均衡', desc: '无状态设计：Session 外置（Redis）、服务无本地状态、计算层水平扩缩。分片策略：一致性 Hash（虚拟节点减少数据迁移）、范围分片（按 ID 范围/时间分片）。负载均衡：四层 LVS/Nginx（TCP 转发）、七层 HAProxy/Envoy（HTTP 路由）。算法：轮询、加权、最小连接、一致性 Hash。读写分离：Read replicas 分担读流量、Replication lag 监控、过期读处理（读取强制路由主库）。数据库连接池：HikariCP/MaxIdle/conn-max-lifetime 配置、ProxySQL 中间件' },
            { id: 'kp-sd-cache', name: '多级缓存与缓存策略', desc: '缓存层级：本地缓存（Caffeine/Guava Cache，TTL 短）→ 分布式缓存（Redis Cluster，TTL 长）→ CDN（静态资源）。缓存模式：Cache-Aside（旁路缓存，读写分离）、Read-Through（缓存自动加载）、Write-Through（同步写）、Write-Behind（异步写）。缓存问题：穿透（布隆过滤器/miss 后写空值）、击穿（热点 key 加互斥锁）、雪崩（TTL 随机 jitter + 熔断）、双写一致（延迟双删/CRC）。Redis 最佳实践：Pipeline 批量操作、Scan 替代 Keys、HyperLogLog 统计、Bitmap 位图' },
            { id: 'kp-sd-mq', name: '消息队列与异步架构', desc: 'MQ 选型：Kafka（高吞吐、日志采集）、RabbitMQ（复杂路由、延迟队列）、RocketMQ（事务消息、金融级）、Pulsar（多租户、云原生）。消息模式：Point-to-Point（Queue）、Pub/Sub（Topic）、Fan-out（广播）。可靠性：持久化（ack=1）、消费确认（手动 ack）、重试队列（DLQ）、幂等消费（消息去重表）。顺序保证：单分区有序 + 单消费者，或在应用层做排序。流量削峰：MQ 缓冲瞬时流量，下游消费者按能力消费。事务消息：RocketMQ 事务消息模式，half 消息 + 本地事务 + 回查' },
            { id: 'kp-sd-microservice', name: '微服务拆分与治理', desc: '拆分原则：领域驱动设计（DDD）识别 Bounded Context，微服务边界对应业务能力边界。拆分粒度：服务过少（Monolith）vs 服务过多（Distributed Monolith）。服务发现：Client-side（Ribbon/Eureka）和 Server-side（K8s DNS + CoreDNS）。API Gateway：路由转发（path/router）/鉴权（JWT）/限流（Token Bucket）/协议转换。服务网格（Service Mesh）：Istio/Linkerd 接管服务间通信（mTLS/负载均衡/熔断）。分布式事务：Saga（编排/协同）、TCC（Try-Confirm-Cancel）、可靠消息最终一致性。合同测试：Pact 契约测试，Consumer-Driven Contract' }

        { id: 'database-design', name: '数据库设计', nameEn: 'Database Design', desc: '数据库设计涵盖关系型数据库建模、索引优化、查询调优、分库分表和数据迁移。是后端工程师日常工作的核心技能，也是系统性能瓶颈的主要来源。本技能覆盖 PostgreSQL/MySQL 的深度应用，以及 MongoDB/Redis/Elasticsearch 等 NoSQL 的选型原则', category: 'backend',
          steps: ['read-file','llm','transform'],
          knowledgePoints: [
            { id: 'kp-dd-modeling', name: '数据建模与范式', desc: 'ER 模型：实体（Entity）、属性（Attribute）、关系（Relation）。三范式：1NF（原子属性）、2NF（无部分依赖）、3NF（无传递依赖）。反范式：读取性能优先场景，冗余字段/预计算字段（Denormalization）。领域驱动：聚合根（Aggregate Root）、实体（Entity）、值对象（Value Object）。CQRS：Command Query Responsibility Segregation，读写分离模型。Schema 评审：数据类型选择（INT vs BIGINT vs UUID）、NOT NULL 约束、DEFAULT 值、CHECK 约束' },
            { id: 'kp-dd-index', name: '索引设计与查询优化', desc: 'B+Tree 原理：聚簇索引（主键索引）、非聚簇索引（辅助索引）、联合索引（最左前缀匹配）。索引类型：唯一索引（UNIQUE）、全文索引（FULLTEXT）、GIN/GiST（PostgreSQL JSON/几何）。EXPLAIN ANALYZE：扫描类型（Seq Scan/Index Scan/Index Only Scan）、成本估算、rows 估算。覆盖索引：查询列都在索引中（Index Only Scan），避免回表。慢查询优化：索引失效（隐式转换/函数/OR/!=）、JOIN 顺序、深度分页（游标分页替代 OFFSET）。索引维护：ANALYZE 更新统计信息、REINDEX 重建索引、BRIN 索引（时序数据）' },
            { id: 'kp-dd-sharding', name: '分库分表与分布式 ID', desc: '分片策略：哈希分片（user_id % N，余数路由）、范围分片（时间/ID 范围）、目录分片（路由表）。ShardingSphere/MySQL Fabric/ShardingSphere-JDBC 分片中间件。分布式 ID：雪花算法（TS + machine_id + seq）、UUID（无序）、Leaf（美团 ID 生成器）、ULID（排序 UUID）。跨分片查询：并行查询 + 结果归并、ES/Hive 做二级查询引擎。数据迁移：双写（业务代码写两份）、CDC（Debezium 变更捕获）、全量 + 增量同步、分批次平滑迁移。分片后问题：JOIN 跨分片、事务跨分片（两阶段提交/XA）、分页（先聚合后分页）' },
            { id: 'kp-dd-nosql', name: 'NoSQL 选型与应用', desc: '键值存储：Redis（缓存/会话/分布式锁）、Memcached（简单缓存）。文档数据库：MongoDB（灵活 Schema、嵌套文档、MapReduce）、CouchDB。列式存储：Cassandra（写入优化、多数据中心）、HBase（随机读写、HDFS 存储）。搜索引擎：Elasticsearch（全文搜索、日志分析、指标聚合）。时序数据库：InfluxDB/Prometheus（监控数据、物联网传感器）。图数据库：Neo4j（关系图谱、社交网络、推荐系统）。选型原则：数据结构（结构化/半结构化/非结构化）、一致性要求（强一致/最终一致）、读写模式（随机写/批量写/高读取）' },
            { id: 'kp-dd-migration', name: '数据迁移与同步', desc: '迁移策略：Big Bang（停机迁移）vs 渐变式（Strangler Fig 模式）。双写方案：应用层同时写新旧库，CDC 补充变更。CDC 工具：Debezium（MySQL/PostgreSQL/MongoDB 变更捕获）、Maxwell（MySQL binlog）、Canal（阿里 MySQL binlog）。数据校验：checksum 表行数对比、抽样数据内容对比、增量校验。回滚方案：迁移失败回切旧库、Data Rollback SQL 生成。Schema 变更：pt-online-schema-change（Percona Toolkit）、gh-ost（GitHub MySQL）、Online DDL。版本化：Flyway/Liquibase 管理 Schema 版本，Migration 历史可追溯' }
          ],
          resources: [
            { title: 'PostgreSQL 官方文档', url: 'https://www.postgresql.org/docs/', type: 'doc', source: 'PostgreSQL' },
            { title: 'MySQL 官方文档', url: 'https://dev.mysql.com/doc/refman/8.0/en/', type: 'doc', source: 'MySQL' },

        { id: 'api-design', name: 'API 设计', nameEn: 'API Design', desc: 'API 设计是后端系统面向客户端（Web/移动端/其他服务）的契约，直接影响前端开发效率和系统可维护性。RESTful API 是最广泛使用的风格，GraphQL 提供灵活的数据查询能力，gRPC 用于高性能服务间通信。本技能覆盖 API 风格选择、版本管理、安全设计、文档化和错误处理规范', category: 'backend',
          steps: ['llm','transform'],
          knowledgePoints: [
            { id: 'kp-ad-rest', name: 'RESTful API 设计原则', desc: '资源命名：名词复数（/users/123/orders）、嵌套路由（/users/123）、避免动词（/users/123/activate）。HTTP 方法语义：GET（幂等安全）、POST（创建）、PUT（完整替换）、PATCH（部分更新）、DELETE（幂等）。状态码：2xx（成功）、4xx（客户端错误）、5xx（服务端错误）。HATEOAS：响应中包含下一步可操作链接（_links.self/href/method）。Pagination：Cursor-based（keyset）vs Offset-based（page/limit），大数据量用 Cursor。Filtering：?status=active&type=premium，多字段用 & 连接。Sorting：?sort=-created_at,name（- 表示降序）' },
            { id: 'kp-ad-graphql', name: 'GraphQL Schema 设计', desc: 'Schema 类型：Query（读）、Mutation（写）、Subscription（实时）、Input（复杂入参）、Enum（枚举）。Resolver 设计：Resolver 粒度（字段级 vs 类型级）、DataLoader 解决 N+1。Pagination：Connection/Edge/Node 模式（Relay spec），cursor-based 分页。Federation：Schema 拼接（users/orders/products 子图），_resolve Reference 跨服务边界。Error Handling：errors 数组_extensions.code，extensions 是结构化错误信息。性能优化：@cacheControl 声明缓存策略、Query complexity 分析、persisted queries 防止滥用' },
            { id: 'kp-ad-versioning', name: 'API 版本管理与兼容', desc: 'URL 版本：/v1/users /v2/users，major 版本不兼容时升级。Header 版本：Accept: application/vnd.api+json; version=2。兼容策略：字段新增（可选，默认值）、字段废弃（保留旧名 + Deprecation 响应头）、字段删除（跨 major 版本）。Changelog：/CHANGELOG.md 记录 breaking change。灰度发布：Header 控制版本，按用户 ID 分组（cookie/check header 路由不同实现）。Contract Test：Pact/Contract Broker 保障 Consumer 与 Provider 契约一致' },
            { id: 'kp-ad-docs', name: 'OpenAPI 文档与 Mock', desc: 'OpenAPI 3.0：paths/ components/schemas/ security 完整描述 API。Schema 复用：$ref 引用 components/schemas 避免重复。文档工具：Swagger UI（实时调试）/ Redoc（美观文档）/ Scalar（现代风格）。Mock Server：Prism/Prismock 基于 OpenAPI 生成 Mock，CI 中做 Contract Test。示例数据：example 字段提供真实感的示例请求/响应。SDK 生成：openapi-generator/fern 生成多语言客户端 SDK（TypeScript/Go/Python）。版本同步：CI 中 openapi-validator 检查代码与文档一致' },
            { id: 'kp-ad-security', name: 'API 安全设计', desc: '认证授权：Bearer Token（JWT）、API Key（机器对机器）、OAuth2（用户授权）。Rate Limiting：固定窗口（X-RateLimit-Limit/Remaining）、滑动窗口、Token Bucket。输入校验：Zod/Joi/JSON Schema 校验请求体，400 Bad Request 返回校验错误。敏感数据：脱敏（手机号 138****1234）、不返回明文密码/Token。CORS：Access-Control-Allow-Origin 限制、Credential 模式。Headers：X-Request-ID（链路追踪）、X-RateLimit-Reset（限流重置时间）。日志：访问日志（method/path/status/duration），敏感字段脱敏后才记录' },
            { id: 'kp-ad-async', name: '异步 API 与 Webhook 设计', desc: 'Async API：创建请求返回 202 Accepted + Location header，客户端轮询或 Webhook 通知结果。Job/Task API：/jobs/{id}/status、/tasks/{id} 状态查询接口。Webhook：HMAC-SHA256 签名验证 payload、幂等处理（event_id 去重）、重试策略（exponential backoff）、Sec-Webhook-Secret。Server-Sent Events（SSE）：text/event-stream 推送、Last-Event-ID 重连恢复。WebSocket：握手中检查 Token，ping/pong 保活，reconnect 策略' }
          ],
          resources: [
            { title: 'RESTful API 设计规范', url: 'https://restfulapi.net/', type: 'tutorial', source: 'RESTful API' },

        { id: 'generate-deployment-guide', name: '部署指南生成', nameEn: 'Deployment Guide Generation', desc: '为项目生成标准化部署文档、运维手册和故障排查指南', category: 'architecture',

        { id: 'api-development', name: 'API 开发', nameEn: 'API Development', desc: 'API 开发涵盖服务端框架选型、中间件设计、错误处理、参数校验和性能优化。Node.js 生态（Express/Fastify/NestJS）和 Go/Java 等语言有不同的性能和开发体验权衡。本技能覆盖从请求入口到响应出口的完整链路，是后端工程师日常工作的核心', category: 'backend',
          steps: ['read-file','write-file','llm','transform'],
          knowledgePoints: [
            { id: 'kp-ap-framework', name: '框架选型与架构', desc: 'Express：中间件洋葱模型、轻量灵活，适合微服务。Fastify：性能最优（fastify.compile），Schema validation（fast-json-stringify），Plugin system。NestJS：TypeScript 完整框架，Decorator-based API，Module/Provider/Controller 架构，依赖注入（IoC）。Koa：async/await 原生支持，中间件更简洁。性能对比：Fastify > Koa > Express（via bench），但 Express 生态最成熟。框架选择：快速开发选 NestJS，性能优先选 Fastify，微服务选 Express/Koa' },
            { id: 'kp-ap-middleware', name: '中间件设计与请求链', desc: '中间件链：request → auth → rateLimit → logging → handler → response，每个中间件 (req, res, next)。洋葱模型：koa-compose 实现的深度嵌套调用，before/after 拦截。常见中间件：cors（跨域）、helmet（安全头）、compression（压缩）、bodyParser（请求体解析）。自定义中间件：auth middleware（JWT 验证）、error middleware（统一错误捕获）、validation middleware（参数校验）。中间件顺序：logger（最外层）、cors（早期）、auth（路由前）、rateLimit（防止滥用）。中间件错误：next(err) 传递错误，error handler 中间件统一处理' },
            { id: 'kp-ap-error', name: '统一错误处理机制', desc: 'Error 类层次：AppError（业务错误）+ 400/401/403/404/500 子类。错误码设计：ERR_xxx 格式（ERR_USER_NOT_FOUND/ERR_TOKEN_EXPIRED），前端 switch case 处理。错误响应格式：{ code: 40001, message: "用户名或密码错误", details: [] }。堆栈处理：生产环境 sanitizeError 移除 stack（防信息泄露），开发环境保留。异步错误：try/catch + next(err)，或 express-async-errors 自动捕获。5xx 处理：外部服务超时/熔断返回降级结果，不暴露内部错误。日志：错误日志包含 request_id、user_id、stack trace' },
            { id: 'kp-ap-validation', name: '参数校验与类型安全', desc: 'Zod：TypeScript-first，schema.infer<> 推导类型，coerce 强制类型转换（string/number/boolean）。Joi：成熟的校验库，schema.describe() 自文档化。Class-validator：Decorator-based，@IsString()/@IsEmail() 注解，配合 class-transformer 做 POJO 转类实例。校验失败响应：400 Bad Request，{ errors: [{ field: "email", message: "Invalid email" }] }。Schema-first：OpenAPI schema → 生成校验代码（zod-openapi）。文件上传：multer/busboy 解析 multipart，文件名 sanitizer 防止路径遍历' },
            { id: 'kp-ap-perf', name: 'API 性能与可扩展性', desc: '连接池：数据库连接池大小（pool.size: 10-50）、idleTimeout、connectionTimeout。N+1 查询：DataLoader 批量加载（GraphQL style），JOIN 查询替代循环查询。响应压缩：compression middleware，Accept-Encoding: gzip/br。ETag：res.set("ETag", hash)，304 Not Modified。查询优化：EXPLAIN ANALYZE 分析慢查询、索引覆盖（covering index）、分页 offset 优化（seek method）。并发控制：semaphore 控制并发数（async semaphore），防止下游过载。反压机制：上游慢时主动 reject（Circuit Breaker）' },
            { id: 'kp-ap-grpc', name: 'gRPC 与高性能通信', desc: 'Protocol Buffers：.proto 文件定义 service/message，protoc 编译生成多语言客户端。HTTP/2：多路复用（单 TCP 连接多 stream）、Server Push、双向流。gRPC 四种模式：Unary（简单 RPC）、Server Streaming（服务端流）、Client Streaming（客户端流）、Bidirectional Streaming（双流）。Interceptor：UnaryInterceptor/StreamInterceptor 做 logging/auth。负载均衡：client-side（round_robin/round_robin）+ service mesh（xds）。JSON transcoding：gRPC-JSON Gateway 兼容 REST API 调用 gRPC 服务。适用场景：内部微服务通信、低延迟需求、移动端后端' }
          ]
          resources: [
            { title: 'Express 官方文档', url: 'https://expressjs.com/', type: 'doc', source: 'Express' },

        { id: 'authentication', name: '认证与授权', nameEn: 'Authentication & Authorization', desc: '认证（Authentication）确认用户身份，授权（Authorization）决定用户能访问什么资源。现代应用需要 JWT、OAuth2、Session 等多种认证方式，以及 RBAC/ABAC 等权限模型。本技能覆盖身份认证、令牌管理、权限控制和 MFA 等安全机制的设计与实现', category: 'backend',
          steps: ['llm','transform'],
          knowledgePoints: [
            { id: 'kp-auth-jwt', name: 'JWT Token 设计与实现', desc: 'Token 结构：Header（alg/typ）+ Payload（sub/exp/iat/nbf）+ Signature。Claims：registered（iss/sub/exp/iat）、public（name/email）、private（roles/permissions）。过期策略：Access Token（短效 15min）+ Refresh Token（长效 7d）+ refresh rotation（每次使用后 rotate）。黑名单：Redis 存储 revoked token_id（jti），每次请求检查。验证注意：signature 验证（HMAC/RSA）、exp/nbf/iat 校验、issuer/audience 校验。刷新流程：POST /auth/refresh → 验证 refresh token → 返回新 access + rotate refresh。安全建议：HTTPS only、Secure cookie、SameSite=Strict、禁止 HTML 中存储 JWT' },
            { id: 'kp-auth-oauth2', name: 'OAuth2.0 与 OIDC 协议', desc: '授权码模式（Authorization Code）：安全性最高，适合 Server-side 应用，PKCE 加强保护。PKCE：code_verifier（S256 挑战）+ code_challenge，防止授权码拦截。Client Credentials：适合 M2M（机器对机器），client_id + client_secret 获取 access_token。Implicit 模式（已废弃）：access_token 在 URL fragment，不安全。Device Flow：TV/CLI 设备扫码登录，设备端轮询 token。OIDC：OpenID Connect 在 OAuth2 基础上增加 id_token（用户身份）。Token 验证：introspection endpoint 或 JWT 本地验证（公钥）' },
            { id: 'kp-auth-rbac', name: 'RBAC 与 ABAC 权限模型', desc: 'RBAC：Role-Based Access Control，用户-角色-权限三层模型。Role 设计：最小权限角色（admin/viewer/editor）、角色继承（viewer < editor < admin）。Permission 设计：resource:action 格式（user:read、order:write、admin:delete）。ABAC：Attribute-Based Access Control，基于用户属性（部门/职级/时间）、资源属性（所有者/敏感度）、环境属性（IP/时间）的动态策略。Policy Engine：Casbin/OPA Rego 策略评估。数据库设计：users/roles/permissions 表 + user_roles/role_permissions 关联表' },
            { id: 'kp-auth-session', name: 'Session 管理与分布式 Session', desc: 'Session 存储：Redis（推荐，支持过期、集群）、Memcached、MySQL（不推荐）。Session 结构：session_id（UUID）+ user_id + data（roles/permissions/metadata）。Cookie 安全：HttpOnly（JS 不可读）、Secure（HTTPS only）、SameSite（CSRF防护）、Path（限定路径）。Session Fixation：登录后 regenerate session_id。并发控制：单点登录（SSO）Token 唯一 vs 多设备登录（Token 版本号）。Session 过期：Sliding expiration（活跃延期）vs Absolute expiration（固定过期）。分布式 Session：Spring Session + Redis、express-session + connect-redis' },
            { id: 'kp-auth-mfa', name: '多因素认证与无密码认证', desc: 'TOTP：Time-based One-Time Password，Google Authenticator/Microsoft Authenticator，支持 6 位 30 秒动态码。备份码：一次性备用码用于 MFA 设备丢失场景。WebAuthn/FIDO2：公钥认证（浏览器内置），支持指纹/faceid/ security key，消除密码钓鱼风险。Passkey：WebAuthn 的用户友好的实现，跨设备同步（Hicloud/1Password 支持）。SMS OTP（不推荐）：SIM 交换攻击风险，成本高。设备信任：首次登录设备标记为信任（device fingerprint + MFA），后续简化验证' },
            { id: 'kp-auth-sso', name: 'SSO 单点登录与身份联邦', desc: 'SAML 2.0：XML-based SSO，IDP（身份提供者）+ SP（服务提供者），支持 enterprise SSO（ADFS/Okta）。OIDC：JSON-based，IDP 授权码模式 + id_token，现代应用首选。IDP 选项：Okta/Auth0/Keycloak（自建）、Azure AD/Google Workspace（企业账号）。Account Linking：同一用户多个 IDP 账户关联（email 为 linking identifier）。Logout：Single Logout（SLO）同步登出所有 SP。Scim：System for Cross-domain Identity Management，用户目录自动同步（入职/离职自动开通/回收账号）' }
          ],
          resources: [
            { title: 'JWT 官方文档', url: 'https://jwt.io/', type: 'doc', source: 'JWT.io' },
            { title: 'OAuth2.0 官方规范', url: 'https://oauth.net/2/', type: 'doc', source: 'OAuth.net' },

            { title: 'Auth0 学习中心', url: 'https://auth0.com/docs/get-started', type: 'tutorial', source: 'Auth0' }

        // === Frontend Skills ===
        { id: 'frontend-architecture-design', name: '前端架构设计', nameEn: 'Frontend Architecture', desc: '前端架构设计涵盖项目结构、技术选型、构建系统和部署策略。Monorepo 管理（Turborepo/Nx）、微前端（Module Federation/qiankun）、SSR/SSG（Next.js/Nuxt.js）是现代前端架构的核心模式。架构决策需要平衡团队规模、业务复杂度和长期维护成本', category: 'frontend',
          steps: ['llm','transform'],
          knowledgePoints: [
            { id: 'kp-fa-monorepo', name: 'Monorepo 架构与工具链', desc: 'Turborepo：任务调度（build/test/lint）、构建缓存（local/remote）、并行执行、增量构建。Nx：计算图（dependency graph）追踪、affected commands 仅构建受影响项目。Lerna：npm/Yarn workspaces 集成、hoisted dependency、publish workflow。Workspace 结构：apps/（主应用）、packages/（共享库）、tools/（CLI 工具）、docs/（文档）。CI 优化：NX Cloud/Turborepo Remote Cache 共享构建产物，CI 时间缩短 70%+。依赖管理：shared tsconfig、eslint-config、prettier-config 统一规范' },
            { id: 'kp-fa-module', name: '模块化与 Feature 架构', desc: 'Feature-based 目录：features/auth/components、features/dashboard/api、features/orders/types。Domain-driven 结构：entities（领域实体）、repositories（数据访问）、services（业务逻辑）、hooks（UI 绑定）。共享模块：@company/shared-ui、@company/utils、@company/types。依赖规则：features 之间禁止直接依赖、通过事件/Context 解耦。Tree shaking：ESM 模块静态分析、sideEffects: false 标记、动态 import。Code Splitting：路由级分割（loadable）、组件级分割（React.lazy）、 vendor 分割（react/react-dom 独立 chunk）' },
            { id: 'kp-fa-build', name: '构建系统优化', desc: 'Vite vs Webpack：Vite（ESM native、Dev 快、Rollup 生产构建）、Webpack（Plugin 生态丰富、HMR 成熟）。持久缓存：cache: { type: "filesystem" }、build cache 共享、CI 复用。Tree Shaking：sideEffects 声明、usedExports: true、minimize 优化。压缩策略：gzip（compression-webpack-plugin）+brotli（better-html-minifier）。Asset 处理：图片压缩（image-minimizer-plugin）、字体子集（unicode-range）、SVG sprite。Source Map：生产环境 hidden-source-map / nosources-source-map 防止源码泄露' },
            { id: 'kp-fa-ssr', name: 'SSR/SSG 与边缘渲染', desc: 'Next.js App Router：Server Components（默认）、Client Components（"use client"）、Streaming SSR。渲染模式：SSG（Static Generation，build 时生成）、SSR（Server-Side Rendering，请求时渲染）、ISR（Incremental Static Regeneration，按需增量更新）。Edge Runtime：Cloudflare Workers/Vercel Edge Functions，低延迟边缘节点渲染。缓存策略：fetch cache、route segment cache、revalidate 标签。数据获取：Server Components 直接访问 DB/Redis、Client Components 通过 SWR/TanStack Query。SEO 优化：metadata API、structured data、og:image' },
            { id: 'kp-fa-microfrontend', name: '微前端架构', desc: 'Module Federation（Webpack 5）：共享 runtime（react/react-dom）、远程模块动态加载、版本协商。qiankun：基于 single-spa，HTML Entry 加载、应用沙箱（样式隔离/CSS变量隔离）、预加载。Micro App 选型：独立构建（模块联邦，需要同技术栈）vs HTTP Entry（qiankun，技术栈无关）。样式隔离：CSS Modules、BEM 命名空间、Shadow DOM。通信：props/事件、共享状态（zustand/pinia）、自定义事件总线。部署模式：独立部署（各应用独立发版）或组合部署（统一入口 + 按需加载子应用）' },
            { id: 'kp-fa-deploy', name: '部署策略与基础设施', desc: 'Dockerfile 多阶段构建：builder（依赖安装/构建） + runner（runtime 最小镜像）。静态部署：S3/Cloudflare R2 + CDN，index.html 入口 + SPA fallback。Serverless 前端：Vercel/Netlify/Cloudflare Pages，边缘节点部署，全球低延迟。Environment：dev/staging/prod 不同配置，Feature Flag 控制发布节奏。CDN：静态资源 Cache-Control: public, max-age=31536000, immutable。Preview URL：PR/MR 自动部署 Preview 环境，测试通过后合并' }
          ],
          resources: [
            { title: 'React 官方文档', url: 'https://react.dev/learn', type: 'doc', source: 'React' },
            { title: 'Turborepo 官方文档', url: 'https://turbo.build/repo/docs', type: 'doc', source: 'Vercel' },
            { title: 'Nx 官方文档', url: 'https://nx.dev/getting-started/intro', type: 'doc', source: 'Nx' },

        { id: 'performance-optimization', name: '前端性能优化', nameEn: 'Frontend Performance', desc: '前端性能直接影响用户体验和业务指标。Core Web Vitals（LCP/CLS/FID/INP）是 Google 定义的体验指标，INP 将取代 FID 成为新的交互响应指标。性能优化涵盖加载性能（网络/缓存）、渲染性能（CPU/布局）和运行时性能（内存/GC）', category: 'frontend',
          steps: ['analyze-code','llm','transform'],
          knowledgePoints: [
            { id: 'kp-fp-cwv', name: 'Core Web Vitals 优化', desc: 'LCP（Largest Contentful Paint）：优化 hero image（预加载、priority、picture format WebP/AVIF）、TTFB（CDN/Edge/SSR）、Render blocking（defer non-critical CSS）。CLS（Cumulative Layout Shift）：图片指定宽高比（aspect-ratio）、字体加载（font-display: optional/swap）、广告位预留（min-height）、动态内容避免在视口上方插入。INP（Interaction to Next Paint）：长任务拆分（requestIdleCallback/Web Worker）、防抖（debounce/throttle）、CSS contain 隔离重排区域、will-change 提示浏览器优化。性能预算：LCP < 2.5s、CLS < 0.1、INP < 200ms' },
            { id: 'kp-fp-loading', name: '加载性能优化', desc: 'Preload/Prefetch：<link rel="preload"> 关键资源、<link rel="prefetch"> 后续导航资源、<link rel="dns-prefetch"> DNS 预解析。Resource Hints：preconnect（建立早起连接）、prerender（预渲染页面）。图片优化：WebP/AVIF（比 JPEG 小 30-50%）、响应式图片（srcset/sizes）、LQP（Low Quality Placeholder）渐进加载。代码分割：React.lazy + Suspense、路由级分割、组件级动态 import。HTTP/2：多路复用、Header Compression、Server Push（已废弃，依赖 preload 替代）。Compression：gzip/brotli（npm run build -- --mode production）' },
            { id: 'kp-fp-rendering', name: '渲染性能与布局优化', desc: '重排重绘：offsetTop/left/width/height 触发重排（保存到变量）、transform/opacity 触发重绘（GPU 加速）。虚拟列表：react-window/react-virtual（只渲染可见区域，10k+ 行无卡顿）、variable size row 支持。RAF（requestAnimationFrame）：动画在浏览器下一帧执行、避免在 RAF 中操作样式。渲染优化：React.memo/useMemo/useCallback 避免不必要的重渲染、React DevTools Profiler 定位。CSS contain：contain: layout/paint/strict 隔离组件渲染影响。RAF Throttle：scroll 事件用 RAF 节流，避免过频触发' },
            { id: 'kp-fp-bundle', name: '包体积与 Tree Shaking', desc: 'Bundle 分析：webpack-bundle-analyzer/rollup-plugin-visualizer、treemap 可视化查看各模块占比。依赖优化：moment → date-fns（tree shake）、lodash → lodash-es（ESM 版本）、axios → ky（更小）。动态 import：路由懒加载、组件按需加载、GraphQL schema 分割。代码删除：Terser（drop console/log/debugger）、DCE（Dead Code Elimination）。Chunk 策略：vendors（框架/库）、common（多页面共享）、runtime（webpack runtime）。构建产物：.map 文件生产环境可省略（sentry/source-map-upload 替代）、使用 .mjs 避免 CJS/ESM 混淆' },
            { id: 'kp-fp-memory', name: '内存管理与泄漏排查', desc: '内存泄漏场景：未清理的 EventListener（addEventListener 需 removeEventListener）、全局变量引用（闭包）、未销毁的 Timer（setInterval 需 clearInterval）、DOM 引用（document.body.appendChild 后需 removeChild）。排查工具：Chrome DevTools Memory 面板（heap snapshot/diff）、Performance monitor 实时监控。WeakRef/WeakMap：缓存对象用 WeakRef 防止内存泄漏、Map vs WeakMap 区别。GC 友好：避免创建大量临时对象（对象池复用）、清理后 delete 引用帮助 GC。Memory Profiler：allocation timeline、retaining tree 分析对象保留链' }
          ],
          resources: [
            { title: 'Core Web Vitals 官方指南', url: 'https://web.dev/vitals/', type: 'tutorial', source: 'Google Web Dev' },
            { title: 'Web Vitals 实验室工具', url: 'https://pagespeed.web.dev/', type: 'tool', source: 'Google' },

        { id: 'component-design', name: '组件设计', nameEn: 'Component Design', desc: '组件设计是前端架构的核心，决定了 UI 复用性、可维护性和开发效率。从基础的 UI 组件到复杂的业务组件，需要掌握 Compound Components、Headless Components、设计系统集成和无障碍访问等模式。本技能覆盖 Vue/React 组件化最佳实践和设计系统建设', category: 'frontend',
          steps: ['llm','transform'],
          knowledgePoints: [
            { id: 'kp-cd-pattern', name: '组件设计模式', desc: 'Compound Components：<Select><Option>...</Option></Select> 共享状态。Render Props：<MouseRender render={(x,y) => <Ball x={x} y={y} />} />。HOC（Higher-Order Components）：withRouter/withTheme，装饰器模式。Hooks 模式：useClickOutside/useDebounce 自定义 Hook 逻辑复用。Slot 模式：Vue slot/slots + React children prop 内容分发。控制反转：props 传递渲染函数而非 JSX，子组件控制父组件渲染' },
            { id: 'kp-cd-headless', name: 'Headless 组件与逻辑分离', desc: 'Headless UI：逻辑与 UI 分离（Radix UI/@headlessui/react），无样式，仅提供行为。Focus Management：useFocusTrap/s	useDescendant 实现对话框/菜单焦点控制。ARIA 属性：role/aria-expanded/aria-controls/aria-selected 正确语义。Popper/Positioning：@floating-ui/react 计算浮动元素位置。Keyboard Navigation：Arrow keys / Home / End / Enter / Escape。Select 实现：Combobox（可搜索下拉），typeahead 支持。Disclosure：<Disclosure>/<Disclosure.Button>/<Disclosure.Panel> 折叠面板' },
            { id: 'kp-cd-design-system', name: '设计系统与 Design Tokens', desc: 'Design Tokens：{ "color.primary": "#3B82F6", "spacing.4": "1rem" } 跨平台变量。Figma Tokens：figma-token json 输出，Style Dictionary 转换。Theme 切换：CSS Variables（推荐）/Context Provider。组件分类：Primitives（Button/Input）/Composite（Form/Dialog）/Pattern（DataTable/CommandBar）。文档工具：Storybook（component playground）、Storybook Addon a11y、TurboSnap。发布管理：semantic versioning、release-it 自动发布' },
            { id: 'kp-cd-a11y', name: '无障碍访问（a11y）', desc: 'ARIA roles：button/link/menu/menuitem/dialog 正确语义。颜色对比：4.5:1（文本）、3:1（大文本）WCAG AA 标准。焦点管理：Tab/Shift+Tab 顺序，modal 打开 trap focus，关闭 restore focus。屏幕阅读器：aria-label/aria-describedby 提供额外信息。键盘操作：所有交互可通过键盘触发，visible focus ring。Skip Links：<a href="#main-content">Skip to main content</a> 跳过导航。测试工具：axe-core/Accessibility Insights 自动化检测' },
            { id: 'kp-cd-composition', name: '组件复合与插槽', desc: 'Vue Scoped Slot：<template #default="{ item }"> 作用域插槽传数据。React Children：children prop 传递任意内容，cloneElement 注入 props。Slot Props：双向数据流，父组件可访问子组件暴露的数据。Transitions：Vue <Transition>/<TransitionGroup>，React CSSTransition/Framer Motion。Error Boundaries：React componentDidCatch 捕获子组件错误，展示降级 UI。Portal：ReactDOM.createPortal 将子节点渲染到父组件外的 DOM' }
          ]
          resources: [
            { title: 'React 组件设计', url: 'https://react.dev/learn', type: 'doc', source: 'React' },
            { title: 'Headless UI 组件', url: 'https://headlessui.com/', type: 'tutorial', source: 'Headless UI' },
            { title: 'Storybook 官方文档', url: 'https://storybook.js.org/docs/', type: 'doc', source: 'Storybook' },
            { title: 'Radix UI 组件库', url: 'https://www.radix-ui.com/', type: 'doc', source: 'Radix' },
            { title: 'Design Tokens 规范', url: 'https://www.smashingmagazine.com/2023/02/design-tokens-beginners-guide/', type: 'tutorial', source: 'Smashing Magazine' },
            { title: '无障碍访问指南', url: 'https://www.w3.org/WAI/WCAG21/quickref/', type: 'tutorial', source: 'W3C' },
          ]
        },
        { id: 'state-management', name: '状态管理', nameEn: 'State Management', desc: '状态管理是前端应用复杂度的核心来源。现代前端应用需要管理：UI 状态（本地组件状态）、服务端状态（API 响应缓存）、全局状态（用户信息/主题）、URL 状态（路由参数）和表单状态。本技能覆盖状态管理库选型、服务端状态管理和复杂流程的状态机实现', category: 'frontend',
          steps: ['llm','transform'],
          knowledgePoints: [
            { id: 'kp-sm-local', name: '本地状态与响应式原理', desc: 'React useState：状态提升 vs 状态下放（Colocation 原则）。React useReducer：复杂状态逻辑，action + reducer 模式。Vue reactive/ref：ref（基本类型）、reactive（对象）、toRefs 解构响应式。Computed：Vue computed 自动追踪依赖缓存变化。Watch：Vue watch/watchEffect 副作用处理，flush 控制时机（pre/sync/post）。Unstate：组件级别的状态管理，不需要全局 Store（svelte/store）。状态 Colocation：状态离使用的地方越近越好，避免不必要的全局状态' },
            { id: 'kp-sm-global', name: '全局状态管理', desc: 'Zustand：轻量级（1KB），create((set) => ({ ... }))，immer middleware 支持。Jotai：Atomic model，atom + useAtom，按需派生状态。Redux Toolkit：标准 Redux，createSlice/createAsyncThunk，RTK Query 替代 Redux Query。Pinia：Vue 3 官方 Store，setup Store vs Options Store。状态结构：按 domain 拆分（authStore/userStore/productStore），避免单一 store 膨胀。持久化：zustand/persist、pinia-plugin-persistedstate 状态持久化到 localStorage' },
            { id: 'kp-sm-server', name: '服务端状态管理', desc: 'TanStack Query：React Query（hooks based），staleTime/cacheTime/backgroundRefetch 配置。SWR：stale-while-revalidate，focus revalidation，dedupe 请求去重。Cache 策略：QueryKey 规范化，invalidation 按 topic，optimistic update 乐观更新。Infinite Query：useInfiniteQuery pagination / cursor 分页加载。Prefetch：queryClient.prefetchQuery 预加载， hydration 复用服务端数据。DevTools：TanStack Query DevTools 查看 cache/loading 状态' },
            { id: 'kp-sm-fsm', name: '状态机与复杂流程编排', desc: 'XState：状态图（State Machine）定义，state + transition + guard + action。Robot：轻量级状态机（5KB），FSM model。适用场景：订单流程（pending/paid/shipped/completed）、Auth 流程（idle/loading/success/error）、Wizard 多步骤表单。Model：context（状态数据）+ assign 更新数据 + guard 条件判断。History State：nested state 记忆，back 返回上次子状态。Visualization：XState Visualizer 在线编辑状态图，生成代码' },
            { id: 'kp-sm-form', name: '表单状态与验证', desc: 'React Hook Form：register + handleSubmit + formState，performance 优于受控组件。Zod + RHF：const schema = z.object({ email: z.string().email() }) + useForm({ resolver: zodResolver(schema) })。Vue Form：vee-validate + yup/zod，ValidationProvider + ValidationObserver。Field Array：dynamic fields（addresses/contacts），useFieldArray。Dirty/Submit：formState.isDirty/isSubmitting 状态检查，防止重复提交。Error Display：inline error / error summary / toast 错误通知' },
            { id: 'kp-sm-url', name: 'URL 状态与路由状态', desc: 'Search Params：URLSearchParams parse.stringify，?tab=active&sort=name 同步。nuqs：Next.js useQueryStates 批量读写 query params。URL State 优点：可分享链接、浏览器前进后退、SEO 支持。Sync 策略：debounce url update（避免频繁 pushState）、parse on mount。Query vs Param：query（filter/sort/pagination） vs param（resource id） 不同语义。History API：replaceState/pushState 无刷新更新 URL' }
          ]
          resources: [
            { title: 'Zustand 官方文档', url: 'https://zustand.docs.pmnd.rs/', type: 'doc', source: 'Zustand' },
            { title: 'Redux Toolkit 文档', url: 'https://redux-toolkit.js.org/', type: 'doc', source: 'Redux' },
            { title: 'TanStack Query', url: 'https://tanstack.com/query/latest', type: 'doc', source: 'TanStack' },

            { title: 'React Hook Form', url: 'https://react-hook-form.com/', type: 'doc', source: 'React Hook Form' },
          ]
        },
        { id: 'testing-strategy', name: '前端测试策略', nameEn: 'Frontend Testing Strategy', desc: '前端测试策略决定质量保障的效率和覆盖面。Testing Trophy（测试奖杯）是 Kent C. Dodds 提出的测试策略模型，强调集成测试的投入产出比最高。本技能覆盖测试分层策略、组件测试、E2E 测试、视觉回归测试和 CI 自动化，是前端质量工程的完整指南', category: 'frontend',
          steps: ['run-tests','llm','transform'],
          knowledgePoints: [
            { id: 'kp-ts-trophy', name: '测试奖杯模型与分层策略', desc: '测试奖杯：Static（类型检查/Lint）→ Unit（单元测试）→ Integration（集成测试）→ E2E（端到端测试）。投入比例（推荐）：Static 20%（TypeScript/ESLint）、Unit 30%（pure functions/hooks）、Integration 40%（组件/模块交互）、E2E 10%（关键路径）。测试优先级：用户可感知的功能 > 内部逻辑 > 边缘情况。测试成本：E2E 慢/贵/Flaky，Unit 快/便宜/隔离。测试速度优化：Vitest（Rust based，比 Jest 快 10x）、Vite 插件化测试。Quality Gates：CI 中必须通过所有测试才能 merge' },
            { id: 'kp-ts-component', name: '组件测试与 Testing Library', desc: 'Testing Library 原则：queryByRole/queryByLabelText 比 testId 更接近用户交互。Query 优先级：getByRole > getByLabelText > getByText > getByTestId。User Interaction：userEvent（模仿真实用户 click/type/hover）而非 fireEvent。Render：render 后 screen.debug() 输出 DOM 结构。Async：findBy*（自动 waitFor）替代 waitFor + expect。Mock：vi.mock() / jest.mock() mock 模块，MSW（Mock Service Worker）mock HTTP。Snapshot：toMatchInlineSnapshot/toMatchSnapshot 保存组件输出快照。Coverage：@ Istanbul/sonarqube，branch/line/function 覆盖' },
            { id: 'kp-ts-visual', name: '视觉回归测试', desc: 'Chromatic：Storybook + Cloud，automated visual review，UI 变更自动通知。Percy：Cypress/Playwright 截图对比，Diff threshold 控制敏感度。Playwright Screenshot：page.screenshot() 全页面/区域截图。Pixelmatch/Resemble.js：像素级图片差异比较。Visual Testing Best Practice：Mock 外部依赖（API/Auth），Seed 数据保证确定性，Viewport 覆盖（375/768/1440）。CI 集成：PR 自动运行，Approve 后合并。Ignore 配置：动画/时间戳/随机内容标记为已知 diff' },
            { id: 'kp-ts-e2e', name: 'E2E 测试与 Playwright', desc: 'Playwright vs Cypress：Playwright（多浏览器/语言/CI 隔离）vs Cypress（简单 API/E2E-first）。Playwright：test.describe/test.it/test.expect + page.goto/click/fill。Locator：page.locator(\'button:has-text("Submit")\') CSS 选择器优先。API Mock：page.route interception 返回固定响应。Login：storageState 复用登录状态，避免每次测试登录。Parallel：test.describe.serial 控制执行顺序，worker 设置并发数。Flaky 治理：retry + screenshot on failure，test.only 调试失败用例。CI 优化：Sharding（--shard=1/4）并行分片，container mode 加速启动' },
            { id: 'kp-ts-msw', name: 'MSW 与 API Mock', desc: 'Mock Service Worker：浏览器层面拦截请求，服务端行为模拟。Setup：beforeAll(() => server.listen()) / afterAll(() => server.close())。Handlers：rest.get(\'/api/users\', () => HttpResponse.json([{ id: 1, name: \"John\" }]))。Error Simulation：HttpResponse.error() 模拟网络错误，status(500) 模拟服务端错误。Delay：ctx.delay(1000) 测试 loading 状态。Pagination：ctx.paginate() 模拟分页数据。Coverage：intercept 记录被测 API 覆盖情况。CI 环境：MSW 在 Node 环境（Node integration）用于 Vitest/Jest 测试' },
            { id: 'kp-ts-ct', name: '组件测试与 Storybook 集成', desc: 'Storybook：组件 playground，独立环境测试组件的各种 state。Stories：storiesOf(\'Button\') + storiesOf(\'Button/Danger\') 层级组织。CSF 3.0：export default { component } + export const Primary = { args: { variant: \"primary\" } }。Addons：@storybook/addon-controls（args UI）、@storybook/addon-a11y（无障碍检测）、@storybook/addon-interactions（用户交互）。Stories Testing：@storybook/test runner，Stories 作为测试用例。Test Runner：chromatic test-runner 自动运行 Stories。Snapshot：storyShot 导出Stories 快照与上一版本对比' }
          ],
          resources: [
            { title: 'Testing Trophy（测试奖杯）', url: 'https://kentcdodds.com/blog/the-testing-trophy', type: 'tutorial', source: 'Kent C. Dodds' },

            { id: 'kp-cna-12factor', name: '12-Factor App 原则', desc: '基准代码（Codebase）、依赖（Dependencies）、配置（Config）、后端服务（Backing Services）、构建/发布/运行（Build/Release/Run）、进程（Processes）、端口绑定（Port Binding）、并发（Concurrency）、易处置（Disposability）、开发/生产一致（Dev/Prod Parity）、日志（Logs）、管理进程（Admin Processes）。12-Factor 是 SaaS 应用开发的方法论，适合云原生应用设计' },
            { id: 'kp-cna-servicemesh', name: 'Service Mesh 服务网格', desc: 'Istio：Envoy 代理 + control plane（Mixer/Pilot/Galley），mTLS 自动加密、流量管理（VirtualService/DestinationRule）、金丝雀发布。Linkerd：轻量级（Rust 实现），Rust Sidecar-less architecture，更简单但功能较少。流量管理：Traffic Split（金丝雀/蓝绿）、Mirror（影子流量测试）、Fault Injection（混沌测试）。可观测性：Automatic metrics/traces/logs，Kiali Dashboard 可视化服务拓扑' },

            { id: 'kp-cna-multitenant', name: '多租户 SaaS 架构', desc: '共享数据库隔离：tenant_id 行级隔离、Schema 分离（PostgreSQL Schema），租户数据查询过滤。独立数据库：每个租户独立数据库实例，数据隔离最强但成本高。混合策略：高频租户独立库、中频共享 Schema、低频共享数据库。隔离级别：Database/Schema/Row 三个层次，Security vs Cost 权衡。白标/品牌定制：运行时配置主题/CSS/logo，数据库存储租户品牌配置' },
            { id: 'kp-cna-cncf', name: 'CNCF 云原生全景', desc: '云原生技术生态：Kubernetes（容器编排）、Prometheus（监控）、Envoy（服务代理）、OpenTelemetry（可观测性）、Helm（包管理）、Argo（GitOps）、Jaeger（追踪）。成熟度模型：Container（成熟）、Orchestration（成熟）、Microservice（成熟）、Service Mesh（主流）、Serverless（早期）、Security（主流）。技术选型原则：成熟项目用成熟技术（Kubernetes/Docker），新技术用 POC 验证。技术雷达：ThoughtWorks Technology Radar 参考' },

    function showToast(msg) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; c.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'all 0.2s ease'; setTimeout(() => t.remove(), 200); }, 2000);
    }

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

    // Cache for fast lookups - rebuilt when data changes
    const roleMap = new Map(PROJECT.roles.map(r => [r.id, r]));
    const skillMap = new Map(PROJECT.skills.map(s => [s.id, s]));
    const atomicMap = new Map(PROJECT.atomics.map(a => [a.id, a]));
    let myRoleMap = new Map();
    function buildMyRoleMap() { myRoleMap = new Map(data.myRoles.map(r => [r.roleId, r])); }
    buildMyRoleMap();

    function getRoleById(id) { return roleMap.get(id); }
    function getSkillById(id) { return skillMap.get(id); }
    function getAtomicById(id) { return atomicMap.get(id); }
    function findMyRole(roleId) { return myRoleMap && myRoleMap.get(roleId); }
    function findMySkill(myRole, skillId) { return (myRole.skills || []).find(s => s.skillId === skillId); }

    // Level dots
    function levelDots(level) {
      if (!level || level < 1) return '';
      return `<span class="tree-item-dots">${[1,2,3,4,5].map(i => `<span class="tree-item-dot ${i <= level ? 'f'+level : ''}"></span>`).join('')}</span>`;
    }

    function renderLevelOptions(current, onClick) {
      return `<div class="progress-rating">${LEVELS.map(l => `
        <div class="progress-option ${current === l.level ? 'selected' : ''}" data-level="${l.level}" onclick="${onClick}(${l.level})">
          <div class="progress-dots">${[1,2,3,4,5].map(i => `<div class="progress-dot ${i <= l.level ? 'filled' : ''}"></div>`).join('')}</div>
          <span class="progress-label">${l.label}</span>
        </div>`).join('')}</div>`;
    }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }

    function renderTagSelector(currentTag, updateFn) {
      return `<div class="tag-selector">
        <div class="tag-option ${currentTag === '入门' ? 'selected beginner' : ''}" onclick="${updateFn}('入门')"><span>🌱</span> 入门</div>
        <div class="tag-option ${currentTag === '加强' ? 'selected advanced' : ''}" onclick="${updateFn}('加强')"><span>💪</span> 加强</div>
      </div>`;
    }

    // Category display names and sort order
    const SKILL_CATEGORY_NAMES = {
      'sre-core': 'SRE 核心',
      'observability': '可观测性',
      'incident': '故障响应',
      'platform': '平台工程',
      'security': '安全',
      'operations': '运维',
      'devops': 'DevOps',
      'cloud': '云平台',
      'architecture': '架构',
      'backend': '后端开发',
      'frontend': '前端开发',
      'qa': '测试',
      'product': '产品',
      'cloud-security': '云安全',
      'development': '开发',
      'network': '网络',
      'filesystem': '文件系统',
      'database': '数据库',
      'data': '数据',
      'container': '容器',
      'validation': '验证',
      'system': '系统',
      'testing': '测试',
      'reliability': '可靠性'
    };
    const CATEGORY_ORDER = ['sre-core','observability','incident','platform','security','operations','devops','cloud','architecture','backend','frontend','qa','product','cloud-security','development','network','filesystem','database','data','container','validation','system','testing','reliability','custom','other'];

    // Render skills grouped by category
    function renderSkillsByCategory(skillIds, myRole, type) {
      const groups = {};
      skillIds.forEach(sid => {
        const ps = getSkillById(sid);
        const cat = ps ? (ps.category || 'other') : 'custom';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push({ id: sid, skill: ps, type });
      });

      const sortedCats = Object.keys(groups).sort((a, b) => {
        const ai = CATEGORY_ORDER.indexOf(a);
        const bi = CATEGORY_ORDER.indexOf(b);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });

      let html = '';
      sortedCats.forEach(cat => {
        const catName = SKILL_CATEGORY_NAMES[cat] || cat;
        const items = groups[cat];
        html += `<div style="margin-bottom:0.75rem">
          <div style="font-size:0.65rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:0.3rem;padding-bottom:0.2rem;border-bottom:1px solid var(--border)">${catName} (${items.length})</div>
          <div class="children-list">`;
        items.forEach(item => {
          const mySk = myRole ? findMySkill(myRole, item.id) : null;
          const skName = item.skill ? item.skill.name : item.id;
          const kpCount = item.skill && item.skill.knowledgePoints ? item.skill.knowledgePoints.length : 0;
          const clickFn = mySk ? `selectMySkill('${myRole.roleId}','${item.id}')` : (item.skill ? `selectProjectSkill('${item.id}')` : '');
          html += `<div class="child-item ${mySk ? 'associated' : 'unassociated'}" onclick="${clickFn}">
            <span class="tree-item-icon skill">技</span>
            <span class="child-name">${esc(skName)}</span>
            ${mySk ? `${levelDots(mySk.level)}<span class="child-meta">${LEVELS[(mySk.level||1)-1].label}</span>` : ''}
            ${item.skill && kpCount > 0 ? `<span class="child-meta">${kpCount} 知识点</span>` : ''}
            ${mySk ? '<span class="tree-item-tag custom">已关联</span>' : (myRole && item.skill ? `<button class="btn btn-sm" onclick="event.stopPropagation();associateSkill('${myRole.roleId}','${item.id}')">+ 关联</button>` : '')}
          </div>`;
        });
        html += `</div></div>`;
      });
      return html;
    }

    // Render atomic skills grouped by category
    function renderAtomicSkillsByCategory(atomicIds, myRole) {
      const groups = {};
      atomicIds.forEach(aid => {
        const pa = getAtomicById(aid);
        const cat = pa ? (pa.category || 'other') : 'custom';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push({ id: aid, atomic: pa });
      });

      const sortedCats = Object.keys(groups).sort((a, b) => {
        const ai = CATEGORY_ORDER.indexOf(a);
        const bi = CATEGORY_ORDER.indexOf(b);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });

      let html = '';
      sortedCats.forEach(cat => {
        const catName = SKILL_CATEGORY_NAMES[cat] || cat;
        const items = groups[cat];
        html += `<div style="margin-bottom:0.75rem">
          <div style="font-size:0.65rem;font-weight:600;color:var(--success);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:0.3rem;padding-bottom:0.2rem;border-bottom:1px solid var(--border)">${catName} (${items.length})</div>
          <div class="children-list">`;
        items.forEach(item => {
          const mySk = myRole ? findMySkill(myRole, item.id) : null;
          const aName = item.atomic ? item.atomic.name : item.id;
          const clickFn = mySk ? `selectMySkill('${myRole.roleId}','${item.id}')` : (item.atomic ? `selectProjectAtomic('${item.id}')` : '');
          html += `<div class="child-item ${mySk ? 'associated' : 'unassociated'}" onclick="${clickFn}">
            <span class="tree-item-icon atomic">原</span>
            <span class="child-name">${esc(aName)}</span>
            ${mySk ? `${levelDots(mySk.level)}<span class="child-meta">${LEVELS[(mySk.level||1)-1].label}</span>` : ''}
            ${mySk ? '<span class="tree-item-tag custom">已关联</span>' : (myRole && item.atomic ? `<button class="btn btn-sm" onclick="event.stopPropagation();associateSkill('${myRole.roleId}','${item.id}')">+ 关联</button>` : '')}
          </div>`;
        });
        html += `</div></div>`;
      });
      return html;
    }

    function renderNotesSection(notes, targetType, roleId, skillId, kpId) {
      const p = targetType === 'role' ? `'${roleId}','',''` :
                targetType === 'skill' ? `'${roleId}','${skillId}',''` :
                `'${roleId}','${skillId}','${kpId}'`;
      let html = `<div class="notes-list">`;
      (notes || []).forEach(n => {
        html += `<div class="note-item" id="note-${n.id}">
          <div class="note-item-content">${esc(n.content)}</div>
          <div class="note-item-meta">
            <span>创建: ${formatTime(n.createdAt)}</span>
            ${n.updatedAt && n.updatedAt !== n.createdAt ? `<span>修改: ${formatTime(n.updatedAt)}</span>` : ''}
          </div>
          <div class="note-item-actions">
            <button class="btn btn-sm" onclick="startEditNote('${targetType}',${p},'${n.id}')">✎ 编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deleteNote('${targetType}',${p},'${n.id}')">删除</button>
          </div>
        </div>`;
      });
      html += `<div class="note-add-row">
        <textarea id="new-note-${targetType}" placeholder="添加新备注..."></textarea>
        <button class="btn btn-primary btn-sm" style="white-space:nowrap" onclick="addNote('${targetType}',${p})">添加备注</button>
      </div></div>`;
      return html;
    }

    function getNotesTarget(type, roleId, skillId, kpId) {
      if (type === 'role') return findMyRole(roleId);
      if (type === 'skill') {
        const r = findMyRole(roleId);
        return r ? (r.skills||[]).find(s => s.skillId === skillId) : null;
      }
      if (type === 'kp') {
        const r = findMyRole(roleId);
        if (!r) return null;
        const sk = (r.skills||[]).find(s => s.skillId === skillId);
        return sk ? (sk.knowledgePoints||[]).find(k => k.kpId === kpId) : null;
      }
      return null;
    }

    function addNote(type, roleId, skillId, kpId) {
      const input = document.getElementById('new-note-' + type);
      if (!input || !input.value.trim()) { showToast('请输入备注内容'); return; }
      const target = getNotesTarget(type, roleId, skillId, kpId);
      if (!target) return;
      if (!target.notes) target.notes = [];
      const now = new Date().toISOString();
      target.notes.push({ id: genId(), content: input.value.trim(), createdAt: now, updatedAt: now });
      saveData(); render();
      showToast('备注已添加');
    }

    function deleteNote(type, roleId, skillId, kpId, noteId) {
      if (!confirm('确定删除该备注？')) return;
      const target = getNotesTarget(type, roleId, skillId, kpId);
      if (!target) return;
      target.notes = (target.notes||[]).filter(n => n.id !== noteId);
      saveData(); render();
      showToast('备注已删除');
    }

    function startEditNote(type, roleId, skillId, kpId, noteId) {
      const target = getNotesTarget(type, roleId, skillId, kpId);
      if (!target) return;
      const note = (target.notes||[]).find(n => n.id === noteId);
      if (!note) return;
      const el = document.getElementById('note-' + noteId);
      if (!el) return;
      const p = type === 'role' ? `'${roleId}','',''` :
                type === 'skill' ? `'${roleId}','${skillId}',''` :
                `'${roleId}','${skillId}','${kpId}'`;
      el.innerHTML = `
        <textarea class="note-textarea" id="edit-note-${noteId}" style="min-height:60px">${esc(note.content)}</textarea>
        <div class="note-item-actions" style="margin-top:0.5rem">
          <button class="btn btn-primary btn-sm" onclick="saveEditNote('${type}',${p},'${noteId}')">保存</button>
          <button class="btn btn-sm" onclick="render()">取消</button>
        </div>`;
      document.getElementById('edit-note-' + noteId).focus();
    }

    function saveEditNote(type, roleId, skillId, kpId, noteId) {
      const input = document.getElementById('edit-note-' + noteId);
      if (!input || !input.value.trim()) { showToast('备注不能为空'); return; }
      const target = getNotesTarget(type, roleId, skillId, kpId);
      if (!target) return;
      const note = (target.notes||[]).find(n => n.id === noteId);
      if (!note) return;
      note.content = input.value.trim();
      note.updatedAt = new Date().toISOString();
      saveData(); render();
      showToast('备注已更新');
    }

    function updateMyRoleTag(tag) {
      const myRole = findMyRole(selectedPath.roleId);
      if (myRole) { myRole.tag = myRole.tag === tag ? '' : tag; saveData(); render(); }
    }
    function updateMySkillTag(tag) {
      const myRole = findMyRole(selectedPath.roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);
      if (sk) { sk.tag = sk.tag === tag ? '' : tag; saveData(); render(); }
    }
    function updateMyKpTag(tag) {
      const myRole = findMyRole(selectedPath.roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);
      if (!sk) return;
      const kp = (sk.knowledgePoints||[]).find(k => k.kpId === selectedPath.kpId);
      if (kp) { kp.tag = kp.tag === tag ? '' : tag; saveData(); render(); }
    }

    // ===== RENDER =====
    function render() {
      renderColRoles();
      renderColSkills();
      renderColDetail();
    }

    // Column 1: 岗位列表
    function renderColRoles() {
      const body = document.getElementById('col-roles-body');
      document.getElementById('role-count').textContent = data.myRoles.length;

      let html = '';

      // Section: 我的岗位
      html += `<div class="col-section-header">我的岗位 (${data.myRoles.length})</div>`;
      data.myRoles.forEach(myRole => {
        const pr = getRoleById(myRole.roleId);
        const name = pr ? pr.name : (myRole.customName || myRole.roleId);
        const isActive = selectedPath && selectedPath.type === 'myRole' && selectedPath.roleId === myRole.roleId;
        const skCnt = (myRole.skills||[]).length;

        html += `<div class="role-item ${isActive ? 'active' : ''}" onclick="selectMyRole('${myRole.roleId}')">
          <span class="role-item-icon role">岗</span>
          <span class="role-item-name">${esc(name)}</span>
          <span class="role-item-meta">${skCnt}</span>
        </div>`;
      });

      // Section: 项目岗位库
      html += `<div class="col-section-header" style="margin-top:1rem">项目岗位库 (${PROJECT.roles.length})</div>`;
      PROJECT.roles.forEach(pr => {
        const associated = !!findMyRole(pr.id);
        const isActive = selectedPath && selectedPath.type === 'projectRole' && selectedPath.roleId === pr.id;
        html += `<div class="role-item ${isActive ? 'active' : ''} ${associated ? 'associated' : ''}" onclick="selectProjectRole('${pr.id}')">
          <span class="role-item-icon role">岗</span>
          <span class="role-item-name">${esc(pr.name)}</span>
          <span class="role-item-meta">${associated ? '已关联' : pr.mainSkills.length + '技'}</span>
        </div>`;
      });

      html += `<button class="add-btn" onclick="showCatalog('role')">+ 添加岗位</button>`;
      body.innerHTML = html;
    }

    // Column 2: 技能列表
    function renderColSkills() {
      const body = document.getElementById('col-skills-body');
      const title = document.getElementById('col-skills-title');

      // Case 1: Show knowledge points for a selected skill
      if (selectedPath && (selectedPath.type === 'skillDetail' || selectedPath.type === 'kpDetail')) {
        const roleId = selectedPath.roleId;
        const skillId = selectedPath.type === 'kpDetail' ? selectedPath.skillId : selectedPath.skillId;
        const ps = getSkillById(skillId);
        const pa = getAtomicById(skillId);
        const skName = ps ? ps.name : (pa ? pa.name : skillId);

        title.textContent = skName;

        // Show back button and knowledge points
        let html = `<button class="back-btn" onclick="selectMyRole('${roleId}')">← 返回岗位</button>`;
        html += `<div class="col-section-header">知识点 (${(ps && ps.knowledgePoints) ? ps.knowledgePoints.length : 0})</div>`;

        const kps = (ps && ps.knowledgePoints) || [];
        kps.forEach(kp => {
          html += `<div class="kp-item" onclick="selectKpDetail('${roleId}','${skillId}','${kp.id}')">
            <span class="kp-item-icon">知</span>
            <span class="kp-item-name">${esc(kp.name || kp.id)}</span>
          </div>`;
        });

        if (kps.length === 0) {
          html += '<div style="padding:1rem;color:var(--text-muted);font-size:0.78rem">无知识点</div>';
        }

        body.innerHTML = html;
        return;
      }

      // Case 2: No selection or person type
      if (!selectedPath || selectedPath.type === 'person' || selectedPath.type === 'projectAtomic') {
        title.textContent = '选择岗位';
        document.getElementById('skill-count').textContent = '0';
        body.innerHTML = '<div style="padding:1rem;color:var(--text-muted);font-size:0.78rem;text-align:center">请先选择左侧岗位</div>';
        return;
      }

      let skills = [];

      if (selectedPath.type === 'myRole' || selectedPath.type === 'projectRole') {
        const pr = getRoleById(selectedPath.roleId);
        title.textContent = pr ? pr.name : selectedPath.roleId;
        skills = pr ? pr.mainSkills : [];
      } else if (selectedPath.type === 'mySkill') {
        const pr = getRoleById(selectedPath.roleId);
        title.textContent = pr ? pr.name : selectedPath.roleId;
        skills = pr ? pr.mainSkills : [];
      } else {
        title.textContent = '技能列表';
        skills = [];
      }

      document.getElementById('skill-count').textContent = skills.length;

      if (skills.length === 0) {
        body.innerHTML = '';
        return;
      }

      // Group by category
      const groups = {};
      skills.forEach(sid => {
        const ps = getSkillById(sid);
        const cat = ps ? (ps.category || 'other') : 'custom';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push({ id: sid, skill: ps });
      });

      const sortedCats = Object.keys(groups).sort((a, b) => {
        const ai = CATEGORY_ORDER.indexOf(a);
        const bi = CATEGORY_ORDER.indexOf(b);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });

      let html = '';
      sortedCats.forEach(cat => {
        const catName = SKILL_CATEGORY_NAMES[cat] || cat;
        const items = groups[cat];
        html += `<div class="skill-cat">
          <div class="skill-cat-header">${catName} (${items.length})</div>
          <div class="skill-cat-items">`;
        items.forEach(item => {
          html += `<div class="skill-item" onclick="selectSkillDetail('${selectedPath.roleId}','${item.id}')">
            <span class="skill-item-icon skill">技</span>
            <span class="skill-item-name">${esc(item.skill ? item.skill.name : item.id)}</span>
          </div>`;
        });
        html += `</div></div>`;
      });

      body.innerHTML = html;
    }

    // Column 3: 详情展示
    function renderColDetail() {
      const el = document.getElementById('col-detail');

      // Empty state
      if (!selectedPath || selectedPath.type === 'person') {
        el.innerHTML = `<div class="detail-empty">
          <div class="detail-empty-icon">🌲</div>
          <div class="detail-empty-text">选择一个岗位开始探索技能体系</div>
        </div>`;
        return;
      }

      // Role overview (myRole or projectRole)
      if (selectedPath.type === 'myRole' || selectedPath.type === 'projectRole') {
        return selectedPath.type === 'myRole' ? renderMyRoleDetail(el) : renderProjectRoleDetail(el);
      }

      // Skill detail: show overview with knowledge points list
      if (selectedPath.type === 'skillDetail') {
        return renderSkillDetail(el);
      }

      // KP detail: show knowledge point details
      if (selectedPath.type === 'kpDetail') {
        return renderKpDetail(el);
      }

      // My skill (user's associated skill)
      if (selectedPath.type === 'mySkill') return renderMySkillDetail(el);
      if (selectedPath.type === 'myKp') return renderMyKpDetail(el);
      if (selectedPath.type === 'projectSkill') return renderProjectSkillDetail(el);
      if (selectedPath.type === 'projectAtomic') return renderProjectAtomicDetail(el);
    }

    
    // ===== MAIN CONTENT (used by detail renderers) =====

    // ===== MY ROLE DETAIL =====
    function renderMyRoleDetail(el) {
      const myRole = findMyRole(selectedPath.roleId);
      if (!myRole) { selectedPath = { type: 'person' }; render(); return; }
      const pr = getRoleById(myRole.roleId);
      const name = pr ? pr.name : (myRole.customName || myRole.roleId);

      el.innerHTML = `
        <div class="content-header">
          <div>
            <div class="breadcrumb"><a onclick="selectPerson()">${esc(data.person.name)}</a><span class="breadcrumb-sep">/</span><span>岗位</span></div>
            <div class="content-title"><span class="tree-item-icon role" style="width:22px;height:22px;font-size:0.65rem">岗</span> ${esc(name)}</div>
          </div>
          <div style="display:flex;gap:0.4rem">
            ${pr ? '' : `<button class="btn btn-sm" onclick="editCustomRole('${myRole.roleId}')">编辑</button>`}
            <button class="btn btn-danger btn-sm" onclick="removeMyRole('${myRole.roleId}')">取消关联</button>
          </div>
        </div>
        <div class="content-body">
          ${pr ? `<div class="project-banner"><span class="tag">项目</span> ${esc(pr.nameEn)} · ${esc(pr.desc)}</div>` : ''}

          <div class="detail-grid">
            <div class="detail-card full">
              <div class="detail-label">我的进展评估</div>
              ${renderLevelOptions(myRole.level, 'updateMyRoleLevel')}
            </div>
            <div class="detail-card full">
              <div class="detail-label">标签</div>
              ${renderTagSelector(myRole.tag || '', 'updateMyRoleTag')}
            </div>
            ${myRole.tag ? `
            <div class="detail-card full">
              <div class="detail-label">备注 (${(myRole.notes||[]).length})</div>
              ${renderNotesSection(myRole.notes, 'role', myRole.roleId)}
            </div>` : ''}

            ${pr ? `
            <div class="detail-card full">
              <div class="detail-label">岗位技能体系</div>
              ${renderSkillsByCategory(pr.mainSkills, myRole, 'skill')}
              <div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--border);">
                <div style="margin-bottom:0.5rem;font-size:0.72rem;color:var(--text-secondary)">原子技能 (${pr.atomicSkills.length})</div>
                ${renderAtomicSkillsByCategory(pr.atomicSkills, myRole)}
              </div>
            </div>
            ` : ''}

            <div class="detail-card full">
              <div class="detail-label" style="margin-bottom:0.5rem">已关联的技能 (${(myRole.skills||[]).length})</div>
              <div class="children-list">
                ${(myRole.skills||[]).map(sk => {
                  const ps = getSkillById(sk.skillId);

    function selectProjectSkill(skillId) { selectedPath = { type: 'projectSkill', skillId }; render(); }
    function selectProjectAtomic(atomicId) { selectedPath = { type: 'projectAtomic', atomicId }; render(); }
    function selectSkillDetail(roleId, skillId) { selectedPath = { type: 'skillDetail', roleId, skillId }; render(); }
    function selectKpDetail(roleId, skillId, kpId) { selectedPath = { type: 'kpDetail', roleId, skillId, kpId }; render(); }

    function toggleSection(header) {
      header.classList.toggle('collapsed');
      header.nextElementSibling.classList.toggle('collapsed');

    // ===== ASSOCIATION =====
    function associateRole(roleId) {
      if (findMyRole(roleId)) { showToast('已关联'); return; }
      const pr = getRoleById(roleId);
      const myRole = { roleId, level: 0, note: '', tag: '', notes: [], skills: [] };

      // Auto-associate all skills from project role + knowledge points
      if (pr) {
        pr.mainSkills.forEach(sid => {
          const ps = getSkillById(sid);
          const kps = (ps && ps.knowledgePoints) ? ps.knowledgePoints.map(kp => ({
            kpId: kp.id, name: kp.name, level: 0, note: '', tag: '', notes: []
          })) : [];
          myRole.skills.push({ skillId: sid, name: '', level: 0, note: '', tag: '', notes: [], knowledgePoints: kps });
        });
        pr.atomicSkills.forEach(aid => {
          if (!myRole.skills.find(s => s.skillId === aid)) {
            myRole.skills.push({ skillId: aid, name: '', level: 0, note: '', tag: '', notes: [], knowledgePoints: [] });
          }
        });
      }

      data.myRoles.push(myRole);
      saveData();
      selectedPath = { type: 'myRole', roleId };
      render();
      showToast(`已关联岗位: ${pr ? pr.name : roleId}`);
    }

    function removeMyRole(roleId) {
      const pr = getRoleById(roleId);
      if (!confirm(`确定取消关联岗位「${pr ? pr.name : roleId}」及其所有技能？`)) return;
      data.myRoles = data.myRoles.filter(r => r.roleId !== roleId);
      saveData();
      selectedPath = { type: 'person' };
      render();
      showToast('已取消关联');
    }

    function associateSkill(roleId, skillId) {
      const myRole = findMyRole(roleId);
      if (!myRole) return;
      if (findMySkill(myRole, skillId)) { showToast('已关联'); return; }
      if (!myRole.skills) myRole.skills = [];
      myRole.skills.push({ skillId, name: '', level: 0, note: '', tag: '', notes: [], knowledgePoints: [] });
      saveData();
      selectedPath = { type: 'mySkill', roleId, skillId };
      render();
      const ps = getSkillById(skillId);
      const pa = getAtomicById(skillId);
      showToast(`已关联: ${ps ? ps.name : (pa ? pa.name : skillId)}`);
    }

    function removeMySkill(roleId, skillId) {
      const myRole = findMyRole(roleId);
      if (!myRole) return;
      myRole.skills = (myRole.skills||[]).filter(s => s.skillId !== skillId);
      saveData();
      selectedPath = { type: 'myRole', roleId };
      render();
      showToast('已移除技能');
    }

    function updateMySkillLevel(level) {

    }
    function updateMySkillNote(note) {
      const myRole = findMyRole(selectedPath.roleId);

      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);
      if (sk) { sk.note = note; saveData(); }

    function updateMyKpLevel(level) {
      const myRole = findMyRole(selectedPath.roleId);

      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);
      if (!sk) return;
      const kp = (sk.knowledgePoints||[]).find(k => k.kpId === selectedPath.kpId);

    function updateMyKpNote(note) {
      const myRole = findMyRole(selectedPath.roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);

    // ===== KNOWLEDGE POINTS =====
    function addMyKp(roleId, skillId) {
      showModal('添加知识点', { name: '', note: '', level: 0 }, (formData) => {
        if (!formData.name.trim()) { showToast('请输入名称'); return false; }
        const myRole = findMyRole(roleId);
        if (!myRole) return false;
        const sk = (myRole.skills||[]).find(s => s.skillId === skillId);
        if (!sk) return false;
        if (!sk.knowledgePoints) sk.knowledgePoints = [];
        sk.knowledgePoints.push({ kpId: genId(), name: formData.name.trim(), note: formData.note, level: formData.level, tag: '', notes: [] });
        saveData();
        selectedPath = { type: 'mySkill', roleId, skillId };
        render();
        return true;
      });
    }

    function editMyKp(roleId, skillId, kpId) {
      const myRole = findMyRole(roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === skillId);
      if (!sk) return;
      const kp = (sk.knowledgePoints||[]).find(k => k.kpId === kpId);
      if (!kp) return;
      showModal('编辑知识点', { name: kp.name || '', note: kp.note || '', level: kp.level || 0 }, (formData) => {
        if (!formData.name.trim()) { showToast('请输入名称'); return false; }
        kp.name = formData.name.trim();
        kp.note = formData.note;
        kp.level = formData.level;
        saveData();
        render();
        return true;
      });
    }

    function removeMyKp(roleId, skillId, kpId) {
      if (!confirm('确定删除该知识点？')) return;
      const myRole = findMyRole(roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === skillId);
      if (!sk) return;
      sk.knowledgePoints = (sk.knowledgePoints||[]).filter(k => k.kpId !== kpId);
      saveData();
      selectedPath = { type: 'mySkill', roleId, skillId };
      render();
      showToast('已删除知识点');

    // ===== MODAL =====
    function showModal(title, defaults, onSubmit) {

      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <div class="modal-title">${title}</div>
        <div class="modal-field">
          <label>名称</label>
          <input type="text" id="modal-name" value="${esc(defaults.name)}" placeholder="输入名称..." autofocus>
        </div>
        <div class="modal-field">
          <label>备注</label>
          <textarea id="modal-note" placeholder="添加备注...">${esc(defaults.note||'')}</textarea>
        </div>
        <div style="margin-bottom:1rem">
          <div class="detail-label">进展评估</div>
          <div class="progress-rating" id="modal-level">
            ${LEVELS.map(l => `
              <div class="progress-option ${defaults.level === l.level ? 'selected' : ''}" data-level="${l.level}" onclick="selectModalLevel(${l.level})">
                <div class="progress-dots">${[1,2,3,4,5].map(i => `<div class="progress-dot ${i <= l.level ? 'filled' : ''}"></div>`).join('')}</div>
                <span class="progress-label">${l.label}</span>
              </div>`).join('')}
          </div>
        </div>

          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" id="modal-submit">确定</button>
        </div>`;

      document.getElementById('modal-submit').onclick = () => {
        const name = document.getElementById('modal-name').value;
        const note = document.getElementById('modal-note').value;
        const selEl = document.querySelector('#modal-level .progress-option.selected');
        const level = selEl ? parseInt(selEl.dataset.level) : 0;
        onSubmit({ name, note, level });
      };
      document.getElementById('modal-name').focus();
      document.getElementById('modal-name').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById('modal-submit').click(); }
