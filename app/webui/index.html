<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills4Coder - 能力树</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f7f8fa;
      --bg-muted: #f1f3f5;
      --bg-hover: #eaecef;
      --border: #e5e7eb;
      --border-hover: #d1d5db;
      --text: #1a1a2e;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-light: #eff6ff;
      --accent-hover: #2563eb;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --magenta: #8b5cf6;
      --magenta-light: #f5f3ff;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --orange: #f97316;
      --orange-light: #fff7ed;
      --rose: #f43f5e;
      --rose-light: #fff1f2;
      --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --col1-width: 260px;
      --col2-width: 280px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* App Layout - Three Column */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-subtle);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 10;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar-logo-icon {
      width: 28px; height: 28px;
      background: var(--text);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
    }

    .sidebar-logo-text { font-size: 0.9rem; font-weight: 600; letter-spacing: -0.02em; }

    .sidebar-actions { display: flex; gap: 0.2rem; }

    .icon-btn {
      width: 26px; height: 26px;
      border: none; border-radius: 5px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }
    .icon-btn:hover { background: var(--bg-muted); color: var(--text); }

    /* Person Card */
    .person-card {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .person-card:hover { background: var(--bg-muted); }
    .person-card.active { background: var(--accent-light); }
    .person-name {
      font-size: 0.82rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.35rem;
    }
    .person-badge {
      font-size: 0.55rem; padding: 0.08rem 0.3rem;
      border-radius: 3px; font-weight: 600;
    }
    .person-badge.magenta { background: var(--magenta-light); color: var(--magenta); }
    .person-badge.blue { background: var(--accent-light); color: var(--accent); }
    .person-badge.green { background: var(--success-light); color: var(--success); }
    .person-meta { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.15rem; }

    /* Tree */
    .sidebar-tree {
      flex: 1; overflow-y: auto; padding: 0.35rem 0;
    }

    .skill-builder-section {
      border-top: 1px solid var(--border);
      padding: 0.75rem;
      background: var(--bg-subtle);
    }
    .skill-builder-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .skill-builder-title {
      font-size: 0.7rem; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .skill-builder-list {
      max-height: 200px; overflow-y: auto;
    }
    .skill-builder-list::-webkit-scrollbar { width: 4px; }
    .skill-builder-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Skill Builder Modal */
    .skill-builder-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 100;
      align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .skill-builder-modal.show { display: flex; }
    .skill-builder-panel {
      background: var(--bg); border-radius: 12px;
      width: 90%; max-width: 700px; max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .skill-builder-panel-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .skill-builder-panel-title { font-size: 1rem; font-weight: 600; }
    .skill-builder-panel-close {
      width: 28px; height: 28px; border: none;
      background: var(--bg-muted); border-radius: 6px;
      cursor: pointer; font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
    }
    .skill-builder-panel-close:hover { background: var(--border-hover); }
    .skill-builder-panel-body {
      flex: 1; overflow-y: auto; padding: 1.25rem;
    }
    .skill-builder-panel-body::-webkit-scrollbar { width: 6px; }
    .skill-builder-panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .skill-builder-panel-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 0.5rem;
    }

    .sb-field { margin-bottom: 1rem; }
    .sb-field label {
      display: block; font-size: 0.7rem; font-weight: 600;
      color: var(--text-secondary); margin-bottom: 0.35rem;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .sb-field input[type="text"] {
      width: 100%; padding: 0.6rem 0.75rem;
      border: 1px solid var(--border); border-radius: 7px;
      font-size: 0.85rem; background: var(--bg);
    }
    .sb-field input[type="text"]:focus {
      outline: none; border-color: var(--accent);
    }
    .sb-field input[type="text"].sb-name-input {
      font-size: 1.1rem; font-weight: 600;
      padding: 0.75rem 1rem;
    }
    .sb-field textarea {
      width: 100%; padding: 0.6rem 0.75rem;
      border: 1px solid var(--border); border-radius: 7px;
      font-size: 0.8rem; font-family: var(--font-mono);
      resize: vertical; min-height: 60px; background: var(--bg);
    }
    .sb-field textarea:focus { outline: none; border-color: var(--accent); }
    .sb-section-title {
      font-size: 0.75rem; font-weight: 600;
      color: var(--text); margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .sb-section-title::before {
      content: ''; width: 3px; height: 12px;
      background: var(--accent); border-radius: 2px;
    }

    /* Tags input */
    .sb-tags-input {
      display: flex; flex-wrap: wrap; gap: 0.3rem;
      padding: 0.4rem; border: 1px solid var(--border);
      border-radius: 7px; background: var(--bg);
      min-height: 42px; align-items: center;
    }
    .sb-tags-input:focus-within { border-color: var(--accent); }
    .sb-tag {
      display: flex; align-items: center; gap: 0.25rem;
      padding: 0.2rem 0.5rem;
      background: var(--accent-light); color: var(--accent);
      border-radius: 4px; font-size: 0.7rem; font-weight: 500;
    }
    .sb-tag-remove {
      cursor: pointer; opacity: 0.7; font-size: 0.7rem;
    }
    .sb-tag-remove:hover { opacity: 1; }
    .sb-tags-input input {
      border: none; background: transparent;
      font-size: 0.75rem; padding: 0.2rem;
      min-width: 80px; flex: 1;
    }
    .sb-tags-input input:focus { outline: none; }

    .tree-section { margin-bottom: 0.15rem; }

    .tree-section-header {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.72rem; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: pointer; user-select: none;
      transition: color 0.15s ease;
    }
    .tree-section-header:hover { color: var(--text); }
    .tree-section-header .chevron { font-size: 0.55rem; transition: transform 0.15s ease; }
    .tree-section-header.collapsed .chevron { transform: rotate(-90deg); }
    .tree-section-header .header-actions { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s ease; }
    .tree-section-header:hover .header-actions { opacity: 1; }

    .tree-section-body { overflow: hidden; transition: max-height 0.2s ease; }
    .tree-section-body.collapsed { max-height: 0 !important; }

    .tree-item {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tree-item:hover { background: var(--bg-hover); }
    .tree-item.active { background: var(--accent-light); color: var(--accent-hover); }

    .tree-item-indent-1 { padding-left: 1.25rem; }
    .tree-item-indent-2 { padding-left: 2rem; }
    .tree-item-indent-3 { padding-left: 2.75rem; }

    .tree-item-icon {
      width: 16px; height: 16px; border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.5rem; font-weight: 700; flex-shrink: 0;
    }
    .tree-item-icon.person { background: var(--accent-light); color: var(--accent); }
    .tree-item-icon.role { background: var(--magenta-light); color: var(--magenta); }
    .tree-item-icon.skill { background: var(--accent-light); color: var(--accent); }
    .tree-item-icon.atomic { background: var(--success-light); color: var(--success); }
    .tree-item-icon.knowledge { background: var(--warning-light); color: var(--warning); }

    .tree-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .tree-item-dots { display: flex; gap: 1px; }
    .tree-item-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); }
    .tree-item-dot.f1 { background: var(--rose); }
    .tree-item-dot.f2 { background: var(--orange); }
    .tree-item-dot.f3 { background: var(--warning); }
    .tree-item-dot.f4 { background: var(--accent); }
    .tree-item-dot.f5 { background: var(--success); }

    .tree-item-tag {
      font-family: var(--font-mono);
      font-size: 0.5rem; padding: 0.05rem 0.25rem;
      border-radius: 2px; font-weight: 600;
    }
    .tree-item-tag.project { background: var(--bg-muted); color: var(--text-muted); }
    .tree-item-tag.custom { background: var(--accent-light); color: var(--accent); }

    .tree-item-actions { display: flex; gap: 1px; opacity: 0; transition: opacity 0.15s ease; }
    .tree-item:hover .tree-item-actions { opacity: 1; }
    .tree-item-actions .icon-btn { width: 20px; height: 20px; font-size: 0.65rem; }

    /* Skill Builder */
    .skill-builder-tab {
      padding: 0.5rem 1rem;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    .skill-builder-btn {
      width: 100%; padding: 0.5rem;
      background: var(--text); color: white;
      border: none; border-radius: 7px;
      font-size: 0.75rem; font-weight: 600;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      gap: 0.4rem; transition: all 0.15s ease;
    }
    .skill-builder-btn:hover { background: #2a2a3e; transform: translateY(-1px); }
    .skill-builder-btn svg { width: 14px; height: 14px; }

    .skill-list-item {
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem; cursor: pointer;
      display: flex; align-items: center; gap: 0.4rem;
      border-radius: 6px; transition: all 0.15s ease;
    }
    .skill-list-item:hover { background: var(--bg-muted); }
    .skill-list-item.active { background: var(--accent-light); color: var(--accent-hover); }
    .skill-list-item .skill-icon {
      width: 18px; height: 18px; border-radius: 4px;
      background: var(--accent-light); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; font-weight: 700;
    }
    .skill-list-item .skill-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .skill-list-item .skill-steps { font-size: 0.6rem; color: var(--text-muted); }
    .skill-list-item .skill-actions { display: flex; gap: 2px; opacity: 0; }
    .skill-list-item:hover .skill-actions { opacity: 1; }

    /* Prompt Step */
    .prompt-step {
      background: var(--bg-subtle); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem;
      position: relative;
    }
    .prompt-step-header {
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;
    }
    .prompt-step-num {
      font-family: var(--font-mono); font-size: 0.6rem;
      background: var(--text); color: white;
      width: 18px; height: 18px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .prompt-step textarea {
      width: 100%; min-height: 80px;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 0.6rem; font-size: 0.8rem; font-family: var(--font-mono);
      resize: vertical; background: var(--bg);
    }
    .prompt-step textarea:focus { outline: none; border-color: var(--accent); }
    .prompt-step-type {
      display: flex; gap: 0.5rem; margin-top: 0.5rem;
    }
    .prompt-step-type label {
      font-size: 0.65rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 0.25rem; cursor: pointer;
    }
    .prompt-step-type input[type="radio"] { accent-color: var(--accent); }
    .prompt-step-remove {
      position: absolute; top: 0.5rem; right: 0.5rem;
      width: 20px; height: 20px; border: none;
      background: transparent; color: var(--text-muted);
      cursor: pointer; font-size: 0.8rem;
    }
    .prompt-step-remove:hover { color: var(--danger); }

    .add-step-btn {
      width: 100%; padding: 0.6rem;
      border: 1px dashed var(--border); border-radius: 8px;
      background: transparent; color: var(--text-muted);
      font-size: 0.75rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 0.4rem; transition: all 0.15s ease;
    }
    .add-step-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Skill Generator Preview */
    .skill-preview {
      background: #1a1a2e; color: #a8dadc;
      border-radius: 8px; padding: 1rem; margin-top: 1rem;
      font-family: var(--font-mono); font-size: 0.7rem;
      max-height: 300px; overflow-y: auto;
      white-space: pre-wrap; line-height: 1.6;
    }
    .skill-preview-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.75rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(168,218,220,0.2);
    }
    .skill-preview-title { font-weight: 600; color: #f1faee; }
    .skill-preview-copy {
      background: rgba(168,218,220,0.2); border: none;
      color: #a8dadc; padding: 0.3rem 0.6rem;
      border-radius: 4px; cursor: pointer; font-size: 0.65rem;
    }
    .skill-preview-copy:hover { background: rgba(168,218,220,0.3); }

    /* App Layout - Three Column */
    .app-layout {
      display: grid;
      grid-template-columns: var(--col1-width) var(--col2-width) 1fr;
      min-height: 100vh;
    }

    /* Column 1 - 岗位列表 */
    .col-roles {
      background: var(--bg-subtle);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    /* Column 2 - 技能列表 */
    .col-skills {
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    /* Column 3 - 详情展示 */
    .col-detail {
      min-height: 100vh;
      background: var(--bg);
    }

    /* Top Bar */
    .top-bar {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-bar-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .top-bar-logo-icon {
      width: 28px; height: 28px;
      background: var(--text);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-family: var(--font-mono);
      font-size: 0.7rem; font-weight: 600;
    }
    .top-bar-title { font-size: 0.9rem; font-weight: 600; }
    .top-bar-actions { display: flex; gap: 0.25rem; }

    /* Column Header */
    .col-header {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .col-title {
      font-size: 0.72rem; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .col-count {
      font-family: var(--font-mono);
      font-size: 0.6rem; color: var(--text-muted);
    }

    /* Column Body - Scrollable */
    .col-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }
    .col-body::-webkit-scrollbar { width: 4px; }
    .col-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Column Section Header */
    .col-section-header {
      padding: 0.5rem 0.85rem 0.35rem;
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    /* Role Item */
    .role-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.85rem;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s ease;
      border-left: 3px solid transparent;
    }
    .role-item:hover { background: var(--bg-hover); }
    .role-item.active {
      background: var(--accent-light);
      border-left-color: var(--accent);
    }
    .role-item-icon {
      width: 22px; height: 22px;
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 700;
      flex-shrink: 0;
    }
    .role-item-icon.role { background: var(--magenta-light); color: var(--magenta); }
    .role-item-name { flex: 1; font-weight: 500; }
    .role-item-meta { font-size: 0.65rem; color: var(--text-muted); }

    /* Skill Category */
    .skill-cat {
      margin-bottom: 0.5rem;
    }
    .skill-cat-header {
      padding: 0.35rem 0.85rem;
      font-size: 0.62rem; font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
    }
    .skill-cat-items { padding: 0.25rem 0; }

    /* Skill Item */
    .skill-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.85rem 0.45rem 1.1rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
      border-left: 3px solid transparent;
    }
    .skill-item:hover { background: var(--bg-hover); }
    .skill-item.active {
      background: var(--accent-light);
      border-left-color: var(--accent);
    }
    .skill-item.associated { opacity: 1; }
    .skill-item.unassociated { opacity: 0.6; }
    .skill-item-icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.5rem; font-weight: 700;
      flex-shrink: 0;
    }
    .skill-item-icon.skill { background: var(--accent-light); color: var(--accent); }
    .skill-item-icon.atomic { background: var(--success-light); color: var(--success); }
    .skill-item-name { flex: 1; }
    .skill-item-dots { display: flex; gap: 2px; }
    .skill-item-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); }
    .skill-item-dot.filled { border: none; }
    .skill-item-tag {
      font-size: 0.5rem; padding: 0.05rem 0.3rem;
      border-radius: 2px; font-weight: 600;
      font-family: var(--font-mono);
    }
    .skill-item-tag.custom { background: var(--accent-light); color: var(--accent); }

    /* Kp Item */
    .kp-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem 0.35rem 1.35rem;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .kp-item:hover { background: var(--bg-hover); }
    .kp-item.active { background: var(--warning-light); }
    .kp-item-icon {
      width: 14px; height: 14px;
      border-radius: 3px;
      background: var(--warning-light); color: var(--warning);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.45rem; font-weight: 700;
      flex-shrink: 0;
    }
    .kp-item-name { flex: 1; color: var(--text); }
    .kp-item-level { font-size: 0.6rem; color: var(--text-muted); }

    /* Back Button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.75rem;
      margin: 0.5rem 0.85rem;
      font-size: 0.72rem;
      color: var(--accent);
      background: var(--accent-light);
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .back-btn:hover { background: var(--accent); color: white; }

    /* Detail Area */
    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--text-muted);
      text-align: center;
    }
    .detail-empty-icon { font-size: 3rem; opacity: 0.3; margin-bottom: 1rem; }
    .detail-empty-text { font-size: 0.85rem; }

    .detail-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .detail-breadcrumb {
      display: flex; align-items: center; gap: 0.3rem;
      font-size: 0.68rem; color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    .detail-breadcrumb a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .detail-breadcrumb a:hover { text-decoration: underline; }
    .detail-title {
      font-size: 1.1rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .detail-banner {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      margin: 0.75rem 1.5rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .detail-banner .tag {
      font-family: var(--font-mono); font-size: 0.55rem;
      padding: 0.08rem 0.3rem;
      background: var(--magenta-light); color: var(--magenta);
      border-radius: 3px; font-weight: 600;
    }
    .detail-body { padding: 1rem 1.5rem; }

    /* Detail Cards */
    .detail-section { margin-bottom: 1.25rem; }
    .detail-section-title {
      font-size: 0.65rem; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border);
    }
    .detail-cards {
      display: grid;
      gap: 0.75rem;
    }
    .detail-cards.cols-2 { grid-template-columns: 1fr 1fr; }
    .detail-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .detail-card-label {
      font-size: 0.65rem; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }
    .detail-label {
      font-size: 0.65rem; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }
    .detail-card-value { font-size: 0.85rem; color: var(--text); }

    /* Child Items (skill list items) */
    .children-list { display: flex; flex-direction: column; gap: 0.25rem; }
    .child-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .child-item:hover { background: var(--bg-hover); border-color: var(--border-hover); }
    .child-item.associated { border-color: var(--accent); background: var(--accent-light); }
    .child-item.unassociated { opacity: 0.8; }
    .child-name { flex: 1; font-size: 0.82rem; font-weight: 500; }
    .child-desc { font-size: 0.72rem; color: var(--text-muted); }
    .child-meta { font-size: 0.65rem; color: var(--text-muted); }
    .child-actions { display: flex; gap: 0.25rem; }
    .child-item[style*="cursor:default"] { cursor: default !important; }
    .child-item[style*="cursor:default"]:hover { background: var(--bg); border-color: var(--border); }

    /* Detail Grid & Layout */
    .detail-grid {
      display: grid;
      gap: 0.75rem;
    }
    .detail-card.full { grid-column: 1 / -1; }
    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .content-body {
      padding: 1.25rem 1.5rem;
    }
    .content-title {
      font-size: 1.1rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem;
      margin-top: 0.25rem;
    }
    .content-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    /* Project Banner & Breadcrumb */
    .project-banner {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 1rem;
      margin-bottom: 1rem;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
    .project-banner .tag {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 600;
    }

    .kp-detail-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .kp-detail-list li {
      padding: 0.45rem 0.5rem 0.45rem 1.5rem;
      font-size: 0.78rem;
      color: var(--text);
      line-height: 1.6;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .kp-detail-list li:last-child { border-bottom: none; }
    .kp-detail-list li::before {
      content: '';
      position: absolute;
      left: 0.35rem;
      top: 0.85rem;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .kp-detail-list.best-practices li::before { background: var(--success); }
    .kp-detail-list.common-mistakes li::before { background: var(--danger); }

    .kp-code-block {
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      line-height: 1.65;
      overflow-x: auto;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .breadcrumb {
      display: flex; align-items: center; gap: 0.25rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .breadcrumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb-sep { color: var(--text-muted); }

    /* Progress Rating */
    .progress-rating { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .progress-option {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.2rem; cursor: pointer;
      padding: 0.35rem 0.45rem;
      border-radius: 7px;
      border: 2px solid var(--border);
      transition: all 0.15s ease;
      min-width: 52px;
    }
    .progress-option:hover { border-color: var(--border-hover); background: var(--bg); }
    .progress-option.selected { border-width: 2px; }
    .progress-option[data-level="1"].selected { border-color: var(--rose); background: var(--rose-light); }
    .progress-option[data-level="2"].selected { border-color: var(--orange); background: var(--orange-light); }
    .progress-option[data-level="3"].selected { border-color: var(--warning); background: var(--warning-light); }
    .progress-option[data-level="4"].selected { border-color: var(--accent); background: var(--accent-light); }
    .progress-option[data-level="5"].selected { border-color: var(--success); background: var(--success-light); }
    .progress-dots { display: flex; gap: 2px; }
    .progress-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bg-muted); border: 1px solid var(--border); }
    .progress-dot.filled { border: none; }
    .progress-option[data-level="1"] .progress-dot.filled { background: var(--rose); }
    .progress-option[data-level="2"] .progress-dot.filled { background: var(--orange); }
    .progress-option[data-level="3"] .progress-dot.filled { background: var(--warning); }
    .progress-option[data-level="4"] .progress-dot.filled { background: var(--accent); }
    .progress-option[data-level="5"] .progress-dot.filled { background: var(--success); }
    .progress-label { font-size: 0.58rem; font-weight: 500; color: var(--text-secondary); }
    .progress-option.selected .progress-label { font-weight: 600; }

    /* Tech Stack Tags */
    .tech-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tech-tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 0.2rem 0.5rem;
      background: var(--bg-muted);
      border-radius: 4px;
      color: var(--text-secondary);
    }

    /* Steps List */
    .steps-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .step-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.7rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.75rem;
    }
    .step-num {
      font-family: var(--font-mono); font-size: 0.58rem;
      background: var(--text); color: white;
      width: 18px; height: 18px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .step-name { flex: 1; }

    /* Tag Selector */
    .tag-selector { display: flex; gap: 0.4rem; }
    .tag-option {
      padding: 0.35rem 0.85rem;
      border: 2px solid var(--border);
      border-radius: 7px;
      cursor: pointer; font-size: 0.78rem;
      font-weight: 500;
      transition: all 0.15s ease;
      background: var(--bg);
      display: flex; align-items: center; gap: 0.25rem;
    }
    .tag-option:hover { border-color: var(--border-hover); }
    .tag-option.selected.beginner { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
    .tag-option.selected.advanced { border-color: var(--warning); background: var(--warning-light); color: var(--warning); }

    /* Add Button */
    .add-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 0.3rem;
      padding: 0.4rem;
      border: 1px dashed var(--border);
      border-radius: 7px;
      background: transparent; color: var(--text-muted);
      font-size: 0.7rem; cursor: pointer;
      transition: all 0.15s ease;
      margin: 0.25rem 0.85rem;
    }
    .add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

    /* Icon Btn */
    .icon-btn {
      width: 26px; height: 26px;
      border: none; border-radius: 5px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }
    .icon-btn:hover { background: var(--bg-muted); color: var(--text); }

    /* Stats Chips */
    .stats-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .stats-chip {
      display: flex; align-items: center; gap: 0.25rem;
      padding: 0.25rem 0.5rem;
      background: var(--bg-subtle);
      border-radius: 5px; font-size: 0.68rem;
    }
    .stats-chip-dot { width: 5px; height: 5px; border-radius: 50%; }
    .stats-chip-value { font-weight: 600; font-family: var(--font-mono); }
    .stats-chip-label { color: var(--text-secondary); }

    /* Notes */
    .notes-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .note-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem;
    }
    .note-content { font-size: 0.8rem; line-height: 1.6; white-space: pre-wrap; }
    .note-meta { display: flex; gap: 0.6rem; margin-top: 0.35rem; font-size: 0.62rem; color: var(--text-muted); font-family: var(--font-mono); }
    .note-add-row { display: flex; gap: 0.35rem; margin-top: 0.4rem; align-items: flex-start; }
    .note-add-row textarea {
      flex: 1; min-height: 50px; padding: 0.4rem;
      border: 1px solid var(--border); border-radius: 7px;
      font-family: var(--font-sans); font-size: 0.8rem;
      resize: vertical; background: var(--bg);
    }
    .note-add-row textarea:focus { outline: none; border-color: var(--accent); }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg); border-radius: 12px; padding: 1.25rem;
      width: 420px; max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .modal-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; }
    .modal-field { margin-bottom: 0.75rem; }
    .modal-field label { display: block; font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.25rem; }
    .modal-field input, .modal-field textarea {
      width: 100%; padding: 0.5rem 0.65rem;
      border: 1px solid var(--border); border-radius: 7px;
      font-family: var(--font-sans); font-size: 0.82rem;
      color: var(--text); background: var(--bg);
      transition: all 0.15s ease;
    }
    .modal-field input:focus, .modal-field textarea:focus { outline: none; border-color: var(--accent); }
    .modal-field textarea { min-height: 70px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.4rem; margin-top: 1rem; }

    .btn {
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border); border-radius: 7px;
      font-family: var(--font-sans); font-size: 0.75rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s ease;
      background: var(--bg); color: var(--text);
    }
    .btn:hover { background: var(--bg-muted); }
    .btn-primary { background: var(--text); color: white; border-color: var(--text); }
    .btn-primary:hover { opacity: 0.85; }
    .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
    .btn-danger:hover { opacity: 0.85; }
    .btn-sm { padding: 0.25rem 0.55rem; font-size: 0.68rem; }

    /* Toast */
    .toast-container {
      position: fixed; bottom: 1rem; right: 1rem; z-index: 200;
      display: flex; flex-direction: column; gap: 0.25rem;
    }
    .toast {
      padding: 0.45rem 0.8rem;
      background: var(--text); color: white;
      border-radius: 7px; font-size: 0.72rem;
      animation: toastIn 0.2s ease-out;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Skill Builder */
    .skill-builder-section {
      border-top: 1px solid var(--border);
      padding: 0.75rem;
      background: var(--bg-subtle);
      margin-top: auto;
    }
    .skill-builder-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .skill-builder-title {
      font-size: 0.68rem; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .skill-builder-list { max-height: 150px; overflow-y: auto; }
    .skill-builder-list::-webkit-scrollbar { width: 4px; }
    .skill-builder-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .skill-list-item {
      padding: 0.4rem 0.65rem;
      font-size: 0.72rem; cursor: pointer;
      display: flex; align-items: center; gap: 0.35rem;
      border-radius: 6px; transition: all 0.15s ease;
    }
    .skill-list-item:hover { background: var(--bg-muted); }
    .skill-list-item.active { background: var(--accent-light); color: var(--accent-hover); }
    .skill-list-item .skill-icon {
      width: 16px; height: 16px; border-radius: 4px;
      background: var(--accent-light); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.5rem; font-weight: 700;
    }
    .skill-list-item .skill-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .skill-list-item .skill-actions { display: flex; gap: 2px; opacity: 0; }
    .skill-list-item:hover .skill-actions { opacity: 1; }

    /* Responsive */
    @media (max-width: 1024px) {
      .app-layout { grid-template-columns: var(--col1-width) 1fr; }
      .col-skills { display: none; }
    }
    @media (max-width: 768px) {
      .app-layout { grid-template-columns: 1fr; }
      .col-roles { display: none; }
      .col-skills { display: none; }
      .col-detail { display: block; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Column 1: 岗位列表 -->
    <div class="col-roles" id="col-roles">
      <div class="top-bar">
        <div class="top-bar-logo">
          <div class="top-bar-logo-icon">S4</div>
          <span class="top-bar-title">能力树</span>
        </div>
        <div class="top-bar-actions">
          <button class="icon-btn" onclick="exportData()" title="导出">↓</button>
          <button class="icon-btn" onclick="importData()" title="导入">↑</button>
          <button class="icon-btn" onclick="saveCustomData()" title="保存" style="background:var(--success-light);color:var(--success)">✓</button>
          <button class="icon-btn" onclick="openSkillBuilder()" title="Skills 生成器" style="background:var(--accent-light);color:var(--accent)">⚡</button>
        </div>
      </div>
      <div class="col-header">
        <span class="col-title">我的岗位</span>
        <span class="col-count" id="role-count">0</span>
      </div>
      <div class="col-body" id="col-roles-body"></div>
    </div>

    <!-- Column 2: 技能列表 -->
    <div class="col-skills" id="col-skills">
      <div class="col-header">
        <span class="col-title" id="col-skills-title">选择岗位</span>
        <span class="col-count" id="skill-count">0</span>
      </div>
      <div class="col-body" id="col-skills-body"></div>
    </div>

    <!-- Column 3: 详情展示 -->
    <div class="col-detail" id="col-detail"></div>
  </div>
  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal"></div></div>
  <div class="toast-container" id="toast-container"></div>
  <input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImport(event)">

  <!-- Skill Builder Modal -->
  <div class="skill-builder-modal" id="skill-builder-modal">
    <div class="skill-builder-panel">
      <div class="skill-builder-panel-header">
        <span class="skill-builder-panel-title" id="sb-panel-title">⚡ 创建 Skill</span>
        <button class="skill-builder-panel-close" onclick="closeSkillBuilder()">✕</button>
      </div>
      <div class="skill-builder-panel-body">
        <div class="sb-field">
          <label>Skill 名称</label>
          <input type="text" id="sb-skill-name" class="sb-name-input" placeholder="例如：代码审查、数据分析...">
        </div>
        <div class="sb-field">
          <label>描述</label>
          <textarea id="sb-skill-desc" placeholder="简要描述这个 Skill 的用途..."></textarea>
        </div>
        <div class="sb-field">
          <label>分类</label>
          <input type="text" id="sb-skill-category" placeholder="例如：development, operations, product...">
        </div>
        <div class="sb-field">
          <label>标签</label>
          <div class="sb-tags-input" id="sb-tags-container">
            <input type="text" id="sb-tags-input" placeholder="输入标签后按回车添加">
          </div>
        </div>
        <div class="sb-section-title">Prompt 步骤</div>
        <p style="font-size:0.7rem;color:var(--text-muted);margin-bottom:0.75rem">输入任务执行过程中的多个 Prompt，逐步引导 AI 完成复杂任务。每个步骤可以是"LLM 推理"或"格式化输出"。</p>
        <div id="sb-steps-container"></div>
        <button class="add-step-btn" onclick="addPromptStep()">+ 添加步骤</button>
        <div class="skill-preview" id="sb-preview" style="display:none">
          <div class="skill-preview-header">
            <span class="skill-preview-title">生成的 Skill JSON</span>
            <button class="skill-preview-copy" onclick="copySkillJson()">复制</button>
          </div>
          <div id="sb-preview-content"></div>
        </div>
      </div>
      <div class="skill-builder-panel-footer">
        <button class="btn" onclick="closeSkillBuilder()">取消</button>
        <button class="btn btn-primary" onclick="saveSkillBuilder()">保存 Skill</button>
      </div>
    </div>
  </div>

  <script>
    // ===== PROJECT DATA (loaded from API) =====
    let PROJECT = { roles: [], skills: [], atomics: [] };

    async function loadProjectData() {
      try {
        const res = await fetch('/api/project-data');
        if (!res.ok) throw new Error('HTTP ' + res.status);

    // Load: custom data takes priority over sample data
    let data = loadCustomData() || getSampleData();

    function migrateData() {
      let changed = false;
      data.myRoles.forEach(r => {
        if (r.tag === undefined) { r.tag = ''; changed = true; }
        if (!r.notes) {
          r.notes = r.note ? [{ id: genId(), content: r.note, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }] : [];
          changed = true;
        }
        (r.skills || []).forEach(s => {
          if (s.tag === undefined) { s.tag = ''; changed = true; }
          if (!s.notes) {
            s.notes = s.note ? [{ id: genId(), content: s.note, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }] : [];
            changed = true;
          }
          (s.knowledgePoints || []).forEach(k => {
            if (k.tag === undefined) { k.tag = ''; changed = true; }
            if (!k.notes) {
              k.notes = k.note ? [{ id: genId(), content: k.note, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }] : [];
              changed = true;
            }
          });
        });
      });
      if (changed) { saveData(); buildMyRoleMap(); }
      migrated = true;
    }
    if (!migrated) migrateData();

    function loadData() {
      try {

      } catch(e) {}

    function showToast(msg) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; c.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'all 0.2s ease'; setTimeout(() => t.remove(), 200); }, 2000);
    }

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

    // Cache for fast lookups - rebuilt when data changes
    let roleMap = new Map();
    let skillMap = new Map();
    let atomicMap = new Map();
    function rebuildMaps() {
      roleMap = new Map(PROJECT.roles.map(r => [r.id, r]));
      skillMap = new Map(PROJECT.skills.map(s => [s.id, s]));
      atomicMap = new Map(PROJECT.atomics.map(a => [a.id, a]));
    }
    let myRoleMap = new Map();
    function buildMyRoleMap() { myRoleMap = new Map(data.myRoles.map(r => [r.roleId, r])); }
    buildMyRoleMap();

    function getRoleById(id) { return roleMap.get(id); }
    function getSkillById(id) { return skillMap.get(id); }
    function getAtomicById(id) { return atomicMap.get(id); }
    function findMyRole(roleId) { return myRoleMap && myRoleMap.get(roleId); }
    function findMySkill(myRole, skillId) { return (myRole.skills || []).find(s => s.skillId === skillId); }

    // Level dots
    function levelDots(level) {
      if (!level || level < 1) return '';
      return `<span class="tree-item-dots">${[1,2,3,4,5].map(i => `<span class="tree-item-dot ${i <= level ? 'f'+level : ''}"></span>`).join('')}</span>`;
    }

    function renderLevelOptions(current, onClick) {
      return `<div class="progress-rating">${LEVELS.map(l => `
        <div class="progress-option ${current === l.level ? 'selected' : ''}" data-level="${l.level}" onclick="${onClick}(${l.level})">
          <div class="progress-dots">${[1,2,3,4,5].map(i => `<div class="progress-dot ${i <= l.level ? 'filled' : ''}"></div>`).join('')}</div>
          <span class="progress-label">${l.label}</span>
        </div>`).join('')}</div>`;
    }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }

    function renderTagSelector(currentTag, updateFn) {
      return `<div class="tag-selector">

        <div class="tag-option ${currentTag === '加强' ? 'selected advanced' : ''}" onclick="${updateFn}('加强')"><span>💪</span> 加强</div>
      </div>`;
    }

    // Category display names and sort order
    const SKILL_CATEGORY_NAMES = {

      'security': '安全',
      'operations': '运维',

      'qa': '测试',
      'product': '产品',
      'cloud-security': '云安全',
      'development': '开发',
      'network': '网络',
      'filesystem': '文件系统',
      'database': '数据库',
      'data': '数据',
      'container': '容器',
      'validation': '验证',
      'system': '系统',
      'testing': '测试',
      'reliability': '可靠性'
    };
    const CATEGORY_ORDER = ['sre-core','observability','incident','platform','security','operations','devops','cloud','architecture','backend','frontend','qa','product','cloud-security','development','network','filesystem','database','data','container','validation','system','testing','reliability','custom','other'];

    // Render skills grouped by category
    function renderSkillsByCategory(skillIds, myRole, type) {
      const groups = {};
      skillIds.forEach(sid => {
        const ps = getSkillById(sid);
        const cat = ps ? (ps.category || 'other') : 'custom';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push({ id: sid, skill: ps, type });
      });

      const sortedCats = Object.keys(groups).sort((a, b) => {
        const ai = CATEGORY_ORDER.indexOf(a);
        const bi = CATEGORY_ORDER.indexOf(b);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });

      let html = '';
      sortedCats.forEach(cat => {
        const catName = SKILL_CATEGORY_NAMES[cat] || cat;
        const items = groups[cat];
        html += `<div style="margin-bottom:0.75rem">
          <div style="font-size:0.65rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:0.3rem;padding-bottom:0.2rem;border-bottom:1px solid var(--border)">${catName} (${items.length})</div>
          <div class="children-list">`;
        items.forEach(item => {
          const mySk = myRole ? findMySkill(myRole, item.id) : null;
          const skName = item.skill ? item.skill.name : item.id;
          const kpCount = item.skill && item.skill.knowledgePoints ? item.skill.knowledgePoints.length : 0;
          const clickFn = mySk ? `selectMySkill('${myRole.roleId}','${item.id}')` : (item.skill ? `selectProjectSkill('${item.id}')` : '');
          html += `<div class="child-item ${mySk ? 'associated' : 'unassociated'}" onclick="${clickFn}">
            <span class="tree-item-icon skill">技</span>
            <span class="child-name">${esc(skName)}</span>
            ${mySk ? `${levelDots(mySk.level)}<span class="child-meta">${LEVELS[(mySk.level||1)-1].label}</span>` : ''}
            ${item.skill && kpCount > 0 ? `<span class="child-meta">${kpCount} 知识点</span>` : ''}
            ${mySk ? '<span class="tree-item-tag custom">已关联</span>' : (myRole && item.skill ? `<button class="btn btn-sm" onclick="event.stopPropagation();associateSkill('${myRole.roleId}','${item.id}')">+ 关联</button>` : '')}
          </div>`;
        });
        html += `</div></div>`;
      });
      return html;
    }

    // Render atomic skills grouped by category
    function renderAtomicSkillsByCategory(atomicIds, myRole) {
      const groups = {};
      atomicIds.forEach(aid => {
        const pa = getAtomicById(aid);
        const cat = pa ? (pa.category || 'other') : 'custom';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push({ id: aid, atomic: pa });
      });

      const sortedCats = Object.keys(groups).sort((a, b) => {
        const ai = CATEGORY_ORDER.indexOf(a);
        const bi = CATEGORY_ORDER.indexOf(b);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });

      let html = '';
      sortedCats.forEach(cat => {
        const catName = SKILL_CATEGORY_NAMES[cat] || cat;
        const items = groups[cat];
        html += `<div style="margin-bottom:0.75rem">
          <div style="font-size:0.65rem;font-weight:600;color:var(--success);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:0.3rem;padding-bottom:0.2rem;border-bottom:1px solid var(--border)">${catName} (${items.length})</div>
          <div class="children-list">`;
        items.forEach(item => {
          const mySk = myRole ? findMySkill(myRole, item.id) : null;
          const aName = item.atomic ? item.atomic.name : item.id;
          const clickFn = mySk ? `selectMySkill('${myRole.roleId}','${item.id}')` : (item.atomic ? `selectProjectAtomic('${item.id}')` : '');
          html += `<div class="child-item ${mySk ? 'associated' : 'unassociated'}" onclick="${clickFn}">
            <span class="tree-item-icon atomic">原</span>
            <span class="child-name">${esc(aName)}</span>
            ${mySk ? `${levelDots(mySk.level)}<span class="child-meta">${LEVELS[(mySk.level||1)-1].label}</span>` : ''}
            ${mySk ? '<span class="tree-item-tag custom">已关联</span>' : (myRole && item.atomic ? `<button class="btn btn-sm" onclick="event.stopPropagation();associateSkill('${myRole.roleId}','${item.id}')">+ 关联</button>` : '')}
          </div>`;
        });
        html += `</div></div>`;
      });
      return html;
    }

    function renderNotesSection(notes, targetType, roleId, skillId, kpId) {
      const p = targetType === 'role' ? `'${roleId}','',''` :
                targetType === 'skill' ? `'${roleId}','${skillId}',''` :
                `'${roleId}','${skillId}','${kpId}'`;
      let html = `<div class="notes-list">`;
      (notes || []).forEach(n => {
        html += `<div class="note-item" id="note-${n.id}">
          <div class="note-item-content">${esc(n.content)}</div>
          <div class="note-item-meta">
            <span>创建: ${formatTime(n.createdAt)}</span>
            ${n.updatedAt && n.updatedAt !== n.createdAt ? `<span>修改: ${formatTime(n.updatedAt)}</span>` : ''}
          </div>
          <div class="note-item-actions">
            <button class="btn btn-sm" onclick="startEditNote('${targetType}',${p},'${n.id}')">✎ 编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deleteNote('${targetType}',${p},'${n.id}')">删除</button>
          </div>
        </div>`;
      });
      html += `<div class="note-add-row">
        <textarea id="new-note-${targetType}" placeholder="添加新备注..."></textarea>
        <button class="btn btn-primary btn-sm" style="white-space:nowrap" onclick="addNote('${targetType}',${p})">添加备注</button>
      </div></div>`;
      return html;
    }

    function getNotesTarget(type, roleId, skillId, kpId) {
      if (type === 'role') return findMyRole(roleId);
      if (type === 'skill') {
        const r = findMyRole(roleId);
        return r ? (r.skills||[]).find(s => s.skillId === skillId) : null;
      }
      if (type === 'kp') {
        const r = findMyRole(roleId);
        if (!r) return null;
        const sk = (r.skills||[]).find(s => s.skillId === skillId);
        return sk ? (sk.knowledgePoints||[]).find(k => k.kpId === kpId) : null;
      }
      return null;
    }

    function addNote(type, roleId, skillId, kpId) {
      const input = document.getElementById('new-note-' + type);
      if (!input || !input.value.trim()) { showToast('请输入备注内容'); return; }
      const target = getNotesTarget(type, roleId, skillId, kpId);
      if (!target) return;
      if (!target.notes) target.notes = [];
      const now = new Date().toISOString();
      target.notes.push({ id: genId(), content: input.value.trim(), createdAt: now, updatedAt: now });
      saveData(); render();
      showToast('备注已添加');
    }

    function deleteNote(type, roleId, skillId, kpId, noteId) {
      if (!confirm('确定删除该备注？')) return;
      const target = getNotesTarget(type, roleId, skillId, kpId);
      if (!target) return;
      target.notes = (target.notes||[]).filter(n => n.id !== noteId);
      saveData(); render();
      showToast('备注已删除');
    }

    function startEditNote(type, roleId, skillId, kpId, noteId) {
      const target = getNotesTarget(type, roleId, skillId, kpId);
      if (!target) return;
      const note = (target.notes||[]).find(n => n.id === noteId);
      if (!note) return;
      const el = document.getElementById('note-' + noteId);
      if (!el) return;
      const p = type === 'role' ? `'${roleId}','',''` :
                type === 'skill' ? `'${roleId}','${skillId}',''` :
                `'${roleId}','${skillId}','${kpId}'`;
      el.innerHTML = `
        <textarea class="note-textarea" id="edit-note-${noteId}" style="min-height:60px">${esc(note.content)}</textarea>
        <div class="note-item-actions" style="margin-top:0.5rem">
          <button class="btn btn-primary btn-sm" onclick="saveEditNote('${type}',${p},'${noteId}')">保存</button>
          <button class="btn btn-sm" onclick="render()">取消</button>
        </div>`;
      document.getElementById('edit-note-' + noteId).focus();
    }

    function saveEditNote(type, roleId, skillId, kpId, noteId) {
      const input = document.getElementById('edit-note-' + noteId);
      if (!input || !input.value.trim()) { showToast('备注不能为空'); return; }
      const target = getNotesTarget(type, roleId, skillId, kpId);
      if (!target) return;
      const note = (target.notes||[]).find(n => n.id === noteId);
      if (!note) return;
      note.content = input.value.trim();
      note.updatedAt = new Date().toISOString();
      saveData(); render();
      showToast('备注已更新');
    }

    function updateMyRoleTag(tag) {
      const myRole = findMyRole(selectedPath.roleId);
      if (myRole) { myRole.tag = myRole.tag === tag ? '' : tag; saveData(); render(); }
    }
    function updateMySkillTag(tag) {
      const myRole = findMyRole(selectedPath.roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);
      if (sk) { sk.tag = sk.tag === tag ? '' : tag; saveData(); render(); }
    }
    function updateMyKpTag(tag) {
      const myRole = findMyRole(selectedPath.roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);
      if (!sk) return;
      const kp = (sk.knowledgePoints||[]).find(k => k.kpId === selectedPath.kpId);
      if (kp) { kp.tag = kp.tag === tag ? '' : tag; saveData(); render(); }
    }

    // ===== RENDER =====
    function render() {
      renderColRoles();

      renderColDetail();

    // Column 1: 岗位列表
    function renderColRoles() {
      const body = document.getElementById('col-roles-body');
      document.getElementById('role-count').textContent = data.myRoles.length;

      let html = '';

      // Section: 我的岗位
      html += `<div class="col-section-header">我的岗位 (${data.myRoles.length})</div>`;
      data.myRoles.forEach(myRole => {
        const pr = getRoleById(myRole.roleId);
        const name = pr ? pr.name : (myRole.customName || myRole.roleId);
        const isActive = selectedPath && selectedPath.type === 'myRole' && selectedPath.roleId === myRole.roleId;
        const skCnt = (myRole.skills||[]).length;

        html += `<div class="role-item ${isActive ? 'active' : ''}" onclick="selectMyRole('${myRole.roleId}')">
          <span class="role-item-icon role">岗</span>
          <span class="role-item-name">${esc(name)}</span>
          <span class="role-item-meta">${skCnt}</span>
        </div>`;
      });

      // Section: 项目岗位库
      html += `<div class="col-section-header" style="margin-top:1rem">项目岗位库 (${PROJECT.roles.length})</div>`;
      PROJECT.roles.forEach(pr => {
        const associated = !!findMyRole(pr.id);
        const isActive = selectedPath && selectedPath.type === 'projectRole' && selectedPath.roleId === pr.id;
        html += `<div class="role-item ${isActive ? 'active' : ''} ${associated ? 'associated' : ''}" onclick="selectProjectRole('${pr.id}')">
          <span class="role-item-icon role">岗</span>
          <span class="role-item-name">${esc(pr.name)}</span>
          <span class="role-item-meta">${associated ? '已关联' : pr.mainSkills.length + '技'}</span>
        </div>`;
      });

      html += `<button class="add-btn" onclick="showCatalog('role')">+ 添加岗位</button>`;
      body.innerHTML = html;
    }

    // Column 2: 技能列表
    function renderColSkills() {
      const body = document.getElementById('col-skills-body');
      const title = document.getElementById('col-skills-title');

      // Case 1: Show knowledge points for a selected skill
      if (selectedPath && (selectedPath.type === 'skillDetail' || selectedPath.type === 'kpDetail')) {
        const roleId = selectedPath.roleId;
        const skillId = selectedPath.type === 'kpDetail' ? selectedPath.skillId : selectedPath.skillId;
        const ps = getSkillById(skillId);
        const pa = getAtomicById(skillId);
        const skName = ps ? ps.name : (pa ? pa.name : skillId);

        title.textContent = skName;

        // Show back button and knowledge points
        let html = `<button class="back-btn" onclick="selectMyRole('${roleId}')">← 返回岗位</button>`;
        html += `<div class="col-section-header">知识点 (${(ps && ps.knowledgePoints) ? ps.knowledgePoints.length : 0})</div>`;

        const kps = (ps && ps.knowledgePoints) || [];
        kps.forEach(kp => {
          html += `<div class="kp-item" onclick="selectKpDetail('${roleId}','${skillId}','${kp.id}')">
            <span class="kp-item-icon">知</span>
            <span class="kp-item-name">${esc(kp.name || kp.id)}</span>
          </div>`;
        });

        if (kps.length === 0) {
          html += '<div style="padding:1rem;color:var(--text-muted);font-size:0.78rem">无知识点</div>';

        return;

        title.textContent = '选择岗位';
        document.getElementById('skill-count').textContent = '0';
        body.innerHTML = '<div style="padding:1rem;color:var(--text-muted);font-size:0.78rem;text-align:center">请先选择左侧岗位</div>';
        return;
      }

      let skills = [];

      if (selectedPath.type === 'myRole' || selectedPath.type === 'projectRole') {
        const pr = getRoleById(selectedPath.roleId);
        title.textContent = pr ? pr.name : selectedPath.roleId;
        skills = pr ? pr.mainSkills : [];

      if (skills.length === 0) {
        body.innerHTML = '';
        return;
      }

      // Group by category
      const groups = {};
      skills.forEach(sid => {
        const ps = getSkillById(sid);
        const cat = ps ? (ps.category || 'other') : 'custom';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push({ id: sid, skill: ps });
      });

      const sortedCats = Object.keys(groups).sort((a, b) => {
        const ai = CATEGORY_ORDER.indexOf(a);
        const bi = CATEGORY_ORDER.indexOf(b);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });

      let html = '';
      sortedCats.forEach(cat => {
        const catName = SKILL_CATEGORY_NAMES[cat] || cat;
        const items = groups[cat];
        html += `<div class="skill-cat">
          <div class="skill-cat-header">${catName} (${items.length})</div>
          <div class="skill-cat-items">`;
        items.forEach(item => {

            <span class="skill-item-name">${esc(item.skill ? item.skill.name : item.id)}</span>
          </div>`;
        });
        html += `</div></div>`;
      });

      body.innerHTML = html;
    }

    // ===== SKILL DETAIL (for project role browsing) =====

      const skName = ps ? ps.name : pa.name;
      const skDesc = ps ? ps.desc : pa.desc;

      const kps = (ps && ps.knowledgePoints) || [];

      el.innerHTML = `
        <div class="content-header">
          <div>
            <div class="breadcrumb">
              <a onclick="selectMyRole('${roleId}')">${esc(pr ? pr.name : roleId)}</a>

            </div>

          </div>
          <div style="display:flex;gap:0.4rem">

          </div>
        </div>
        <div class="content-body">
          ${ps ? `<div class="project-banner"><span class="tag">项目</span> ${esc(skNameEn)} · ${esc(skDesc)}</div>` : `<div class="project-banner"><span class="tag">原子</span> ${esc(skNameEn)} · ${esc(skDesc)}</div>`}

            <div class="detail-card full">
              <div class="detail-label">知识点 (${kps.length})</div>
              <div class="children-list">
                ${kps.map(kp => `
                  <div class="child-item" onclick="selectKpDetail('${roleId}','${skillId}','${kp.id}')">
                    <span class="tree-item-icon knowledge">知</span>
                    <span class="child-name">${esc(kp.name || kp.id)}</span>
                    <span class="child-desc">${esc(kp.desc || '')}</span>

                  </div>`;
                }).join('')}
              </div>
            </div>` : ''}

          <div class="project-banner"><span class="tag">描述</span> ${esc(kp.desc)}</div>` : ''}

          <div class="detail-grid">
            ${kp.keyPoints && kp.keyPoints.length > 0 ? `

              <div class="detail-label">核心要点 (${kp.keyPoints.length})</div>

              <div class="detail-label">代码示例</div>

            </div>` : ''}

            <div class="detail-card full">
              <div class="detail-label">最佳实践</div>
              <ul class="kp-detail-list best-practices">
                ${kp.bestPractices.map(p => `<li>${esc(p)}</li>`).join('')}
              </ul>
            </div>` : ''}

            ${kp.commonMistakes && kp.commonMistakes.length > 0 ? `

              <div class="detail-label">常见错误</div>

                ${kp.commonMistakes.map(p => `<li>${esc(p)}</li>`).join('')}

            ${!kp.summary && !kp.keyPoints?.length ? `
            <div class="detail-card full">
              <div class="detail-label">知识点说明</div>

    // ===== SELECTION =====
    function selectPerson() { selectedPath = { type: 'person' }; render(); }
    function selectMyRole(roleId) { selectedPath = { type: 'myRole', roleId }; render(); }
    function selectMySkill(roleId, skillId) { selectedPath = { type: 'mySkill', roleId, skillId }; render(); }
    function selectMyKp(roleId, skillId, kpId) { selectedPath = { type: 'myKp', roleId, skillId, kpId }; render(); }
    function selectProjectRole(roleId) { selectedPath = { type: 'projectRole', roleId }; render(); }
    function selectProjectSkill(skillId) { selectedPath = { type: 'projectSkill', skillId }; render(); }
    function selectProjectAtomic(atomicId) { selectedPath = { type: 'projectAtomic', atomicId }; render(); }
    function selectSkillDetail(roleId, skillId) { selectedPath = { type: 'skillDetail', roleId, skillId }; render(); }
    function selectKpDetail(roleId, skillId, kpId) { selectedPath = { type: 'kpDetail', roleId, skillId, kpId }; render(); }

    function toggleSection(header) {
      header.classList.toggle('collapsed');
      header.nextElementSibling.classList.toggle('collapsed');
    }

    // ===== ASSOCIATION =====
    function associateRole(roleId) {
      if (findMyRole(roleId)) { showToast('已关联'); return; }
      const pr = getRoleById(roleId);
      const myRole = { roleId, level: 0, note: '', tag: '', notes: [], skills: [] };

      // Auto-associate all skills from project role + knowledge points
      if (pr) {
        pr.mainSkills.forEach(sid => {
          const ps = getSkillById(sid);
          const kps = (ps && ps.knowledgePoints) ? ps.knowledgePoints.map(kp => ({
            kpId: kp.id, name: kp.name, level: 0, note: '', tag: '', notes: []
          })) : [];
          myRole.skills.push({ skillId: sid, name: '', level: 0, note: '', tag: '', notes: [], knowledgePoints: kps });
        });
        pr.atomicSkills.forEach(aid => {
          if (!myRole.skills.find(s => s.skillId === aid)) {
            myRole.skills.push({ skillId: aid, name: '', level: 0, note: '', tag: '', notes: [], knowledgePoints: [] });
          }
        });
      }

      data.myRoles.push(myRole);
      saveData();
      selectedPath = { type: 'myRole', roleId };
      render();
      showToast(`已关联岗位: ${pr ? pr.name : roleId}`);
    }

    function removeMyRole(roleId) {
      const pr = getRoleById(roleId);
      if (!confirm(`确定取消关联岗位「${pr ? pr.name : roleId}」及其所有技能？`)) return;
      data.myRoles = data.myRoles.filter(r => r.roleId !== roleId);
      saveData();
      selectedPath = { type: 'person' };
      render();
      showToast('已取消关联');
    }

    function associateSkill(roleId, skillId) {
      const myRole = findMyRole(roleId);
      if (!myRole) return;
      if (findMySkill(myRole, skillId)) { showToast('已关联'); return; }
      if (!myRole.skills) myRole.skills = [];
      myRole.skills.push({ skillId, name: '', level: 0, note: '', tag: '', notes: [], knowledgePoints: [] });
      saveData();
      selectedPath = { type: 'mySkill', roleId, skillId };
      render();
      const ps = getSkillById(skillId);
      const pa = getAtomicById(skillId);
      showToast(`已关联: ${ps ? ps.name : (pa ? pa.name : skillId)}`);
    }

    function removeMySkill(roleId, skillId) {
      const myRole = findMyRole(roleId);
      if (!myRole) return;
      myRole.skills = (myRole.skills||[]).filter(s => s.skillId !== skillId);
      saveData();
      selectedPath = { type: 'myRole', roleId };
      render();
      showToast('已移除技能');
    }

    // ===== UPDATES =====
    function updateMyRoleLevel(level) {
      const myRole = findMyRole(selectedPath.roleId);
      if (myRole) { myRole.level = level; saveData(); render(); }
    }
    function updateMyRoleNote(note) {
      const myRole = findMyRole(selectedPath.roleId);
      if (myRole) { myRole.note = note; saveData(); }
    }
    function updateMySkillLevel(level) {
      const myRole = findMyRole(selectedPath.roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);
      if (sk) { sk.level = level; saveData(); render(); }
    }
    function updateMySkillNote(note) {
      const myRole = findMyRole(selectedPath.roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);
      if (sk) { sk.note = note; saveData(); }
    }
    function updateMyKpLevel(level) {
      const myRole = findMyRole(selectedPath.roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);
      if (!sk) return;
      const kp = (sk.knowledgePoints||[]).find(k => k.kpId === selectedPath.kpId);
      if (kp) { kp.level = level; saveData(); render(); }
    }
    function updateMyKpNote(note) {
      const myRole = findMyRole(selectedPath.roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === selectedPath.skillId);
      if (!sk) return;
      const kp = (sk.knowledgePoints||[]).find(k => k.kpId === selectedPath.kpId);
      if (kp) { kp.note = note; saveData(); }
    }

    // ===== KNOWLEDGE POINTS =====
    function addMyKp(roleId, skillId) {
      showModal('添加知识点', { name: '', note: '', level: 0 }, (formData) => {
        if (!formData.name.trim()) { showToast('请输入名称'); return false; }
        const myRole = findMyRole(roleId);
        if (!myRole) return false;
        const sk = (myRole.skills||[]).find(s => s.skillId === skillId);
        if (!sk) return false;
        if (!sk.knowledgePoints) sk.knowledgePoints = [];
        sk.knowledgePoints.push({ kpId: genId(), name: formData.name.trim(), note: formData.note, level: formData.level, tag: '', notes: [] });
        saveData();
        selectedPath = { type: 'mySkill', roleId, skillId };
        render();
        return true;
      });
    }

    function editMyKp(roleId, skillId, kpId) {
      const myRole = findMyRole(roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === skillId);
      if (!sk) return;
      const kp = (sk.knowledgePoints||[]).find(k => k.kpId === kpId);
      if (!kp) return;
      showModal('编辑知识点', { name: kp.name || '', note: kp.note || '', level: kp.level || 0 }, (formData) => {
        if (!formData.name.trim()) { showToast('请输入名称'); return false; }
        kp.name = formData.name.trim();
        kp.note = formData.note;
        kp.level = formData.level;
        saveData();
        render();
        return true;
      });
    }

    function removeMyKp(roleId, skillId, kpId) {
      if (!confirm('确定删除该知识点？')) return;
      const myRole = findMyRole(roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === skillId);
      if (!sk) return;
      sk.knowledgePoints = (sk.knowledgePoints||[]).filter(k => k.kpId !== kpId);
      saveData();
      selectedPath = { type: 'mySkill', roleId, skillId };
      render();
      showToast('已删除知识点');
    }

    // ===== CUSTOM ITEMS =====
    function addCustomSkill(roleId) {
      showModal('添加自定义技能', { name: '', note: '', level: 0 }, (formData) => {
        if (!formData.name.trim()) { showToast('请输入名称'); return false; }
        const myRole = findMyRole(roleId);
        if (!myRole) return false;
        if (!myRole.skills) myRole.skills = [];
        const newId = 'custom-' + genId();
        myRole.skills.push({ skillId: newId, name: formData.name.trim(), level: formData.level, note: formData.note, tag: '', notes: [], knowledgePoints: [] });
        saveData();
        selectedPath = { type: 'mySkill', roleId, skillId: newId };
        render();
        return true;
      });
    }

    function editCustomSkill(roleId, skillId) {
      const myRole = findMyRole(roleId);
      if (!myRole) return;
      const sk = (myRole.skills||[]).find(s => s.skillId === skillId);
      if (!sk) return;
      showModal('编辑技能', { name: sk.name || '', note: sk.note || '', level: sk.level || 0 }, (formData) => {
        if (!formData.name.trim()) { showToast('请输入名称'); return false; }
        sk.name = formData.name.trim();
        sk.note = formData.note;
        sk.level = formData.level;
        saveData();
        render();
        return true;
      });
    }

    function editCustomRole(roleId) {
      const myRole = findMyRole(roleId);
      if (!myRole) return;
      showModal('编辑岗位', { name: myRole.customName || '', note: myRole.note || '', level: myRole.level || 0 }, (formData) => {
        if (!formData.name.trim()) { showToast('请输入名称'); return false; }
        myRole.customName = formData.name.trim();
        myRole.note = formData.note;
        myRole.level = formData.level;
        saveData();
        render();
        return true;
      });
    }

    // ===== CATALOG MODAL =====
    function showCatalog(type, roleId, skillId) {
      if (type === 'role') {
        const items = PROJECT.roles.filter(pr => !findMyRole(pr.id));
        const overlay = document.getElementById('modal-overlay');
        const modal = document.getElementById('modal');
        modal.innerHTML = `
          <div class="modal-title">从项目岗位库添加</div>
          <div style="max-height:400px;overflow-y:auto">
            <div class="children-list">
              ${items.length === 0 ? '<div style="color:var(--text-muted);font-size:0.8rem;padding:0.5rem">所有项目岗位已关联</div>' : ''}
              ${items.map(pr => `
                <div class="child-item" onclick="closeModal();associateRole('${pr.id}')" style="cursor:pointer">
                  <span class="tree-item-icon role">岗</span>
                  <span class="child-name">${esc(pr.name)}</span>
                  <span class="child-desc">${esc(pr.desc)}</span>
                  <span class="child-meta">${pr.mainSkills.length} 技能</span>
                </div>`).join('')}
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn" onclick="closeModal();addCustomRoleModal()">+ 自定义岗位</button>

      } else if (type === 'skill') {
        const myRole = findMyRole(roleId);
        if (!myRole) return;
        const pr = getRoleById(roleId);
        const availableSkills = PROJECT.skills.filter(ps => !(myRole.skills||[]).find(s => s.skillId === ps.id));
        const availableAtomics = PROJECT.atomics.filter(pa => !(myRole.skills||[]).find(s => s.skillId === pa.id));
        const overlay = document.getElementById('modal-overlay');
        const modal = document.getElementById('modal');
        modal.innerHTML = `
          <div class="modal-title">添加技能</div>
          <div style="max-height:400px;overflow-y:auto">
            <div style="margin-bottom:0.5rem;font-size:0.7rem;font-weight:600;color:var(--text-secondary)">复合技能 (${availableSkills.length})</div>
            <div class="children-list" style="margin-bottom:1rem">
              ${availableSkills.map(ps => `
                <div class="child-item" onclick="closeModal();associateSkill('${roleId}','${ps.id}')">
                  <span class="tree-item-icon skill">技</span>
                  <span class="child-name">${esc(ps.name)}</span>
                  <span class="child-desc">${esc(ps.desc)}</span>
                </div>`).join('')}
            </div>
            <div style="margin-bottom:0.5rem;font-size:0.7rem;font-weight:600;color:var(--text-secondary)">原子技能 (${availableAtomics.length})</div>
            <div class="children-list">
              ${availableAtomics.map(pa => `
                <div class="child-item" onclick="closeModal();associateSkill('${roleId}','${pa.id}')">
                  <span class="tree-item-icon atomic">原</span>
                  <span class="child-name">${esc(pa.name)}</span>
                  <span class="child-desc">${esc(pa.desc)}</span>
                </div>`).join('')}

          </div>
          <div class="modal-actions">
            <button class="btn" onclick="closeModal();addCustomSkill('${roleId}')">+ 自定义技能</button>
            <button class="btn" onclick="closeModal()">关闭</button>
          </div>`;
