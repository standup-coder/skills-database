<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Logo 设计选择</title>
  <style>
    body { font-family: Inter, sans-serif; padding: 40px; background: #f8fafc; }
    h1 { text-align: center; color: #1e293b; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; max-width: 900px; margin: 0 auto; }
    .logo-item { background: white; border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .logo-item img { width: 100px; height: 100px; margin-bottom: 15px; }
    .logo-item h3 { margin: 0 0 8px; color: #1e293b; font-size: 16px; }
    .logo-item p { margin: 0; color: #64748b; font-size: 13px; }
    .selected { border: 3px solid #326CE5; }
  </style>
</head>
<body>
  <h1>🎨 Skills4Coder Logo 设计选择</h1>
  <div class="grid">
    <div class="logo-item">
      <img src="logo-v1.svg" alt="V1">
      <h3>版本 1: 纯 S</h3>
      <p>极简设计，仅 S 字母</p>
    </div>
    <div class="logo-item">
      <img src="logo-v2.svg" alt="V2">
      <h3>版本 2: S + 下划线</h3>
      <p>下划线代表代码/基础</p>
    </div>
    <div class="logo-item">
      <img src="logo-v3.svg" alt="V3">
      <h3>版本 3: S + 括号</h3>
      <p>括号象征代码函数</p>
    </div>
    <div class="logo-item">
      <img src="logo-v4.svg" alt="V4">
      <h3>版本 4: 线条 S</h3>
      <p>极简线条，现代感</p>
    </div>
    <div class="logo-item">
      <img src="logo-v5.svg" alt="V5">
      <h3>版本 5: S4C</h3>
      <p>缩写形式，品牌名</p>
    </div>
    <div class="logo-item">
      <img src="logo-v6.svg" alt="V6">
      <h3>版本 6: 六边形</h3>
      <p>类似 CNCF 风格</p>
    </div>
  </div>
</body>
</html>
