<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#326CE5"/>
      <stop offset="100%" style="stop-color:#5c8af5"/>
    </linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8"/>
      <stop offset="100%" style="stop-color:#5ce1e6"/>
    </linearGradient>
    <linearGradient id="atomicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#ff8c61"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#1e293b">
    三层架构模型
  </text>
  
  <!-- Role Layer -->
  <g transform="translate(100, 70)">
    <rect x="0" y="0" width="600" height="110" rx="16" fill="url(#roleGrad)" filter="url(#shadow)"/>
    <text x="30" y="35" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="white">
      🎯 Role (岗位)
    </text>
    <text x="160" y="35" font-family="Inter, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">
      JD = 主 Skills 集合
    </text>
    
    <!-- Role Items -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="130" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="65" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#326CE5">Frontend Dev</text>
    </g>
    <g transform="translate(170, 55)">
      <rect x="0" y="0" width="130" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="65" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#326CE5">Backend Dev</text>
    </g>
    <g transform="translate(310, 55)">
      <rect x="0" y="0" width="130" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="65" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#326CE5">Architect</text>
    </g>
    <g transform="translate(450, 55)">
      <rect x="0" y="0" width="120" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="60" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#326CE5">QA Engineer</text>
    </g>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(400, 190)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#64748b">↓</text>
    <text x="0" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">组合调用</text>
  </g>
  
  <!-- Skills Layer -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="600" height="110" rx="16" fill="url(#skillGrad)" filter="url(#shadow)"/>
    <text x="30" y="35" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="white">
      🧩 Composite Skills
    </text>
    <text x="230" y="35" font-family="Inter, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">
      可复用的复合技能模块
    </text>
    
    <!-- Skill Items -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="130" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="65" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#00B4D8">Code Review</text>
    </g>
    <g transform="translate(170, 55)">
      <rect x="0" y="0" width="130" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="65" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#00B4D8">API Design</text>
    </g>
    <g transform="translate(310, 55)">
      <rect x="0" y="0" width="130" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="65" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#00B4D8">Architecture</text>
    </g>
    <g transform="translate(450, 55)">
      <rect x="0" y="0" width="120" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="60" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#00B4D8">Testing</text>
    </g>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(400, 340)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#64748b">↓</text>
    <text x="0" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">编排执行</text>
  </g>
  
  <!-- Atomic Layer -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="600" height="100" rx="16" fill="url(#atomicGrad)" filter="url(#shadow)"/>
    <text x="30" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="white">
      ⚡ Atomic Skills
    </text>
    <text x="190" y="32" font-family="Inter, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">
      最基础的能力单元
    </text>
    
    <!-- Atomic Items -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="100" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="50" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF6B35">read_file</text>
    </g>
    <g transform="translate(140, 50)">
      <rect x="0" y="0" width="100" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="50" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF6B35">write_code</text>
    </g>
    <g transform="translate(250, 50)">
      <rect x="0" y="0" width="100" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="50" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF6B35">run_tests</text>
    </g>
    <g transform="translate(360, 50)">
      <rect x="0" y="0" width="100" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="50" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF6B35">git_commit</text>
    </g>
    <g transform="translate(470, 50)">
      <rect x="0" y="0" width="100" height="36" rx="8" fill="white" fill-opacity="0.95"/>
      <text x="50" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF6B35">api_call</text>
    </g>
  </g>
</svg>
