<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3c873a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6dbf6d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa" rx="20"/>
  
  <!-- Tree trunk -->
  <rect x="190" y="180" width="20" height="80" fill="#8b4513" rx="5"/>
  
  <!-- Tree levels -->
  <polygon points="200,20 120,100 280,100" fill="url(#grad1)" opacity="0.9"/>
  <polygon points="200,70 100,160 300,160" fill="url(#grad1)" opacity="0.8"/>
  <polygon points="200,120 80,220 320,220" fill="url(#grad1)" opacity="0.7"/>
  
  <!-- Skill icons on tree -->
  <circle cx="150" cy="130" r="15" fill="#fff" stroke="#3c873a" stroke-width="2"/>
  <text x="150" y="136" font-size="14" text-anchor="middle" fill="#3c873a">💻</text>
  
  <circle cx="250" cy="130" r="15" fill="#fff" stroke="#3c873a" stroke-width="2"/>
  <text x="250" y="136" font-size="14" text-anchor="middle" fill="#3c873a">🏗️</text>
  
  <circle cx="120" cy="180" r="15" fill="#fff" stroke="#3c873a" stroke-width="2"/>
  <text x="120" y="186" font-size="14" text-anchor="middle" fill="#3c873a">🧪</text>
  
  <circle cx="280" cy="180" r="15" fill="#fff" stroke="#3c873a" stroke-width="2"/>
  <text x="280" y="186" font-size="14" text-anchor="middle" fill="#3c873a">🔧</text>
  
  <circle cx="200" cy="80" r="18" fill="#fff" stroke="#3c873a" stroke-width="3"/>
  <text x="200" y="87" font-size="18" text-anchor="middle" fill="#3c873a">🌟</text>
  
  <!-- Ground -->
  <ellipse cx="200" cy="260" rx="150" ry="20" fill="#e8f5e9"/>
</svg>
